<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>計畫盤 Trip Board</title>
<style>
:root{
  --paper:#f2f3ef;
  --plate:#ffffff;
  --ink:#1f2d47;
  --sub:#5b6880;
  --line:#d9dde3;
  --amber:#d98a1f;
  --amber-soft:#fdf3e2;
  --amber-ink:#7a4d0c;
  --silver-a:#c8cfd8; --silver-b:#eef1f5;
  --danger:#b0392f;
  --c-spot:#4a7c59;
  --c-food:#b8473d;
  --c-move:#31589f;
  --c-shop:#7b6ba8;
  --c-onsen:#3f8f8a;
  --c-other:#87909c;
  --r:14px;
  --shadow:0 1px 2px rgba(31,45,71,.08),0 4px 14px rgba(31,45,71,.07);
  --dispfont:"Avenir Next","Futura","Trebuchet MS","Hiragino Sans","Noto Sans TC",sans-serif;
  --font:"Hiragino Sans","Noto Sans TC","Noto Sans CJK TC","PingFang TC","Microsoft JhengHei",system-ui,sans-serif;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html{scroll-behavior:smooth}
body{margin:0;background:var(--paper);color:var(--ink);font-family:var(--font);font-size:15px;line-height:1.55;
  padding-bottom:calc(96px + env(safe-area-inset-bottom));}
body.dragging{user-select:none;-webkit-user-select:none;overscroll-behavior:none}
button{font-family:inherit;font-size:inherit;color:inherit;background:none;border:0;padding:0;cursor:pointer}
button:focus-visible,a:focus-visible,input:focus-visible,textarea:focus-visible,select:focus-visible{outline:2px solid var(--amber);outline-offset:2px;border-radius:6px}
a{color:var(--c-move)}
input,textarea,select{font-family:inherit;font-size:15px;color:var(--ink);background:#fff;border:1.5px solid var(--line);border-radius:10px;padding:9px 11px;width:100%}
textarea{resize:vertical;min-height:64px}
label{display:block;font-size:12.5px;font-weight:700;color:var(--sub);margin:12px 0 5px;letter-spacing:.04em}

/* ── App bar ─────────────────────── */
.appbar{position:sticky;top:0;z-index:40;background:rgba(242,243,239,.92);backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);
  border-bottom:1px solid var(--line);padding:10px 14px calc(0px + 8px);padding-top:calc(10px + env(safe-area-inset-top))}
.appbar-row{display:flex;align-items:center;gap:10px}
.brand{flex:1;min-width:0;cursor:pointer;border-radius:8px}
.brand .sub .pen{opacity:.55}
.advtoggle{display:block;font-size:12.5px;font-weight:700;color:var(--sub);margin:14px 0 0;padding:6px 0}
.advtoggle::before{content:'▸ '}
.advtoggle.open::before{content:'▾ '}
.brand h1{margin:0;font-size:17px;font-weight:800;letter-spacing:.02em;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.brand .sub{font-size:11.5px;color:var(--sub);letter-spacing:.06em;font-variant-numeric:tabular-nums}
.savepill{font-size:11px;font-weight:700;padding:4px 9px;border-radius:99px;background:#e6ece4;color:#33623f;white-space:nowrap}
.savepill.warn{background:var(--amber-soft);color:var(--amber-ink)}
.iconbtn{width:38px;height:38px;border-radius:11px;display:flex;align-items:center;justify-content:center;font-size:18px;background:var(--plate);border:1px solid var(--line);box-shadow:0 1px 2px rgba(31,45,71,.06)}
.iconbtn:active{transform:scale(.94)}
.iconbtn[disabled]{opacity:.35}
.navchips{display:flex;gap:8px;overflow-x:auto;margin-top:9px;scrollbar-width:none}
.navchips::-webkit-scrollbar{display:none}
.chip{flex:0 0 auto;font-size:13px;font-weight:700;padding:7px 13px;border-radius:99px;background:var(--plate);border:1px solid var(--line);color:var(--sub)}
.chip b{color:var(--ink)}
.chip .cnt{font-size:11px;font-weight:800;color:#fff;background:var(--ink);border-radius:99px;padding:1px 6px;margin-left:5px;font-variant-numeric:tabular-nums}

/* ── Sections ─────────────────────── */
main{max-width:680px;margin:0 auto;padding:14px 12px 0}
.section-head{display:flex;align-items:baseline;gap:10px;margin:26px 2px 10px}
.section-head h2{margin:0;font-size:15px;font-weight:800;letter-spacing:.14em}
.section-head .hint{font-size:11.5px;color:var(--sub)}
.section-head .grow{flex:1}
.addbtn{font-size:12.5px;font-weight:700;color:var(--amber-ink);background:var(--amber-soft);border:1px solid #ecd6ae;border-radius:99px;padding:5px 12px}

/* ── Day plate (駅名標) ───────────── */
.day{margin:0 0 22px}
.day-plate{position:relative;background:var(--plate);border:1.5px solid var(--ink);border-radius:12px;box-shadow:var(--shadow);overflow:hidden}
.day-plate-top{display:flex;align-items:center;gap:12px;padding:10px 12px 8px}
.day-datenum{font-family:var(--dispfont);font-weight:800;font-size:34px;line-height:1;letter-spacing:-.01em;font-variant-numeric:tabular-nums}
.day-datenum small{font-size:13px;font-weight:700;letter-spacing:.05em;vertical-align:18px;margin-right:1px;color:var(--sub)}
.day-mid{flex:1;min-width:0}
.day-title{font-size:16px;font-weight:800;letter-spacing:.03em;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.day-note{font-size:11.5px;color:var(--sub);margin-top:1px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.day-dow{font-size:12px;font-weight:800;border:1.5px solid var(--ink);border-radius:8px;padding:2px 7px;flex:0 0 auto}
.day-actions{display:flex;gap:4px;flex:0 0 auto}
.day-actions .iconbtn{width:34px;height:34px;font-size:15px;border-radius:9px}
.day-band{position:relative;height:24px;display:flex;align-items:center;justify-content:space-between;padding:0 10px;
  font-size:10.5px;font-weight:800;letter-spacing:.1em;color:#fff;font-variant-numeric:tabular-nums}
.day-band .bandtag{background:rgba(255,255,255,.24);border-radius:99px;padding:1px 9px}
.day-band .adj{opacity:.85}
.band-holiday{background:linear-gradient(100deg,var(--silver-a),var(--silver-b) 45%,var(--silver-a));color:#3d4a5c;text-shadow:0 1px 0 rgba(255,255,255,.6)}
.band-holiday .bandtag{background:rgba(61,74,92,.14)}
.band-car{background:linear-gradient(100deg,#c47c14,var(--amber))}
.band-buffer{background:linear-gradient(100deg,#7d8794,#98a1ad)}
.band-plain{background:var(--ink)}
.day.collapsed .dropzone{display:none}
.day-toggle{transition:transform .18s}
.day.collapsed .day-toggle{transform:rotate(-90deg)}

/* ── Card list / dropzone ─────────── */
.dropzone{padding:10px 2px 2px;min-height:14px}
.dropzone.hot{background:rgba(217,138,31,.07);border-radius:12px}
.empty-drop{border:1.5px dashed var(--line);border-radius:12px;color:var(--sub);font-size:12.5px;text-align:center;padding:16px 10px}
.dropzone.hot .empty-drop{border-color:var(--amber);color:var(--amber-ink)}
.dropbar{height:4px;border-radius:99px;background:var(--amber);margin:5px 6px;box-shadow:0 0 0 3px rgba(217,138,31,.18)}

/* ── Card ─────────────────────────── */
.card{position:relative;background:var(--plate);border:1px solid var(--line);border-left:5px solid var(--c-other);
  border-radius:var(--r);box-shadow:var(--shadow);padding:10px 40px 10px 12px;margin:0 0 9px;touch-action:pan-y;
  user-select:none;-webkit-user-select:none;-webkit-touch-callout:none}
.card[data-cat=spot]{border-left-color:var(--c-spot)}
.card[data-cat=food]{border-left-color:var(--c-food)}
.card[data-cat=move]{border-left-color:var(--c-move)}
.card[data-cat=shop]{border-left-color:var(--c-shop)}
.card[data-cat=onsen]{border-left-color:var(--c-onsen)}
.card-row1{display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.timechip{font-size:11px;font-weight:800;font-variant-numeric:tabular-nums;letter-spacing:.02em;background:var(--paper);border:1px solid var(--line);border-radius:6px;padding:1px 6px;color:var(--sub)}
.catdot{font-size:10.5px;font-weight:800;letter-spacing:.06em;color:#fff;border-radius:6px;padding:1px 6px}
.card[data-cat=spot] .catdot{background:var(--c-spot)}
.card[data-cat=food] .catdot{background:var(--c-food)}
.card[data-cat=move] .catdot{background:var(--c-move)}
.card[data-cat=shop] .catdot{background:var(--c-shop)}
.card[data-cat=onsen] .catdot{background:var(--c-onsen)}
.card[data-cat=other] .catdot{background:var(--c-other)}
.card-name{font-size:15px;font-weight:800;margin-top:3px;letter-spacing:.01em}
.card-addr{display:flex;align-items:center;gap:5px;font-size:12px;color:var(--sub);margin-top:3px}
.card-addr .txt{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.card-note{font-size:12.5px;color:var(--sub);margin-top:4px}
.card-warn{font-size:12px;font-weight:600;color:var(--amber-ink);background:var(--amber-soft);border:1px solid #ecd6ae;border-radius:9px;padding:5px 9px;margin-top:7px}
.card-menu{position:absolute;top:6px;right:5px;width:32px;height:32px;border-radius:9px;display:flex;align-items:center;justify-content:center;color:var(--sub);font-size:17px;font-weight:800}
.maplink{flex:0 0 auto;font-size:11.5px;font-weight:700;color:var(--c-move);text-decoration:none;border:1px solid #c6d2ea;background:#eef2fa;border-radius:99px;padding:2px 9px}
.card.drag-src{opacity:.35}
.ghost{position:fixed;z-index:90;left:0;top:0;pointer-events:none;box-shadow:0 10px 30px rgba(31,45,71,.3);transform-origin:center;border-left-width:5px;margin:0}

/* ── Pool (側線) ──────────────────── */
.pool-wrap{border:1.5px dashed #b8bfca;border-radius:16px;padding:10px 10px 4px;
  background:repeating-linear-gradient(-45deg,rgba(31,45,71,.028) 0 8px,transparent 8px 20px)}
.pool-wrap .dropzone{padding-top:2px}

/* ── Tasks / notes ────────────────── */
.task{display:flex;align-items:flex-start;gap:10px;background:var(--plate);border:1px solid var(--line);border-radius:12px;padding:10px 12px;margin-bottom:8px}
.task input[type=checkbox]{width:20px;height:20px;flex:0 0 auto;margin-top:1px;accent-color:var(--c-spot)}
.task .t-main{flex:1;min-width:0}
.task .t-text{font-weight:600;font-size:14px}
.task.done .t-text{text-decoration:line-through;color:var(--sub);font-weight:500}
.task .t-due{font-size:11px;font-weight:800;color:var(--amber-ink);background:var(--amber-soft);border-radius:6px;padding:1px 7px;display:inline-block;margin-top:3px}
.note{background:var(--plate);border:1px solid var(--line);border-radius:12px;padding:10px 40px 10px 12px;margin-bottom:8px;font-size:13.5px;position:relative}
.note.warn{border-color:#ecd6ae;background:var(--amber-soft)}
.mini-edit{position:absolute;top:5px;right:4px;width:30px;height:30px;border-radius:8px;display:flex;align-items:center;justify-content:center;color:var(--sub);font-size:14px}

/* ── Drag dock ────────────────────── */
.dock{position:fixed;left:0;right:0;bottom:0;z-index:80;display:none;gap:10px;padding:12px 14px calc(14px + env(safe-area-inset-bottom));
  background:rgba(31,45,71,.88);backdrop-filter:blur(8px);-webkit-backdrop-filter:blur(8px)}
body.dragging .dock{display:flex}
.dock-chip{flex:1;text-align:center;font-size:14px;font-weight:800;color:#fff;border:1.5px dashed rgba(255,255,255,.5);border-radius:14px;padding:15px 8px}
.dock-chip.hot{background:var(--amber);border-color:var(--amber);color:#fff}

/* ── Modals ───────────────────────── */
.backdrop{position:fixed;inset:0;z-index:100;background:rgba(20,28,44,.45);display:flex;align-items:flex-end;justify-content:center;
  animation:fade .16s}
.sheet{background:var(--paper);width:100%;max-width:680px;max-height:86vh;overflow:auto;border-radius:20px 20px 0 0;padding:16px 16px calc(20px + env(safe-area-inset-bottom));
  animation:up .2s cubic-bezier(.2,.8,.3,1)}
.sheet h3{margin:2px 0 4px;font-size:16px;font-weight:800;letter-spacing:.06em}
.sheet .grab{width:40px;height:4px;border-radius:99px;background:#c6ccd6;margin:0 auto 12px}
.seg{display:flex;flex-wrap:wrap;gap:7px}
.seg button{font-size:13px;font-weight:700;border:1.5px solid var(--line);background:#fff;border-radius:99px;padding:7px 13px;color:var(--sub)}
.seg button.on{color:#fff;border-color:transparent;background:var(--ink)}
.seg button[data-v=warnN].on{background:var(--amber)}
.seg button[data-v=spot].on{background:var(--c-spot)}
.seg button[data-v=food].on{background:var(--c-food)}
.seg button[data-v=move].on{background:var(--c-move)}
.seg button[data-v=shop].on{background:var(--c-shop)}
.seg button[data-v=onsen].on{background:var(--c-onsen)}
.seg button[data-v=other].on{background:var(--c-other)}
.seg button[data-v=holiday].on{background:#7d8fa8}
.seg button[data-v=car].on{background:var(--amber)}
.seg button[data-v=buffer].on{background:#98a1ad}
.seg button[data-v=plain].on{background:var(--ink)}
.btnrow{display:flex;gap:10px;margin-top:18px}
.btn{flex:1;text-align:center;font-size:15px;font-weight:800;border-radius:12px;padding:13px 10px;border:1.5px solid var(--line);background:#fff}
.btn.primary{background:var(--ink);border-color:var(--ink);color:#fff}
.btn.danger{color:var(--danger);border-color:#e0b7b3}
.sheetlist{display:flex;flex-direction:column;gap:8px}
.sheetlist button{text-align:left;background:#fff;border:1px solid var(--line);border-radius:12px;padding:13px 14px;font-weight:700;font-size:14.5px}
.sheetlist button[disabled]{opacity:.4}
.sheetlist button.danger{color:var(--danger)}
.sheetlist .small{font-size:12px;color:var(--sub);font-weight:500;display:block;margin-top:1px}

/* ── Toast ────────────────────────── */
.toast{position:fixed;left:50%;bottom:calc(24px + env(safe-area-inset-bottom));transform:translateX(-50%);z-index:120;
  background:var(--ink);color:#fff;font-size:13.5px;font-weight:600;border-radius:99px;padding:11px 18px;box-shadow:0 8px 24px rgba(31,45,71,.35);
  display:flex;align-items:center;gap:14px;white-space:nowrap;animation:up .2s}
.toast button{color:#ffc873;font-weight:800;font-size:13.5px}
body.dragging .toast{display:none}
body.selecting .dock{display:flex}
.dock-chip.mini{padding:12px 4px;font-size:13px}
.dock-chip.ghosty{flex:.55}

/* ── 批次選取 ─────────────────────── */
.selecting .card{cursor:pointer}
.selecting .card .card-menu{display:none}
.selecting .card::after{content:'○';position:absolute;top:7px;right:9px;font-size:16px;color:#b9c0cc;font-weight:800}
.selecting .card.picked{outline:2.5px solid var(--amber);background:#fff9ee}
.selecting .card.picked::after{content:'●';color:var(--amber)}
.untitled{opacity:.45;font-weight:600}

/* ── 日期選取器 ───────────────────── */
.cal-head{display:flex;align-items:center;justify-content:space-between;margin:8px 0 6px}
.cal-head b{font-size:15px;letter-spacing:.06em;font-variant-numeric:tabular-nums}
.cal-nav{width:38px;height:34px;border-radius:9px;background:#fff;border:1px solid var(--line);font-size:15px;font-weight:800}
.cal-grid{display:grid;grid-template-columns:repeat(7,1fr);gap:3px}
.cal-wd{text-align:center;font-size:10.5px;font-weight:800;color:var(--sub);padding:4px 0;letter-spacing:.06em}
.cal-cell{height:40px;border-radius:9px;background:#fff;border:1px solid var(--line);font-size:13.5px;font-weight:700;font-variant-numeric:tabular-nums;color:var(--ink)}
.cal-cell:disabled{opacity:0;pointer-events:none}
.cal-cell.today{border-color:var(--ink);border-width:1.5px}
.cal-cell.sel{background:var(--amber-soft);border-color:#ecd6ae;color:var(--amber-ink)}
.cal-cell.edge{background:var(--amber);border-color:var(--amber);color:#fff}
.cal-cell.pend{outline:2px dashed var(--amber);outline-offset:-2px}
.cal-segs{display:flex;flex-wrap:wrap;gap:7px;margin-top:12px;min-height:30px}
.cal-seg{display:flex;align-items:center;gap:7px;font-size:12.5px;font-weight:800;font-variant-numeric:tabular-nums;background:#fff;border:1.5px solid var(--amber);color:var(--amber-ink);border-radius:99px;padding:5px 6px 5px 12px}
.cal-seg button{width:20px;height:20px;border-radius:99px;background:var(--amber-soft);font-size:11px;font-weight:800;color:var(--amber-ink)}
.cal-clear{font-size:12px;font-weight:700;color:var(--sub);padding:6px 4px}
.cal-opt{display:flex;align-items:flex-start;gap:9px;margin-top:14px;font-size:13px;color:var(--sub)}
.cal-opt input{width:19px;height:19px;flex:0 0 auto;margin-top:1px;accent-color:var(--amber)}

.footer{max-width:680px;margin:34px auto 0;padding:0 14px;font-size:11px;color:var(--sub);text-align:center;letter-spacing:.04em}

@keyframes fade{from{opacity:0}}
@keyframes up{from{transform:translateY(24px);opacity:.4}}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}html{scroll-behavior:auto}}
@media (min-width:700px){
  .backdrop{align-items:center}
  .sheet{border-radius:20px}
}
</style>
</head>
<body>
<header class="appbar">
  <div class="appbar-row">
    <div class="brand" id="brandbtn" role="button" tabindex="0" title="編輯旅程名稱與副標">
      <h1 id="triptitle">計畫盤</h1>
      <div class="sub" id="tripsub"></div>
    </div>
    <span class="savepill" id="savepill">…</span>
    <button class="iconbtn" id="undobtn" title="復原上一步" disabled>↩</button>
    <button class="iconbtn" id="menubtn" title="選單">⋯</button>
  </div>
  <nav class="navchips" id="navchips"></nav>
</header>

<main>
  <div class="section-head" id="sec-days"><h2>行程</h2><span class="hint">長按卡片拖曳・點一下編輯</span><span class="grow"></span><button class="addbtn" id="pickdatesbtn">📅 選日期</button><button class="addbtn" id="adddaybtn">＋ 新增一天</button></div>
  <div id="daysWrap"></div>

  <div class="section-head" id="sec-pool"><h2>備案池（側線）</h2><span class="hint">待命點子停這裡，隨時拖回行程</span><span class="grow"></span><button class="addbtn" data-addcard="pool">＋ 新增</button></div>
  <div class="pool-wrap"><div class="dropzone" data-cont="pool" id="poolZone"></div></div>

  <div class="section-head" id="sec-tasks"><h2>行前任務</h2><span class="hint" id="taskhint"></span><span class="grow"></span><button class="addbtn" id="addtaskbtn">＋ 新增</button></div>
  <div id="tasksWrap"></div>

  <div class="section-head" id="sec-notes"><h2>重要備註</h2><span class="grow"></span><button class="addbtn" id="addnotebtn">＋ 新增</button></div>
  <div id="notesWrap"></div>
</main>

<div class="footer">計畫盤 ─ 離線可用・資料存在本機。換裝置或分享前記得「⋯ → 匯出」。</div>

<div class="dock" id="dock">
  <div class="dock-chip" data-dock="pool">📦 放進備案池</div>
  <div class="dock-chip" data-dock="pick">📅 放到某一天…</div>
</div>
<div id="modalRoot"></div>
<div id="toastRoot"></div>
<script>
'use strict';
/* ══════════════ 預設資料（我們討論的完整版）══════════════ */
const CATS={spot:'景點',food:'食',move:'交通',shop:'購物',onsen:'溫泉',other:'其他'};
const TAGS={holiday:'白銀週連休',car:'有車日',buffer:'緩衝日',plain:'一般'};
function C(o){return Object.assign({id:uid(),name:'',time:'',addr:'',map:'',cat:'spot',note:'',warn:''},o)}
const SENDAI={v:2,
trip:{title:'仙台之旅 9/19–9/26',sub:'5人｜IT772 高雄13:25→仙台18:10｜IT773 仙台19:00→22:10'},
days:[
 {id:'d19',date:'9/19',dow:'六',tag:'holiday',title:'抵達日',note:'白銀週第1天・只排晚餐',open:true,cards:[
  C({cat:'move',name:'IT772 高雄 → 仙台',time:'13:25–18:10',warn:'廉航時刻可能微調，行前一週上虎航官網再確認一次',note:'落地入境約 40–60 分'}),
  C({cat:'move',name:'仙台機場鐵道 → 仙台站',time:'約18:50 發',note:'17–25 分・660 円/人，跟著「仙台空港アクセス線」指標走'}),
  C({cat:'other',name:'飯店 Check-in（仙台站周邊）',note:'順便確認明後天集合動線',warn:'若租車：先問飯店停車是平面還是機械式、限高幾mm（機械式常限1,550mm，minivan約1,850mm進不去）'}),

/* ══════════════ 狀態・儲存 ══════════════ */
const KEY='tripboard-v2', OLDKEY='sendai-planner-v1';
let state=null, storeMode='mem', memStore=null, saveTimer=null, undoStack=[], migrated=false;
const $=s=>document.querySelector(s);
function clone(o){return JSON.parse(JSON.stringify(o))}

async function detectStore(){
  if(window.storage && typeof window.storage.get==='function'){storeMode='ws';return}
  try{localStorage.setItem('__t','1');localStorage.removeItem('__t');storeMode='ls'}
  catch(e){storeMode='mem'}
}
async function loadState(){
  const read=async k=>{
    try{
      if(storeMode==='ws'){try{const r=await window.storage.get(k);if(r&&r.value)return JSON.parse(r.value)}catch(e){}}
      else if(storeMode==='ls'){const r=localStorage.getItem(k);if(r)return JSON.parse(r)}
      else if(memStore){return JSON.parse(memStore)}
    }catch(e){console.warn('load fail',k,e)}
    return null;
  };
  let s=await read(KEY);
  if(!s){
    s=await read(OLDKEY);
    if(s){migrated=true;if(!s.trip)s.trip={title:'仙台之旅 9/19–9/26',sub:'5人｜IT772／IT773'}}
  }
  if(s)ensureShape(s);
  return s;
}
function ensureShape(s){
  if(!s.trip)s.trip={title:'我的旅程',sub:''};
  s.days=s.days||[];s.pool=s.pool||[];s.tasks=s.tasks||[];s.notes=s.notes||[];
  return s;
}
function scheduleSave(){clearTimeout(saveTimer);saveTimer=setTimeout(doSave,400)}
async function doSave(){
  const data=JSON.stringify(state);
  try{
    if(storeMode==='ws'){const r=await window.storage.set(KEY,data);if(!r)throw new Error('ws set failed')}
    else if(storeMode==='ls'){localStorage.setItem(KEY,data)}
    else{memStore=data}
    setPill();
  }catch(e){
    if(storeMode==='ws'){storeMode='ls';return doSave()}
    if(storeMode==='ls'){storeMode='mem';memStore=data}
    setPill();
  }
}
function setPill(){
  const p=$('#savepill');
  if(storeMode==='mem'){p.textContent='僅暫存・請匯出';p.classList.add('warn')}
  else{p.textContent='已儲存 ✓';p.classList.remove('warn')}
}
function snapshot(){undoStack.push(JSON.stringify(state));if(undoStack.length>30)undoStack.shift();$('#undobtn').disabled=false}
function undo(){
  if(!undoStack.length)return;
  state=JSON.parse(undoStack.pop());
  $('#undobtn').disabled=!undoStack.length;
  renderAll();scheduleSave();toast('已復原');
}
function commit(){renderAll();scheduleSave()}

/* 容器存取：'pool' 或 day id */
function contList(cid){return cid==='pool'?state.pool:(state.days.find(d=>d.id===cid)||{}).cards}
function dayLabel(d){return d.date+(d.dow?'（'+d.dow+'）':'')+'　'+(d.title||'未命名')}
function contName(cid){if(cid==='pool')return '備案池';const d=state.days.find(d=>d.id===cid);return d?dayLabel(d):'?'}
function findCard(id){
  for(const d of state.days){const i=d.cards.findIndex(c=>c.id===id);if(i>-1)return{cont:d.id,idx:i,card:d.cards[i]}}
  const i=state.pool.findIndex(c=>c.id===id);if(i>-1)return{cont:'pool',idx:i,card:state.pool[i]};
  return null;
}
function moveCard(id,toCont,toIdx){
  const f=findCard(id);if(!f)return;
  snapshot();
  const src=contList(f.cont);src.splice(f.idx,1);
  const dst=contList(toCont);
  if(toIdx==null||toIdx<0||toIdx>dst.length)toIdx=dst.length;
  dst.splice(toIdx,0,f.card);
  commit();
}
function mapURL(c){
  if(c.map)return c.map;
  const q=(c.addr||c.name||'').trim();
  return 'https://www.google.com/maps/search/?api=1&query='+encodeURIComponent(q);
}

/* ══════════════ Render ══════════════ */
function esc(s){return String(s??'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]))}
function el(html){const t=document.createElement('template');t.innerHTML=html.trim();return t.content.firstChild}

function cardEl(c){
  const n=el(`<div class="card" data-id="${c.id}" data-cat="${esc(c.cat)}">
    <div class="card-row1">
      ${c.time?`<span class="timechip">${esc(c.time)}</span>`:''}
      <span class="catdot">${CATS[c.cat]||'其他'}</span>
    </div>
    <div class="card-name">${esc(c.name)||'（未命名）'}</div>
    ${(c.addr||c.map)?`<div class="card-addr"><span class="txt">📍 ${esc(c.addr)||'地圖'}</span><a class="maplink" target="_blank" rel="noopener" href="${esc(mapURL(c))}">地圖 ↗</a></div>`:''}
    ${c.note?`<div class="card-note">${esc(c.note)}</div>`:''}
    ${c.warn?`<div class="card-warn">⚠ ${esc(c.warn)}</div>`:''}
    <button class="card-menu" data-act="card-menu" aria-label="更多">⋮</button>
  </div>`);
  return n;
}
function zoneFill(zone,cards){
  zone.innerHTML='';
  if(!cards||!cards.length){zone.appendChild(el('<div class="empty-drop">目前是空的 — 拖曳到此，或按上方「＋」新增</div>'));return}
  cards.forEach(c=>zone.appendChild(cardEl(c)));
}
function renderDays(){
  const wrap=$('#daysWrap');wrap.innerHTML='';
  state.days.forEach((d,i)=>{
    const prev=state.days[i-1],next=state.days[i+1];
    const dm=(d.date||'').split('/');
    const day=el(`<section class="day ${d.open?'':'collapsed'}" data-day="${d.id}">
      <div class="day-plate">
        <div class="day-plate-top">
          <div class="day-datenum"><small>${esc(dm[0]||'')}/</small>${esc(dm[1]||d.date)}</div>
          <span class="day-dow">${esc(d.dow||'')}</span>
          <div class="day-mid">
            <div class="day-title">${esc(d.title)||'<span class="untitled">未命名（點 ✎）</span>'}</div>
            ${d.note?`<div class="day-note">${esc(d.note)}</div>`:''}
          </div>

/* ══════════════ 拖曳引擎（長按啟動・無效放開必彈回）══════════════ */
let press=null, drag=null, scrollRAF=null, lastPt={x:0,y:0};
const dropbar=el('<div class="dropbar"></div>');

document.addEventListener('pointerdown',e=>{
  if(e.button!==undefined&&e.button!==0)return;
  if(sel)return; /* 選取模式：點按由 click 處理，不啟動拖曳 */
  if(e.target.closest('button,a,input,textarea,select,.backdrop'))return;
  const card=e.target.closest('.card');
  if(!card)return;
  press={card,id:card.dataset.id,x:e.clientX,y:e.clientY,pid:e.pointerId,
    timer:setTimeout(()=>{startDrag()},260)};
},{passive:true});

document.addEventListener('pointermove',e=>{
  lastPt={x:e.clientX,y:e.clientY};
  if(press&&!drag){
    if(Math.hypot(e.clientX-press.x,e.clientY-press.y)>10){clearTimeout(press.timer);press=null}
    return;
  }
  if(drag){moveGhost(e.clientX,e.clientY);hitTest(e.clientX,e.clientY)}
},{passive:true});

/* 拖曳時擋住頁面捲動（iOS 需要 non-passive touchmove） */
window.addEventListener('touchmove',e=>{if(drag)e.preventDefault()},{passive:false});

document.addEventListener('pointerup',e=>{
  if(press&&!drag){
    clearTimeout(press.timer);
    if(Math.hypot(e.clientX-press.x,e.clientY-press.y)<10)openCardEditor(press.id);
    press=null;return;
  }
  if(drag)endDrag(true);
});
document.addEventListener('pointercancel',()=>{if(press){clearTimeout(press.timer);press=null}if(drag)endDrag(false)});
window.addEventListener('blur',()=>{if(drag)endDrag(false)});

function startDrag(){
  if(!press)return;
  const src=press.card, f=findCard(press.id);
  if(!f){press=null;return}
  const r=src.getBoundingClientRect();
  const ghost=src.cloneNode(true);
  ghost.classList.add('ghost');
  ghost.style.width=r.width+'px';
  ghost.style.transform=`translate(${r.left}px,${r.top}px) scale(1.03)`;
  document.body.appendChild(ghost);
  src.classList.add('drag-src');
  document.body.classList.add('dragging');
  if(navigator.vibrate)try{navigator.vibrate(12)}catch(e){}
  drag={id:press.id,srcEl:src,srcRect:r,ghost,grabX:press.x-r.left,grabY:press.y-r.top,target:null,dock:null};
  press=null;
  autoScrollLoop();
}
function moveGhost(x,y){
  drag.ghost.style.transform=`translate(${x-drag.grabX}px,${y-drag.grabY}px) scale(1.03)`;
}
function hitTest(x,y){
  document.querySelectorAll('.dock-chip.hot').forEach(n=>n.classList.remove('hot'));
  document.querySelectorAll('.dropzone.hot').forEach(n=>n.classList.remove('hot'));
  const under=document.elementFromPoint(x,y);
  drag.target=null;drag.dock=null;
  if(!under){dropbar.remove();return}
  const chip=under.closest('.dock-chip');
  if(chip){chip.classList.add('hot');drag.dock=chip.dataset.dock;dropbar.remove();return}
  const zone=under.closest('.dropzone');
  if(!zone){dropbar.remove();return}
  zone.classList.add('hot');
  const cards=[...zone.querySelectorAll('.card')].filter(c=>!c.classList.contains('drag-src'));
  let idx=cards.length;
  for(let i=0;i<cards.length;i++){
    const cr=cards[i].getBoundingClientRect();
    if(y<cr.top+cr.height/2){idx=i;break}
  }
  drag.target={cont:zone.dataset.cont,idx};
  if(idx>=cards.length)zone.appendChild(dropbar);
  else zone.insertBefore(dropbar,cards[idx]);
}
function autoScrollLoop(){
  if(!drag){scrollRAF=null;return}
  const m=90,y=lastPt.y,h=window.innerHeight;
  if(y<m+60)window.scrollBy(0,-Math.ceil((m+60-y)/6));
  else if(y>h-m-70)window.scrollBy(0,Math.ceil((y-(h-m-70))/6));
  scrollRAF=requestAnimationFrame(autoScrollLoop);
}
function endDrag(commitDrop){
  const d=drag;drag=null;
  if(scrollRAF)cancelAnimationFrame(scrollRAF);
  dropbar.remove();
  document.querySelectorAll('.dock-chip.hot,.dropzone.hot').forEach(n=>n.classList.remove('hot'));
  document.body.classList.remove('dragging');
  const finish=()=>{d.ghost.remove();d.srcEl.classList.remove('drag-src')};
  if(commitDrop&&d.dock==='pool'){
    finish();moveCard(d.id,'pool',null);toast('已放進備案池',{label:'復原',fn:undo});return;
  }
  if(commitDrop&&d.dock==='pick'){
    finish();openMovePicker(d.id);return;  /* 未選定前資料不動 */
  }
  if(commitDrop&&d.target){
    finish();moveCard(d.id,d.target.cont,d.target.idx);return;
  }
  /* 無效落點 → 飛回原位，資料完全不動（防消失） */
  d.ghost.style.transition='transform .18s ease';
  d.ghost.style.transform=`translate(${d.srcRect.left}px,${d.srcRect.top}px) scale(1)`;
  setTimeout(finish,190);
}

/* ══════════════ 日期批次產生（像訂房網那樣選）══════════════ */
const WD=['日','一','二','三','四','五','六'];
const DAYMS=86400000;
function dkey(t){return t.getFullYear()+'-'+(t.getMonth()+1)+'-'+t.getDate()}
function fmtMD(t){return (t.getMonth()+1)+'/'+t.getDate()}
function fmtSeg(g){return fmtMD(g.s)+(g.e>g.s?'–'+fmtMD(g.e):'')}
function parseMD(label){const m=String(label||'').trim().match(/^(\d{1,2})[\/.月](\d{1,2})/);return m?(+m[1])+'/'+(+m[2]):null}
function normSegs(segs){
  const a=segs.map(g=>({s:new Date(g.s),e:new Date(g.e)})).sort((x,y)=>x.s-y.s), out=[];
  for(const g of a){const last=out[out.length-1];
    if(last&&g.s-last.e<=DAYMS){if(g.e>last.e)last.e=g.e}
    else out.push(g)}
  return out;
}
function segUnionDates(segs){
  const m=new Map();
  for(const g of segs)for(let t=new Date(g.s);t<=g.e;t=new Date(t.getTime()+DAYMS))m.set(dkey(t),new Date(t));
  return [...m.values()].sort((a,b)=>a-b);
}
function openDatePicker(){
  const today=new Date();
  let view={y:today.getFullYear(),m:today.getMonth()};
  let segs=[],pending=null;
  const box=el(`<div><h3>選日期・批次排天</h3>
    <p style="margin:2px 0 0;font-size:12px;color:var(--sub)">點開始日、再點結束日＝一段；中間休息就再選下一段。點同一天兩下＝單日。</p>
    <div class="cal-head"><button type="button" class="cal-nav" data-nav="-1">‹</button><b class="cal-title"></b><button type="button" class="cal-nav" data-nav="1">›</button></div>
    <div class="cal-grid"></div>
    <div class="cal-segs"></div>
    <label class="cal-opt"><input type="checkbox" class="cal-replace"><span><b>取代模式</b>：沒選到的天會移除，它們的卡片自動進備案池（不會消失）。不勾＝只補缺少的天，選到的照日期排序。</span></label>
    <div class="btnrow"><button class="btn" data-x>取消</button><button class="btn primary" data-ok>產生 0 天</button></div>
  </div>`);
  const grid=box.querySelector('.cal-grid'),title=box.querySelector('.cal-title'),segwrap=box.querySelector('.cal-segs'),okBtn=box.querySelector('[data-ok]');
  function withPending(){return pending?normSegs([...segs,{s:pending,e:pending}]):segs}
  function selMap(){const m=new Map();for(const g of segs)for(let t=new Date(g.s);t<=g.e;t=new Date(t.getTime()+DAYMS))m.set(dkey(t),g);return m}
  function draw(){
    title.textContent=view.y+' 年 '+(view.m+1)+' 月';
    const smap=selMap();
    let html=WD.map(w=>`<div class="cal-wd">${w}</div>`).join('');
    const off=new Date(view.y,view.m,1).getDay(),n=new Date(view.y,view.m+1,0).getDate();
    for(let i=0;i<off;i++)html+='<button type="button" class="cal-cell" disabled></button>';
    for(let d=1;d<=n;d++){
      const t=new Date(view.y,view.m,d),k=dkey(t),g=smap.get(k);
      const edge=g&&(dkey(g.s)===k||dkey(g.e)===k);
      const cls=['cal-cell',g?'sel':'',edge?'edge':'',(pending&&dkey(pending)===k)?'pend':'',(dkey(today)===k)?'today':''].join(' ');
      html+=`<button type="button" class="${cls}" data-dt="${k}">${d}</button>`;
    }
    grid.innerHTML=html;
    segwrap.innerHTML='';
    segs.forEach((g,i)=>{
      const chip=el(`<span class="cal-seg">${fmtSeg(g)}<button type="button" aria-label="移除此段">✕</button></span>`);
      chip.querySelector('button').addEventListener('click',()=>{segs.splice(i,1);draw()});
      segwrap.appendChild(chip);
    });
    if(pending)segwrap.appendChild(el(`<span class="cal-seg" style="border-style:dashed">${fmtMD(pending)} → 點結束日</span>`));
    if(segs.length||pending){
      const cl=el('<button type="button" class="cal-clear">清除全部</button>');
      cl.addEventListener('click',()=>{segs=[];pending=null;draw()});
      segwrap.appendChild(cl);
    }
    const cnt=segUnionDates(withPending()).length;
    okBtn.textContent='產生 '+cnt+' 天';
    okBtn.disabled=!cnt;
  }
  grid.addEventListener('click',e=>{
    const c=e.target.closest('.cal-cell[data-dt]');if(!c)return;
    const [y,m,d]=c.dataset.dt.split('-').map(Number);
    const t=new Date(y,m-1,d);
    if(!pending)pending=t;
    else{segs=normSegs([...segs,{s:pending<t?pending:t,e:pending<t?t:pending}]);pending=null}
    draw();
  });
  box.querySelectorAll('.cal-nav').forEach(b=>b.addEventListener('click',()=>{
    view.m+=Number(b.dataset.nav);
    if(view.m<0){view.m=11;view.y--}
    if(view.m>11){view.m=0;view.y++}
    draw();
  }));
  const close=openSheet(box);
  box.querySelector('[data-x]').addEventListener('click',close);
  okBtn.addEventListener('click',()=>{
    const dates=segUnionDates(withPending());
    if(!dates.length)return;
    const replace=box.querySelector('.cal-replace').checked;
    close();
    applyDates(dates,replace);
  });
  draw();
}
function applyDates(dates,replace){
  snapshot();
  const byMD=new Map();
  state.days.forEach(day=>{const k=parseMD(day.date);if(k&&!byMD.has(k))byMD.set(k,day)});
  const used=new Set();let created=0,kept=0;
  const ordered=dates.map(t=>{
    const k=(t.getMonth()+1)+'/'+t.getDate(), ex=byMD.get(k);
    if(ex&&!used.has(ex.id)){used.add(ex.id);if(!ex.dow)ex.dow=WD[t.getDay()];kept++;return ex}
    created++;
    return {id:uid(),date:fmtMD(t),dow:WD[t.getDay()],tag:'plain',title:'',note:'',open:true,cards:[]};
  });
  const rest=state.days.filter(d=>!used.has(d.id));
  let movedCards=0;
  if(replace){rest.forEach(d=>{movedCards+=d.cards.length;state.pool.push(...d.cards)});state.days=ordered}
  else state.days=[...ordered,...rest];
  commit();
  toast('已排好 '+ordered.length+' 天（新增 '+created+'、保留 '+kept+'）'+(replace&&movedCards?('，'+movedCards+' 張卡移入備案池'):''),{label:'復原',fn:undo},5200);
}

  let batchTa=null,batchGo=null;
  if(!f){
    const bp=el('<div style="display:none"></div>');
    batchTa=ta('','一行一張，用｜分隔：名稱｜時間｜備註（後兩者可省略）\n例：瑞鳳殿｜9:00–16:50｜參道是石階');
    batchTa.style.minHeight='110px';
    bp.appendChild(field('批次內容（分類套用上面選的）',batchTa));
    batchGo=el('<button type="button" class="btn" style="margin-top:10px;width:100%">⚡ 以上每行建立一張卡</button>');
    bp.appendChild(batchGo);
    const bBtn=el('<button type="button" class="advtoggle">⚡ 批次貼上多張（一行一張）</button>');
    bBtn.addEventListener('click',()=>{const show=bp.style.display==='none';bp.style.display=show?'':'none';bBtn.classList.toggle('open',show)});
    box.appendChild(bBtn);box.appendChild(bp);
  }
  const row=el(`<div class="btnrow"><button class="btn" data-x>取消</button><button class="btn primary" data-ok>儲存</button></div>`);
  box.appendChild(row);
  const close=openSheet(box);
  row.querySelector('[data-x]').addEventListener('click',close);
  if(batchGo)batchGo.addEventListener('click',()=>{
    const lines=batchTa.value.split(/\r?\n/).map(s=>s.trim()).filter(Boolean);
    if(!lines.length){toast('先貼上內容，一行一張');return}
    snapshot();
    const dst=contList(newTo||'pool');
    lines.forEach(L=>{const p=L.split(/[|｜]/).map(s=>s.trim());dst.push(C({cat,name:p[0]||'（未命名）',time:p[1]||'',note:p[2]||''}))});
    close();commit();toast('已建立 '+lines.length+' 張卡片',{label:'復原',fn:undo});
  });
  row.querySelector('[data-ok]').addEventListener('click',()=>{
    snapshot();
    Object.assign(c,{name:iName.value.trim(),time:iTime.value.trim(),addr:iAddr.value.trim(),map:iMap.value.trim(),note:iNote.value.trim(),warn:iWarn.value.trim(),cat});
    if(f){Object.assign(f.card,c)}
    else{contList(newTo||'pool').push(c)}
    close();commit();
  });
}
function openCardMenu(id){

  const box=el(`<div><h3>${esc(f.card.name)||'卡片'}</h3>
    <p style="margin:2px 0 12px;font-size:12px;color:var(--sub)">目前在：${esc(contName(f.cont))}</p>
    <div class="sheetlist">
      <button data-a="edit">✎ 編輯</button>
      <button data-a="move">📅 移動到…</button>
      <button data-a="dup">⧉ 複製一份</button>
      <button data-a="msel">☑ 批次選取（從這張開始）</button>
      <button data-a="del" class="danger">🗑 刪除</button>
    </div></div>`);
  const close=openSheet(box);
  box.addEventListener('click',e=>{
    const a=e.target.closest('[data-a]');if(!a)return;
    close();
    if(a.dataset.a==='edit')openCardEditor(id);
    if(a.dataset.a==='move')openMovePicker(id);
    if(a.dataset.a==='msel')enterSelect(id);
    if(a.dataset.a==='dup'){snapshot();const cp=clone(f.card);cp.id=uid();contList(f.cont).splice(f.idx+1,0,cp);commit();toast('已複製')}
    if(a.dataset.a==='del')confirmBox('刪除「'+(f.card.name||'此卡片')+'」？',()=>{snapshot();contList(f.cont).splice(f.idx,1);commit();toast('已刪除',{label:'復原',fn:undo})},'刪除');
  });
}
function openMovePicker(id){
  const f=findCard(id);if(!f)return;
  const box=el(`<div><h3>移動「${esc(f.card.name)||'卡片'}」到…</h3><div class="sheetlist" style="margin-top:10px"></div></div>`);
  const list=box.querySelector('.sheetlist');
  const targets=[...state.days.map(d=>[d.id,dayLabel(d),d.cards.length+' 張卡']),['pool','備案池（側線）',state.pool.length+' 張卡']];
  targets.forEach(([cid,label,sub])=>{
    const b=el(`<button ${cid===f.cont?'disabled':''}>${esc(label)}<span class="small">${esc(sub)}${cid===f.cont?'・目前位置':''}</span></button>`);
    b.addEventListener('click',()=>{close();moveCard(id,cid,null);toast('已移到 '+label,{label:'復原',fn:undo})});
    list.appendChild(b);
  });
  const close=openSheet(box);
}

/* ══════════════ 天（駅名標）編輯 ══════════════ */
function openDayEditor(id){
  const d=id?state.days.find(x=>x.id===id):null;
  const w=d?clone(d):{id:uid(),date:'Day '+(state.days.length+1),dow:'',tag:'plain',title:'',note:'',open:true,cards:[]};
  const box=el(`<div><h3>${d?'編輯這一天':'新增一天'}</h3></div>`);
  const iDate=inp(w.date,'自由格式：9/24、Day 3、週末…'),iDow=inp(w.dow,'角標：四、Sat、雨備…'),iTitle=inp(w.title,'例：藏王御釜＋狐狸村'),iNote=inp(w.note,'例：有車日・早出早回');
  let tag=w.tag||'plain';
  box.appendChild(field('主標籤（日期或 Day 幾，隨你）',iDate));
  box.appendChild(field('角標（選填）',iDow));
  box.appendChild(field('標題',iTitle));
  box.appendChild(field('這天的類型（色帶）',segRow(TAGS,tag,v=>tag=v)));
  box.appendChild(field('小備註',iNote));
  const row=el(`<div class="btnrow">${d?'<button class="btn danger" data-del>刪除這天</button>':''}<button class="btn" data-x>取消</button><button class="btn primary" data-ok>儲存</button></div>`);
  box.appendChild(row);
  const close=openSheet(box);
  row.querySelector('[data-x]').addEventListener('click',close);
  row.querySelector('[data-ok]').addEventListener('click',()=>{
    snapshot();
    Object.assign(w,{date:iDate.value.trim(),dow:iDow.value.trim(),title:iTitle.value.trim(),note:iNote.value.trim(),tag});
    if(d)Object.assign(d,{date:w.date,dow:w.dow,title:w.title,note:w.note,tag:w.tag});
    else state.days.push(w);
    close();commit();
  });
  const delBtn=row.querySelector('[data-del]');
  if(delBtn)delBtn.addEventListener('click',()=>{
    close();
    confirmBox('刪除「'+d.date+' '+d.title+'」？這天的 '+d.cards.length+' 張卡片會移到備案池（不會消失）。',()=>{
      snapshot();
      state.pool.push(...d.cards);
      state.days=state.days.filter(x=>x.id!==d.id);
      commit();toast('已刪除該天，卡片已移到備案池',{label:'復原',fn:undo});
    },'刪除這天');
  });
}

/* ══════════════ 任務・備註編輯 ══════════════ */
function openTaskEditor(id){
  const t=id?state.tasks.find(x=>x.id===id):null;
  const w=t?clone(t):T('','');
  const box=el(`<div><h3>${t?'編輯任務':'新增任務'}</h3></div>`);
  const iText=ta(w.text,'要做什麼'),iDue=inp(w.due,'期限（例：本週、9月初）');
  box.appendChild(field('內容',iText));box.appendChild(field('期限',iDue));
  const row=el(`<div class="btnrow">${t?'<button class="btn danger" data-del>刪除</button>':''}<button class="btn" data-x>取消</button><button class="btn primary" data-ok>儲存</button></div>`);
  box.appendChild(row);
  const close=openSheet(box);
  row.querySelector('[data-x]').addEventListener('click',close);
  row.querySelector('[data-ok]').addEventListener('click',()=>{snapshot();
    if(t)Object.assign(t,{text:iText.value.trim(),due:iDue.value.trim()});
    else state.tasks.push(Object.assign(w,{text:iText.value.trim(),due:iDue.value.trim()}));

}
function openNoteEditor(id){
  const n=id?state.notes.find(x=>x.id===id):null;
  const w=n?clone(n):N('',false);
  const box=el(`<div><h3>${n?'編輯備註':'新增備註'}</h3></div>`);
  const iText=ta(w.text,'備註內容');
  let warn=!!w.warn;
  box.appendChild(field('內容',iText));
  box.appendChild(field('樣式',segRow({plainN:'一般',warnN:'⚠ 橘色警示'},warn?'warnN':'plainN',v=>warn=(v==='warnN'))));
  const row=el(`<div class="btnrow">${n?'<button class="btn danger" data-del>刪除</button>':''}<button class="btn" data-x>取消</button><button class="btn primary" data-ok>儲存</button></div>`);
  box.appendChild(row);
  const close=openSheet(box);
  row.querySelector('[data-x]').addEventListener('click',close);
  row.querySelector('[data-ok]').addEventListener('click',()=>{snapshot();
    if(n)Object.assign(n,{text:iText.value.trim(),warn});
    else state.notes.push(Object.assign(w,{text:iText.value.trim(),warn}));
    close();commit();});
  const db=row.querySelector('[data-del]');
  if(db)db.addEventListener('click',()=>{close();confirmBox('刪除此備註？',()=>{snapshot();state.notes=state.notes.filter(x=>x.id!==id);commit();toast('已刪除',{label:'復原',fn:undo})},'刪除')});
}

/* ══════════════ 匯出／匯入／文字版／重設 ══════════════ */
function buildText(){
  let out=['🗾 '+(state.trip.title||'旅程')];
  if(state.trip.sub)out.push(state.trip.sub);
  out.push('');
  state.days.forEach(d=>{
    out.push('■ '+d.date+'（'+d.dow+'）'+d.title+(d.note?'｜'+d.note:''));
    d.cards.forEach(c=>{
      out.push('・'+(c.time?c.time+'  ':'')+c.name+(c.addr?'（'+c.addr+'）':''));
      if(c.warn)out.push('  ⚠ '+c.warn);
    });
    out.push('');
  });
  if(state.pool.length){out.push('📦 備案池');state.pool.forEach(c=>out.push('・'+c.name));out.push('')}
  const todo=state.tasks.filter(t=>!t.done);
  if(todo.length){out.push('☑ 行前任務（未完成）');todo.forEach(t=>out.push('・'+t.text+(t.due?'｜'+t.due:'')))}
  return out.join('\n');
}
async function copyText(txt,okMsg){
  try{await navigator.clipboard.writeText(txt);toast(okMsg||'已複製到剪貼簿')}
  catch(e){openIOSheet('複製失敗，請手動全選複製：',txt,null)}
}
function openIOSheet(title,value,onImport){
  const box=el(`<div><h3>${esc(title)}</h3></div>`);
  const t=ta(value,'');t.style.minHeight='220px';t.spellcheck=false;
  box.appendChild(t);
  const row=el(`<div class="btnrow"><button class="btn" data-x>關閉</button>${onImport?'<button class="btn primary" data-ok>匯入並覆蓋</button>':'<button class="btn primary" data-cp>全選複製</button>'}</div>`);
  box.appendChild(row);
  const close=openSheet(box);
  row.querySelector('[data-x]').addEventListener('click',close);
  const cp=row.querySelector('[data-cp]');
  if(cp)cp.addEventListener('click',()=>{t.select();copyText(t.value)});
  const ok=row.querySelector('[data-ok]');
  if(ok)ok.addEventListener('click',()=>{
    try{
      const data=JSON.parse(t.value);
      if(!data||!Array.isArray(data.days)||!Array.isArray(data.pool))throw 0;
      ensureShape(data);
      confirmBox('匯入將覆蓋目前內容（可用 ↩ 復原）。繼續？',()=>{snapshot();state=data;commit();close();toast('已匯入')},'覆蓋匯入');
    }catch(e){toast('格式不對，請貼上先前匯出的 JSON')}
  });
}
function openMainMenu(){
  const box=el(`<div><h3>選單</h3><div class="sheetlist" style="margin-top:10px">
    <button data-a="trip">⚙️ 旅程設定<span class="small">名稱・副標，宣告一次全站引用</span></button>
    <button data-a="text">💬 複製純文字行程<span class="small">貼到群組給同行者</span></button>
    <button data-a="exp">⬆ 匯出 JSON<span class="small">備份／換裝置／分享可編輯版</span></button>
    <button data-a="imp">⬇ 匯入 JSON<span class="small">貼上別人匯出的內容（會覆蓋）</span></button>
    <button data-a="expand">⌄ 全部展開</button>
    <button data-a="collapse">⌃ 全部收合</button>
    <button data-a="help">❓ 使用說明</button>
    <button data-a="blank" class="danger">🆕 開新旅程（空白公版）<span class="small">覆蓋目前內容，可 ↩ 復原</span></button>
    <button data-a="example" class="danger">🗾 載入仙台範例<span class="small">覆蓋目前內容，可 ↩ 復原</span></button>
  </div></div>`);
  const close=openSheet(box);
  box.addEventListener('click',e=>{
    const a=e.target.closest('[data-a]');if(!a)return;close();
    const act=a.dataset.a;
    if(act==='trip')openTripEditor();
    if(act==='text')copyText(buildText(),'行程文字版已複製，可貼到群組');
    if(act==='exp')openIOSheet('匯出 JSON（全選複製保存）',JSON.stringify(state,null,1),null);
    if(act==='imp')openIOSheet('貼上 JSON 後按「匯入並覆蓋」','',true);
    if(act==='expand'){state.days.forEach(d=>d.open=true);commit()}
    if(act==='collapse'){state.days.forEach(d=>d.open=false);commit()}
    if(act==='help')openHelp();
    if(act==='blank')confirmBox('開一份空白公版？目前內容會被覆蓋（可用 ↩ 復原，建議先匯出備份）。',()=>{snapshot();state=makeBlank();commit();toast('新旅程開好了，點頁首命名')},'開新旅程');
    if(act==='example')confirmBox('載入我們討論的仙台範例？目前內容會被覆蓋（可用 ↩ 復原）。',()=>{snapshot();state=clone(SENDAI);commit();toast('已載入仙台範例')},'載入');
  });
}
function openHelp(){
  const box=el(`<div><h3>使用說明</h3><div style="font-size:13.5px;line-height:1.8;color:var(--ink);margin-top:8px">
  <b>點一下卡片</b> → 編輯（名稱／時刻表／地址／備註；地圖連結和⚠警告收在「更多欄位」）。<br>
  <b>長按 0.3 秒再拖</b> → 移動；同一天排序、跨天都行。拖曳中畫面下方會出現碼頭：丟進「備案池」或「放到某一天…」。<br>
  <b>放錯地方不會消失</b>：放到空白處卡片會自動飛回原位；刪除有「復原」；刪掉一整天時，卡片自動移到備案池。<br>
  <b>⋮ 選單</b> → 不想拖的話，用「移動到…」直接指定去處。<br>
  <b>📅 選日期</b> → 像訂房網：點開始、點結束產生連續天，可多段（9/19–23＋9/25–29），自動帶星期；「取代模式」會把沒選到的天移除、卡片進備案池。<br>
  <b>☑ 批次選取</b> → 卡片 ⋮ 選「批次選取」，點選多張後用下方動作列一次搬移／刪除。<br>
  <b>⚡ 批次貼上</b> → 新增卡片時展開「批次貼上多張」，一行一張：名稱｜時間｜備註。<br>
  <b>頁首</b> → 點旅程名稱可改名稱與副標；日期、Day 幾都是自由文字，不綁行事曆。<br>
  <b>⋯ 選單</b> → 開空白公版做新旅程，或載回仙台範例。<b>↩</b> 可復原最近 30 步。<br>
  <b>儲存</b>：自動存在這台裝置。右上顯示「僅暫存」時代表此環境不能落地儲存，離開前請「匯出 JSON」。傳給朋友：複製純文字（看）或 JSON（可編輯）。</div>
  <div class="btnrow"><button class="btn primary" data-x>知道了</button></div></div>`);
  const close=openSheet(box);
  box.querySelector('[data-x]').addEventListener('click',close);
}

/* ══════════════ 事件委派・初始化 ══════════════ */
document.addEventListener('click',e=>{
  if(sel){
    const sc=e.target.closest('[data-selact]');
    if(sc){
      const a=sc.dataset.selact, ids=selectedInOrder();
      if(a==='cancel')exitSelect();
      else if(!ids.length)toast('先點幾張卡片');
      else if(a==='pool'){exitSelect();moveMany(ids,'pool');toast('已移 '+ids.length+' 張到備案池',{label:'復原',fn:undo})}
      else if(a==='move')openMovePickerMulti(ids);
      else if(a==='del')confirmBox('刪除選取的 '+ids.length+' 張卡片？',()=>{exitSelect();deleteMany(ids);toast('已刪除 '+ids.length+' 張',{label:'復原',fn:undo})},'刪除');
      return;
    }
    const pc=e.target.closest('.card');
    if(pc&&!e.target.closest('a,button')){
      if(sel.has(pc.dataset.id))sel.delete(pc.dataset.id);else sel.add(pc.dataset.id);
      renderDock();
      return;
    }
  }
  const act=e.target.closest('[data-act]');
  if(act){
    const a=act.dataset.act;
    const card=act.closest('.card'), day=act.closest('.day'), task=act.closest('.task'), note=act.closest('.note');
    if(a==='card-menu'&&card)openCardMenu(card.dataset.id);
    if(a==='day-add'&&day)openCardEditor(null,day.dataset.day);
    if(a==='day-edit'&&day)openDayEditor(day.dataset.day);
    if(a==='day-toggle'&&day){const d=state.days.find(x=>x.id===day.dataset.day);if(d){d.open=!d.open;commit()}}
    if(a==='task-toggle'&&task){const t=state.tasks.find(x=>x.id===task.dataset.task);if(t){snapshot();t.done=!t.done;commit()}}
    if(a==='task-edit'&&task)openTaskEditor(task.dataset.task);
    if(a==='note-edit'&&note)openNoteEditor(note.dataset.note);
    return;
  }
  const addc=e.target.closest('[data-addcard]');
  if(addc)openCardEditor(null,addc.dataset.addcard);
});
$('#undobtn').addEventListener('click',undo);
$('#menubtn').addEventListener('click',openMainMenu);
$('#brandbtn').addEventListener('click',openTripEditor);
$('#brandbtn').addEventListener('keydown',e=>{if(e.key==='Enter'||e.key===' '){e.preventDefault();openTripEditor()}});
$('#adddaybtn').addEventListener('click',()=>openDayEditor(null));
$('#pickdatesbtn').addEventListener('click',openDatePicker);
$('#addtaskbtn').addEventListener('click',()=>openTaskEditor(null));
$('#addnotebtn').addEventListener('click',()=>openNoteEditor(null));

(async function init(){
  await detectStore();
  const saved=await loadState();
  state=saved||clone(SENDAI);
  ensureShape(state);
  setPill();
  renderAll();
  if(migrated){scheduleSave();setTimeout(()=>toast('已帶入舊版資料；⋯選單可載入更新後的仙台範例',null,5200),500)}
  else if(!saved)setTimeout(()=>toast('長按卡片＝拖曳・點一下＝編輯',null,4200),600);
})();
</script>
