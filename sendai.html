<!doctype html>
<html lang="zh-Hant">
<head>
  <meta charset="utf-8" />

  <link rel="manifest" href="manifest.webmanifest" />
  <title>仙台遊 9/19-9/26</title>
  <style>
    :root{--sea:#176b7a;--wave:#52b9c1;--ink:#18333b;--paper:#fffdf7;--sand:#f7edda;--coral:#dd745b;--line:#d9e7e4;--shadow:0 9px 28px #164f5d18}*{box-sizing:border-box}body{margin:0;background:linear-gradient(180deg,#dff4f4 0,#f8f1df 36%,#fffdf7 100%);color:var(--ink);font:15px/1.55 -apple-system,BlinkMacSystemFont,"Noto Sans TC","Hiragino Sans",sans-serif;min-height:100vh}button,input,textarea{font:inherit}button{cursor:pointer}.hero{padding:26px 18px 18px;text-align:center;color:#fff;background:linear-gradient(145deg,#176b7a,#2b9a9b);position:relative;overflow:hidden}.hero:after{content:"〰 〰 〰 〰 〰";position:absolute;bottom:-12px;left:-5%;width:110%;font-size:34px;color:#f8edd6;letter-spacing:7px}.hero h1{position:relative;margin:0;font-size:29px;letter-spacing:.07em;text-shadow:0 2px #08515e}.hero p{margin:3px 0 7px;opacity:.9}.tools{max-width:760px;margin:0 auto;display:grid;grid-template-columns:1fr 1fr;gap:9px;padding:12px 14px;background:#fffdfbdd}.tool{background:#fff;border:1px solid #e6d8be;border-radius:15px;padding:8px 10px;text-align:left;box-shadow:0 4px 14px #356b7720}.tool strong{display:block;font-size:12px;color:#6b7874}.tool span{font-size:15px;font-weight:700}.days{position:sticky;z-index:10;top:0;background:#fffdf7ee;backdrop-filter:blur(10px);border-bottom:1px solid #ddd6c7;display:flex;overflow:auto;gap:8px;padding:10px 13px;scrollbar-width:none}.day-btn{white-space:nowrap;border:1px solid #b9d8d6;background:#fff;color:var(--sea);border-radius:999px;padding:6px 12px;font-weight:700}.day-btn.active{background:var(--sea);color:#fff;border-color:var(--sea)}main{max-width:760px;margin:auto;padding:6px 13px 65px}.day{scroll-margin-top:65px;padding-top:17px}.day-head{display:flex;align-items:end;justify-content:space-between;border-bottom:2px solid var(--wave);padding:0 5px 7px;margin-bottom:11px}.day-head h2{font-size:21px;margin:0;color:var(--sea)}.day-head small{color:#6e7775}.timeline{position:relative;padding-left:43px}.timeline:before{content:"";position:absolute;top:4px;bottom:0;left:18px;width:3px;background:linear-gradient(var(--wave),#b2e1da)}.item{position:relative;margin:0 0 15px}.time{position:absolute;right:calc(100% + 12px);top:10px;color:#40666c;font-weight:800;font-size:13px;width:48px;text-align:right}.pin{position:absolute;left:-32px;top:11px;width:13px;height:13px;background:#fff;border:3px solid #277d91;border-radius:50%;box-shadow:0 0 0 3px #dff4f4}.card{background:#fff;border:1px solid #e7e1d7;border-radius:19px;padding:15px 15px 10px;box-shadow:var(--shadow);touch-action:pan-y}.card[draggable="true"]{cursor:grab}.card.dragging{opacity:.42}.card h3{margin:0 0 3px;font-size:18px;line-height:1.3}.tag{display:inline-block;background:#e7f4f2;color:#176b7a;border-radius:99px;padding:2px 9px;font-size:12px;font-weight:700;margin-bottom:5px}.detail{margin:4px 0;color:#667977;white-space:pre-line}.note{margin-top:9px;border:1px solid #eadbbd;border-radius:12px;background:#fff9e9;overflow:hidden}.note summary{padding:8px 10px;color:#866632;font-weight:800;cursor:pointer}.note-body{padding:0 10px 10px;white-space:pre-line}.note img{width:100%;max-height:250px;object-fit:cover;border-radius:8px;margin-top:8px}.actions{display:flex;gap:8px;border-top:1px dashed #d9e1dc;margin-top:10px;padding-top:10px}.action{border:1px solid #bad6d4;background:#fff;border-radius:11px;padding:7px 11px;color:#176b7a;font-weight:800;text-decoration:none}.action.edit{color:#995143;border-color:#ecc5bb}.add{display:block;width:calc(100% - 43px);margin:1px 0 12px 43px;padding:9px;border:1px dashed #6daeb0;border-radius:13px;background:#ecf8f6;color:#176b7a;font-weight:800}.empty{color:#667977;padding:8px}.modal{border:0;border-radius:18px;max-width:520px;width:calc(100% - 26px);padding:0;box-shadow:0 20px 60px #17343b55}.modal::backdrop{background:#15373b85}.modal form{padding:18px}.modal h2{margin:0 0 12px;color:var(--sea)}label{display:block;font-weight:700;margin:9px 0 4px}input,textarea{width:100%;border:1px solid #cbd9d7;border-radius:9px;padding:8px;background:#fff}textarea{resize:vertical;min-height:75px}.modal-actions{display:flex;gap:8px;justify-content:flex-end;margin-top:16px}.save{background:var(--sea);color:#fff;border:0;border-radius:10px;padding:8px 15px;font-weight:800}.cancel,.delete{border:1px solid #d7cebf;border-radius:10px;background:#fff;padding:8px 13px}.delete{color:#ae4a3e;margin-right:auto;border-color:#e2afa8}.status{text-align:center;color:#526b6b;font-size:12px;padding:5px}.offline{background:#f6c15a!important}@media(max-width:420px){.tools{grid-template-columns:1fr}.hero{padding-top:20px}.hero h1{font-size:25px}.card{padding:13px 12px 9px}}
  </style>
</head>
<body>
  <header class="hero"><h1>仙台遊 9/19–9/26</h1><p>杜之都・松島海岸・共同旅程</p></header>
  <section class="tools"><div class="tool"><strong>¥ 日圓換算新台幣</strong><span id="rate">載入匯率中…</span></div><div class="tool"><strong>☀ 仙台天氣（Open-Meteo）</strong><span id="weather">載入天氣中…</span></div></section>
  <nav class="days" id="days" aria-label="選擇天數"></nav><div class="status" id="status">正在連線至共同旅程…</div><main id="app"></main>
  <dialog class="modal" id="editor"><form method="dialog" id="editForm"><h2 id="modalTitle">新增行程</h2><label>時間</label><input id="fTime" placeholder="例如 09:30" /><label>行程名稱</label><input id="fTitle" required placeholder="例如 松島灣遊船" /><label>行程資訊</label><textarea id="fDetail" placeholder="交通、營業時間等"></textarea><label>備註</label><textarea id="fNote" placeholder="可在卡片的「備註」收折區查看"></textarea><label>備註圖片（會同步給共編者）</label><input id="fImage" type="file" accept="image/*" /><input id="fImageData" type="hidden" /><div class="modal-actions"><button type="button" class="delete" id="deleteBtn">刪除</button><button type="button" class="cancel" id="cancelBtn">取消</button><button class="save" value="default">儲存</button></div></form></dialog>
  <script type="module">
    import { initializeApp } from 'https://www.gstatic.com/firebasejs/10.14.1/firebase-app.js';
    import { getDatabase, ref, onValue, set, update, push, remove } from 'https://www.gstatic.com/firebasejs/10.14.1/firebase-database.js';
    const firebaseConfig={apiKey:'AIzaSyDxMwkCU23PB6Q60r3TWEu3elG00r4ywM0',authDomain:'sendai-6666.firebaseapp.com',databaseURL:'https://sendai-6666-default-rtdb.asia-southeast1.firebasedatabase.app',projectId:'sendai-6666',storageBucket:'sendai-6666.firebasestorage.app',messagingSenderId:'317293713360',appId:'1:317293713360:web:e3d5175a54ae43c801cbd5',measurementId:'G-Y1EH4G7745'};
    const db=getDatabase(initializeApp(firebaseConfig)), root=ref(db,'sendai-trip-v1');
    const initial=[['9/19','第一天',[['18:10','抵達仙台機場',''],['19:00','搭仙台機場 Access 線','可能搭 19:00／19:28\n行李只能放腳邊；下車時自行按按鈕開門\n可刷西瓜卡進站，或機器買票 660 円\n抵達 3/4 號月台，手扶梯到二樓，左轉東口改札'],['19:27','抵達仙台車站・步行去飯店',''],['19:45','Hotel Grand Bach Sendai','步行 10 分・Check in 放行李'],['20:10','晚餐－たんや善治郎 南町通り店','步行 15 分，這間人潮較少']]],['9/20','第二天',[['07:15','大廳寄行李＋早餐',''],['08:20','LOOPLE 仙台觀光巴士','買一日券 630 円（現金），早點到，第一班人潮多'],['09:13','瑞鳳殿','停留 1H；10:13／10:28／10:43 發車'],['10:28','仙台城跡','停留 30M；務必搭 11:08／11:23，否則需搭計程車'],['12:07','回到仙台車站','先走路逛逛，約 6 分'],['12:45','中餐－仔虎燒肉站前店',''],['14:15','逛街',''],['18:00','札幌螃蟹本家 仙台店','']]],['9/21','第三天',[['','換飯店・寄行李：ホテル京阪',''],['','松島散策','建議牡蠣 15:00 前；遊船 10:00–15:00（15:30 後天氣易變）'],['','瑞巖寺・五大堂',''],['','福浦橋',''],['11:00','MATSUSHIMA SANDWICH STORE','松島三明治 11:00–16:00'],['','Cafe le Roman 松島','咖啡廳 11:00–17:00'],['','松島蒲鉾本舗','烤魚板、烤仙貝'],['','クロワッサン屋サクサク','可頌 10:00–17:00']]],['9/22','第四天',[['','早餐超商',''],['08:00','出發前往藏王御釜','車程 1H20M'],['09:20','藏王御釜','停留 1H'],['10:20','出發去山形','車程 1H'],['11:30','米澤牛 登起波 山形店',''],['13:00','出發去山寺','車程 30M'],['13:30','山寺','爬行約 1.5H'],['15:00','回仙台','車程 1H10M'],['16:20','回飯店休息','建議睡一下'],['18:00','晚餐－牛舌','']]],['9/23','第五天',[['08:30','仙台海洋森林水族館','10:30 餵企鵝；中餐可去隔壁三井 Outlet 或回市區']]],['9/24','第六天',[['07:00','開車出發',''],['09:00','石卷出航',''],['09:44','抵達貓島',''],['11:06','回航',''],['11:51','抵達石卷',''],['13:00','回到仙台中餐','']]],['9/25','第七天',[['','金蛇水神社',''],['','購物',''],['','晚上還車','']]],['9/26','第八天',[['','行李寄仙台車站',''],['19:00','搭飛機','']]]];
    const makeSeed=()=>Object.fromEntries(initial.map(([date,name,rows],i)=>[String(i),{date,name,items:Object.fromEntries(rows.map(([time,title,detail],j)=>[String(j),{time,title,detail,note:'',image:''}]))}]));
    let data={},editing=null,dragging=null; const $=s=>document.querySelector(s), esc=s=>String(s||'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
    onValue(root,snap=>{if(!snap.exists()){set(root,makeSeed());return}data=snap.val();render();$('#status').textContent='● 即時共編已連線';$('#status').classList.remove('offline')},()=>{$('#status').textContent='離線模式：變更會在重新連線後嘗試同步';$('#status').classList.add('offline')});
    function maps(q){return 'https://www.google.com/maps/dir/?api=1&destination='+encodeURIComponent(q+' 日本')}
    function render(){const entries=Object.entries(data).sort((a,b)=>+a[0]-+b[0]);$('#days').innerHTML=entries.map(([id,d])=>`<button class="day-btn" data-day="${id}">${d.date} ${d.name}</button>`).join('');$('#app').innerHTML=entries.map(([id,d])=>{const items=Object.entries(d.items||{}).sort((a,b)=>+a[0]-+b[0]);return `<section class="day" id="day-${id}"><div class="day-head"><h2>${d.date}・${d.name}</h2><small>${items.length} 個行程</small></div><div class="timeline" data-day="${id}">${items.map(([key,x])=>`<article class="item" draggable="true" data-id="${key}"><span class="time">${esc(x.time)}</span><i class="pin"></i><div class="card"><span class="tag">行程</span><h3>${esc(x.title)}</h3>${x.detail?`<p class="detail">${esc(x.detail)}</p>`:''}<details class="note"><summary>備註${x.note||x.image?' ・':''}</summary><div class="note-body">${esc(x.note)}${x.image?`<img src="${x.image}" alt="備註圖片">`:''}</div></details><div class="actions"><a class="action" target="_blank" rel="noopener" href="${maps(x.title)}">⌖ 導航</a><button class="action edit" data-edit="${id}/${key}">✎ 編輯</button></div></div></article>`).join('')}</div><button class="add" data-add="${id}">＋ 新增行程</button></section>`}).join('');bindUI()}
    function bindUI(){document.querySelectorAll('.day-btn').forEach(b=>b.onclick=()=>$('#day-'+b.dataset.day).scrollIntoView({behavior:'smooth'}));document.querySelectorAll('[data-edit]').forEach(b=>b.onclick=()=>openEdit(...b.dataset.edit.split('/')));document.querySelectorAll('[data-add]').forEach(b=>b.onclick=()=>openEdit(b.dataset.add,null));document.querySelectorAll('.item').forEach(el=>{el.ondragstart=()=>{dragging=el;el.classList.add('dragging')};el.ondragend=()=>{el.classList.remove('dragging');dragging=null};el.ondragover=e=>e.preventDefault();el.ondrop=e=>{e.preventDefault();if(dragging&&dragging!==el) reorder(el.closest('.timeline').dataset.day,dragging.dataset.id,el.dataset.id)}});new IntersectionObserver(entries=>entries.forEach(e=>{if(e.isIntersecting)document.querySelectorAll('.day-btn').forEach(b=>b.classList.toggle('active',b.dataset.day===e.target.id.replace('day-','')))}),{rootMargin:'-80px 0px -60% 0px'}).observe(document.querySelector('.day'))}
    async function reorder(day,from,to){let list=Object.entries(data[day].items).sort((a,b)=>+a[0]-+b[0]);const moved=list.splice(list.findIndex(x=>x[0]===from),1)[0];list.splice(list.findIndex(x=>x[0]===to),0,moved);await set(ref(db,`sendai-trip-v1/${day}/items`),Object.fromEntries(list.map((x,i)=>[String(i),x[1]])))}
    function openEdit(day,key){editing={day,key};const x=key?data[day].items[key]:{time:'',title:'',detail:'',note:'',image:''};$('#modalTitle').textContent=key?'編輯行程':'新增行程';$('#fTime').value=x.time||'';$('#fTitle').value=x.title||'';$('#fDetail').value=x.detail||'';$('#fNote').value=x.note||'';$('#fImageData').value=x.image||'';$('#fImage').value='';$('#deleteBtn').style.display=key?'block':'none';$('#editor').showModal()}
    $('#fImage').onchange=e=>{const file=e.target.files[0];if(!file)return;if(file.size>650000){alert('圖片請小於 650KB，避免 Firebase 資料庫同步過慢。');e.target.value='';return}const reader=new FileReader();reader.onload=()=>$('#fImageData').value=reader.result;reader.readAsDataURL(file)};
    $('#editForm').onsubmit=async e=>{e.preventDefault();const x={time:$('#fTime').value.trim(),title:$('#fTitle').value.trim(),detail:$('#fDetail').value.trim(),note:$('#fNote').value.trim(),image:$('#fImageData').value};const p=`sendai-trip-v1/${editing.day}/items`;if(editing.key)await update(ref(db,`${p}/${editing.key}`),x);else await set(push(ref(db,p)),x);$('#editor').close()};$('#cancelBtn').onclick=()=>$('#editor').close();$('#deleteBtn').onclick=async()=>{if(confirm('確定刪除這個行程？')){await remove(ref(db,`sendai-trip-v1/${editing.day}/items/${editing.key}`));$('#editor').close()}};
    async function liveInfo(){try{const r=await fetch('https://open.er-api.com/v6/latest/JPY');const j=await r.json();$('#rate').textContent=`¥100 ≈ NT$${(j.rates.TWD*100).toFixed(1)}`}catch{$('#rate').textContent='匯率暫時無法取得'}try{const r=await fetch('https://api.open-meteo.com/v1/forecast?latitude=38.2682&longitude=140.8694&current=temperature_2m,weather_code&timezone=Asia%2FTokyo');const j=await r.json(),code=j.current.weather_code;const label=code<=1?'晴朗':code<=3?'多雲':code<=67?'有雨':'天氣變化';$('#weather').textContent=`仙台 ${j.current.temperature_2m}°C・${label}`}catch{$('#weather').textContent='天氣暫時無法取得'}}liveInfo();
    if('serviceWorker'in navigator)navigator.serviceWorker.register('./sw.js');
  </script>
</body></html>
