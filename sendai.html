<!doctype html>
<html lang="zh-Hant">
<head>
  <meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#6d604f"><meta name="description" content="仙台遊 9/19–9/26 共同編輯行程">
  <link rel="manifest" href="manifest.webmanifest"><link rel="apple-touch-icon" href="icon.svg">
  <title>SENDAI</title>
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Shippori+Mincho:wght@400;500;600&family=Noto+Sans+TC:wght@400;500;700&display=swap');
    :root{--paper:#f3efe5;--ink:#332f29;--muted:#81786b;--moss:#68705a;--rust:#a15e45;--line:#d8cfbf;--card:#faf7f0;--shadow:0 6px 18px #5c524012}*{box-sizing:border-box}html{scroll-behavior:smooth}body{margin:0;background:var(--paper);color:var(--ink);font-family:'Noto Sans TC',sans-serif;font-size:14px;background-image:radial-gradient(#8c806b18 .7px,transparent .7px);background-size:7px 7px}button,input,textarea{font:inherit}button{cursor:pointer}.hero{padding:42px 20px 26px;text-align:center;background:linear-gradient(145deg,#ded3bf,#f3efe5 65%);border-bottom:1px solid var(--line)}h1{font:500 clamp(28px,7vw,43px) 'Shippori Mincho',serif;letter-spacing:.12em;margin:0 0 8px}.sub{color:var(--muted);letter-spacing:.18em;font-size:12px}.tools{max-width:900px;margin:18px auto 0;display:grid;grid-template-columns:1.15fr 1fr;gap:10px;text-align:left}.tool{background:#fffcf6aa;border:1px solid #e4dac9;border-radius:5px;padding:11px 13px;box-shadow:var(--shadow)}.tool b{font-size:12px;color:var(--moss);letter-spacing:.06em}.weather{display:flex;align-items:center;gap:12px}.weather strong{font-size:23px;font-family:'Shippori Mincho',serif}.currency form{display:flex;gap:7px;margin-top:6px}.currency input{width:100%;border:0;border-bottom:1px solid var(--line);background:transparent;padding:4px;outline:none}.rate{font-size:11px;color:var(--muted);margin-top:5px}.day-nav{position:sticky;top:0;z-index:20;display:flex;gap:7px;overflow:auto;padding:11px max(14px,calc((100vw - 900px)/2));background:#f3efe5eF;border-bottom:1px solid var(--line);backdrop-filter:blur(8px)}.day-nav button{white-space:nowrap;border:1px solid var(--line);background:var(--card);border-radius:20px;padding:7px 12px;color:var(--muted);font-size:12px}.day-nav button:hover,.day-nav button.active{background:var(--moss);border-color:var(--moss);color:#fff}.content{max-width:900px;margin:auto;padding:0 16px 70px}.day{scroll-margin-top:60px;padding-top:32px}.day-head{display:flex;align-items:end;justify-content:space-between;border-bottom:1px solid var(--ink);padding-bottom:10px;margin-bottom:14px}.day-title{margin:0;font:500 27px 'Shippori Mincho',serif;letter-spacing:.08em}.day-note{color:var(--muted);font-size:12px}.timeline{position:relative;padding-left:82px}.timeline:before{content:"";position:absolute;left:55px;top:0;bottom:0;border-left:1px solid #bbb09f}.event{position:relative;min-height:62px;margin:0 0 10px;display:flex;align-items:stretch}.event:before{content:"";position:absolute;left:-31px;top:19px;width:9px;height:9px;border-radius:50%;background:var(--rust);border:3px solid var(--paper);z-index:1}.event.dragging{opacity:.38}.event.drag-over .event-card{outline:2px dashed var(--moss)}.time{position:absolute;right:calc(100% + 13px);top:12px;width:46px;text-align:right;color:var(--rust);font-size:12px;font-weight:700}.event-card{background:var(--card);border:1px solid var(--line);box-shadow:var(--shadow);border-radius:4px;padding:10px 9px 9px 13px;display:flex;gap:8px;align-items:flex-start;flex:1}.drag{color:#a89e90;padding:3px 2px;cursor:grab;touch-action:none}.event-main{flex:1;min-width:0}.event-name{font-weight:700;line-height:1.45}.detail{color:var(--muted);font-size:12px;line-height:1.55;white-space:pre-line;margin-top:2px}.event-actions{display:flex;gap:4px}.icon-btn{border:0;background:#ece6d9;color:var(--moss);border-radius:3px;width:30px;height:30px;font-size:15px}.icon-btn:hover{background:var(--moss);color:#fff}.add{margin:5px 0 4px 82px;background:transparent;border:1px dashed #b6aa98;color:var(--moss);border-radius:4px;padding:7px 12px}.offline{display:none;position:fixed;bottom:15px;left:50%;transform:translateX(-50%);z-index:50;background:#473f35;color:#fff;padding:8px 14px;border-radius:20px;font-size:12px}dialog{border:0;border-radius:7px;box-shadow:0 20px 60px #0004;width:min(500px,calc(100% - 28px));padding:0;background:var(--card);color:var(--ink)}dialog::backdrop{background:#312b244d}.modal-title{font:500 24px 'Shippori Mincho',serif;margin:0;padding:19px 20px 10px}.fields{padding:0 20px 20px;display:grid;gap:12px}.fields label{display:grid;gap:5px;font-size:12px;color:var(--muted)}.fields input,.fields textarea{border:1px solid var(--line);border-radius:3px;background:#fffdf8;padding:9px;color:var(--ink)}.fields textarea{min-height:95px;resize:vertical}.modal-actions{display:flex;gap:8px;justify-content:flex-end;border-top:1px solid var(--line);padding:12px 20px}.primary,.danger,.plain{border:0;border-radius:3px;padding:8px 13px}.primary{background:var(--moss);color:#fff}.danger{background:#f2ded6;color:#904b38;margin-right:auto}.plain{background:#e9e3d8;color:var(--ink)}@media(max-width:570px){.hero{padding-top:30px}.tools{grid-template-columns:1fr}.timeline{padding-left:67px}.timeline:before{left:43px}.event:before{left:-29px}.time{right:calc(100% + 10px);width:44px;font-size:11px}.event-card{padding-left:9px}.event-actions{flex-direction:column}.add{margin-left:67px}}
  </style>
</head>
<body>
<header class="hero"><h1>SENDAI</h1><div class="sub">9 / 19 — 9 / 26 &nbsp;・&nbsp; 八日之旅</div><div class="tools"><section class="tool currency"><b>匯率換算　JPY ⇄ TWD</b><form><input id="jpy" type="number" inputmode="decimal" value="1000" aria-label="日圓"><span>円</span><span>→</span><input id="twd" type="number" inputmode="decimal" aria-label="台幣"><span>元</span></form><div class="rate" id="rate">正在取得即時匯率…</div></section><section class="tool weather"><div style="font-size:28px" id="weatherIcon">☁</div><div><b>仙台今日天氣</b><br><strong id="temp">--°</strong> <span id="weatherText">載入中</span><div class="rate" id="weatherRange"></div></div></section></div></header>
<nav class="day-nav" id="dayNav" aria-label="行程天數"></nav><main class="content" id="app"></main><div class="offline" id="offline">目前離線，變更將在連線後同步</div>
<dialog id="editor"><h2 class="modal-title" id="modalTitle">編輯行程</h2><form id="eventForm" class="fields"><label>時間<input name="time" placeholder="例如 09:00"></label><label>行程名稱<input name="title" required placeholder="行程名稱"></label><label>說明／備註<textarea name="detail" placeholder="交通、預約、注意事項…"></textarea></label></form><div class="modal-actions"><button class="danger" type="button" id="deleteBtn">刪除</button><button class="plain" type="button" id="cancelBtn">取消</button><button class="primary" type="submit" form="eventForm">儲存</button></div></dialog>
<script type="module">
import {initializeApp} from 'https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js';
import {getDatabase,ref,onValue,runTransaction,set} from 'https://www.gstatic.com/firebasejs/10.12.2/firebase-database.js';

// 請將下方物件完整替換為你的 Firebase 專案設定。
const firebaseConfig = {
  apiKey: "AIzaSyDxMwkCU23PB6Q60r3TWEu3elG00r4ywM0",
  authDomain: "sendai-6666.firebaseapp.com",
  databaseURL: "https://sendai-6666-default-rtdb.asia-southeast1.firebasedatabase.app",
  projectId: "sendai-6666",
  storageBucket: "sendai-6666.firebasestorage.app",
  messagingSenderId: "317293713360",
  appId: "1:317293713360:web:e3d5175a54ae43c801cbd5",
  measurementId: "G-Y1EH4G7745"
};
const initial=[
['9/19','六','第一天',[['18:10','抵達仙台機場',''],['19:00','搭仙台機場 Access 線','可能搭 19:00／19:28\n行李只能放腳邊，有點擠；下車時要自己按開關打開門\n只能刷西瓜卡進站，或機器買票選 660 円\n抵達 3／4 號月台，手扶梯到二樓，左手邊東口改札'],['19:27','抵達仙台車站','步行去飯店'],['19:45','Hotel Grand Bach Sendai','步行 10 分，CHECK IN 放行李'],['20:10','晚餐｜たんや善治郎 南町通り店','步行 15 分，這間人潮較少']]],
['9/20','日','第二天',[['07:15','大廳寄行李＋早餐',''],['08:20','LOOPLE 盧葡兒仙台觀光巴士','買一日券 630 円（現金）。早點到，第一班 09:00 人潮應該就很多'],['09:13','瑞鳳殿','停留 1H；班次 10:13／10:28／10:43'],['10:28','仙台城跡','停留 30M；11:08／11:23，一定要搭到這班，不然得搭計程車回來'],['12:07','回到仙台車站','先走路過去晃晃，6 分'],['12:45','中餐｜仔虎燒肉站前店',''],['14:15','逛街',''],['18:00','晚餐｜札幌螃蟹本家 仙台店','']]],
['9/21','一','第三天',[['','換飯店｜ホテル京阪','寄行李'],['','松島','約 50M'],['','牡蠣','40M 吃到飽或單點；大部分 15:00 收店'],['','搭船','15:30 過後天氣容易不好；10:00、11:00、12:00、13:00、14:00、15:00'],['','瑞巖寺',''],['','瑞巖寺五大堂',''],['','福浦橋',''],['','クロワッサン屋サクサク','可頌，10:00–17:00，有分店'],['11:00','MATSUSHIMA SANDWICH STORE','松島三明治，11:00–16:00'],['','Cafe le Roman 松島','咖啡廳，11:00–17:00'],['','松島蒲鉾本舗','烤魚板'],['','烤仙貝','']]],
['9/22','二','第四天',[['','早餐超商',''],['08:00','出發前往藏王御釜','車程 1H20M'],['09:20','藏王御釜','停留 1H'],['10:20','出發去山形','車程 1H'],['11:30','米澤牛｜登起波 山形店',''],['13:00','出發去山寺','車程 30M'],['13:30','山寺','爬山約 1.5H'],['15:00','回仙台','車程 1H10M'],['16:20','飯店','建議去睡一下'],['18:00','晚餐｜牛舌','']]],
['9/23','三','第五天',[['08:30','仙台海洋森林水族館','10:30 餵企鵝'],['','中餐','去隔壁三井百貨吃，或回市區吃'],['','下午行程','待安排']]],
['9/24','四','第六天',[['07:00','開車前往石卷',''],['09:00','石卷出航',''],['09:44','抵達貓島',''],['11:06','回航',''],['11:51','抵達石卷',''],['13:00','回到仙台中餐','']]],
['9/25','五','第七天',[['','金蛇水神社',''],['','購物',''],['晚上','還車','']]],
['9/26','六','第八天',[['','行李寄車站',''],['19:00','飛機','']]]];
let days=initial.map((d,i)=>({id:'d'+i,date:d[0],dow:d[1],label:d[2],events:d[3].map((e,j)=>({id:'e'+i+'_'+j,time:e[0],title:e[1],detail:e[2]}))})), db, activeEdit=null, rateValue=0;
const appEl=document.querySelector('#app'), nav=document.querySelector('#dayNav'), dlg=document.querySelector('#editor');
function esc(x=''){return String(x).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]))}
function maps(title){return 'https://www.google.com/maps/search/?api=1&query='+encodeURIComponent(title+' Japan')}
function render(){nav.innerHTML=days.map(d=>`<button data-day="${d.id}">${d.date}（${d.dow}）</button>`).join('');appEl.innerHTML=days.map(d=>`<section class="day" id="${d.id}"><div class="day-head"><h2 class="day-title">${d.date}　${d.label}</h2><span class="day-note">${d.dow}曜日</span></div><div class="timeline" data-events="${d.id}">${d.events.map(e=>`<article class="event" draggable="true" data-event="${e.id}"><span class="time">${esc(e.time)}</span><div class="event-card"><span class="drag" title="拖曳排序">⠿</span><div class="event-main"><div class="event-name">${esc(e.title)}</div>${e.detail?`<div class="detail">${esc(e.detail)}</div>`:''}</div><div class="event-actions"><a class="icon-btn" href="${maps(e.title)}" target="_blank" rel="noopener" title="Google 地圖導航">⌖</a><button class="icon-btn edit" title="編輯">✎</button></div></div></article>`).join('')}</div><button class="add" data-add="${d.id}">＋ 新增行程</button></section>`).join('');bindUI()}
function findEvent(id){for(const d of days){const e=d.events.find(x=>x.id===id);if(e)return {d,e}}}
function commit(){if(db)set(ref(db,'sendai-trip-v1'),days)}
function bindUI(){document.querySelectorAll('[data-day]').forEach(b=>b.onclick=()=>document.querySelector('#'+b.dataset.day).scrollIntoView());document.querySelectorAll('.edit').forEach(b=>b.onclick=()=>openEdit(findEvent(b.closest('.event').dataset.event)));document.querySelectorAll('[data-add]').forEach(b=>b.onclick=()=>openEdit({d:days.find(x=>x.id===b.dataset.add),e:null}));document.querySelectorAll('.event').forEach(el=>{el.addEventListener('dragstart',()=>el.classList.add('dragging'));el.addEventListener('dragend',()=>{el.classList.remove('dragging');document.querySelectorAll('.drag-over').forEach(x=>x.classList.remove('drag-over'))});el.addEventListener('dragover',e=>{e.preventDefault();el.classList.add('drag-over')});el.addEventListener('dragleave',()=>el.classList.remove('drag-over'));el.addEventListener('drop',e=>{e.preventDefault();const dragged=document.querySelector('.dragging');if(!dragged||dragged===el)return;const from=findEvent(dragged.dataset.event),to=findEvent(el.dataset.event);if(!from||!to)return;const item=from.d.events.splice(from.d.events.indexOf(from.e),1)[0];let at=to.d.events.indexOf(to.e);to.d.events.splice(at,0,item);commit();render()})})}
function openEdit(x){activeEdit=x;const f=document.querySelector('#eventForm');document.querySelector('#modalTitle').textContent=x.e?'編輯行程':'新增行程';f.time.value=x.e?.time||'';f.title.value=x.e?.title||'';f.detail.value=x.e?.detail||'';document.querySelector('#deleteBtn').style.display=x.e?'block':'none';dlg.showModal()}
document.querySelector('#cancelBtn').onclick=()=>dlg.close();document.querySelector('#deleteBtn').onclick=()=>{if(activeEdit.e){activeEdit.d.events=activeEdit.d.events.filter(e=>e!==activeEdit.e);commit();render()}dlg.close()};document.querySelector('#eventForm').onsubmit=e=>{e.preventDefault();const f=e.target,v={time:f.time.value.trim(),title:f.title.value.trim(),detail:f.detail.value.trim()};if(activeEdit.e)Object.assign(activeEdit.e,v);else activeEdit.d.events.push({id:'e'+Date.now(),...v});commit();render();dlg.close()};
function firebaseStart(){if(firebaseConfig.apiKey.startsWith('PASTE_')){render();return}try{db=getDatabase(initializeApp(firebaseConfig));const trip=ref(db,'sendai-trip-v1');onValue(trip,s=>{if(s.exists())days=s.val();else runTransaction(trip,current=>current||days);render()})}catch(e){console.warn(e);render()}}
async function services(){try{const data=await fetch('https://api.frankfurter.app/v1/latest?base=JPY&symbols=TWD').then(r=>r.json());rateValue=data.rates.TWD;document.querySelector('#rate').textContent=`1 円 ≈ ${rateValue.toFixed(4)} 元　·　${data.date} 更新`;document.querySelector('#twd').value=(+document.querySelector('#jpy').value*rateValue).toFixed(1)}catch{document.querySelector('#rate').textContent='匯率暫時無法取得'}try{const u='https://api.open-meteo.com/v1/forecast?latitude=38.2682&longitude=140.8694&current=temperature_2m,weather_code&daily=temperature_2m_max,temperature_2m_min&timezone=Asia%2FTokyo';const x=await fetch(u).then(r=>r.json()),code=x.current.weather_code,labels={0:'晴朗',1:'大致晴朗',2:'多雲',3:'陰天',45:'有霧',51:'毛毛雨',61:'下雨',71:'下雪',80:'陣雨',95:'雷雨'},icons={0:'☀',1:'🌤',2:'⛅',3:'☁',45:'〰',51:'🌦',61:'☂',71:'❄',80:'☔',95:'⚡'};document.querySelector('#temp').textContent=Math.round(x.current.temperature_2m)+'°';document.querySelector('#weatherText').textContent=labels[code]||'目前天氣';document.querySelector('#weatherIcon').textContent=icons[code]||'☁';document.querySelector('#weatherRange').textContent=`最高 ${Math.round(x.daily.temperature_2m_max[0])}°　最低 ${Math.round(x.daily.temperature_2m_min[0])}°`}catch{document.querySelector('#weatherText').textContent='暫時無法取得'}}
document.querySelector('#jpy').oninput=e=>{if(rateValue)document.querySelector('#twd').value=(e.target.value*rateValue).toFixed(1)};document.querySelector('#twd').oninput=e=>{if(rateValue)document.querySelector('#jpy').value=(e.target.value/rateValue).toFixed(0)};window.addEventListener('online',()=>document.querySelector('#offline').style.display='none');window.addEventListener('offline',()=>document.querySelector('#offline').style.display='block');
firebaseStart();services();if('serviceWorker'in navigator)navigator.serviceWorker.register('./service-worker.js');
</script></body></html>
