<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>仙台遊 9/19-9/26</title>
<meta name="description" content="仙台自由行協作行程表，多人即時共同編輯">
<meta name="theme-color" content="#ECE5D6">
<link rel="manifest" href="manifest.json">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="icon-192.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Shippori+Mincho:wght@500;600;700&family=Noto+Sans+TC:wght@400;500;700&display=swap" rel="stylesheet">
<style>
  :root{
    --paper: #ECE5D6;
    --paper-deep: #E1D8C4;
    --paper-card: #F4EFE3;
    --ink: #2B2822;
    --ink-soft: #6B6659;
    --ink-faint: #A69C87;
    --line: #C9BEA4;
    --indigo: #4B5B63;
    --indigo-soft: #7C8D93;
    --clay: #93604A;
    --gold: #A07A2E;
    --moss: #6C7A57;
    --shadow: 0 1px 0 rgba(43,40,34,.06);
    --radius: 3px;
    --serif: 'Shippori Mincho', 'Noto Serif TC', serif;
    --sans: 'Noto Sans TC', -apple-system, BlinkMacSystemFont, 'PingFang TC', 'Microsoft JhengHei', sans-serif;
    --safe-b: env(safe-area-inset-bottom, 0px);
    --safe-t: env(safe-area-inset-top, 0px);
  }

  *{ box-sizing:border-box; }
  html{ -webkit-text-size-adjust:100%; }
  body{
    margin:0;
    font-family:var(--sans);
    color:var(--ink);
    background:
      radial-gradient(ellipse at 15% 0%, rgba(255,255,255,.35), transparent 55%),
      radial-gradient(ellipse at 100% 30%, rgba(0,0,0,.03), transparent 45%),
      var(--paper);
    min-height:100vh;
    line-height:1.6;
    -webkit-font-smoothing:antialiased;
  }

  ::selection{ background:var(--gold); color:var(--paper); }

  a{ color:inherit; }

  button{
    font-family:inherit;
    -webkit-tap-highlight-color:transparent;
  }

  /* ---------- 紙紋質感（極輕量，用漸層模擬，不用外部圖檔）---------- */
  .grain{
    position:fixed; inset:0; pointer-events:none; z-index:0; opacity:.5; mix-blend-mode:multiply;
    background-image:
      repeating-linear-gradient(115deg, rgba(43,40,34,.015) 0px, rgba(43,40,34,.015) 1px, transparent 1px, transparent 3px),
      repeating-linear-gradient(25deg, rgba(43,40,34,.012) 0px, rgba(43,40,34,.012) 1px, transparent 1px, transparent 4px);
  }

  /* ---------- 頁首 ---------- */
  header.topbar{
    position:sticky; top:0; z-index:30;
    padding:calc(14px + var(--safe-t)) 20px 12px;
    background:var(--paper);
    border-bottom:1px solid var(--line);
  }
  header.topbar::after{
    content:"";
    position:absolute; left:0; right:0; bottom:-6px; height:6px;
    background:
      linear-gradient(90deg, transparent 0%, rgba(43,40,34,.05) 8%, transparent 16%,
      transparent 30%, rgba(43,40,34,.04) 38%, transparent 46%,
      transparent 62%, rgba(43,40,34,.05) 70%, transparent 78%);
  }
  .title-row{ display:flex; align-items:baseline; justify-content:space-between; gap:10px; }
  h1{
    font-family:var(--serif);
    font-weight:700;
    font-size:22px;
    letter-spacing:.04em;
    margin:0;
    display:flex; align-items:baseline; gap:10px; flex-wrap:wrap;
  }
  h1 .dates{
    font-family:var(--sans);
    font-weight:500;
    font-size:13px;
    color:var(--ink-soft);
    letter-spacing:.02em;
  }
  .sync-pill{
    flex:none;
    font-size:11px;
    color:var(--ink-soft);
    display:flex; align-items:center; gap:5px;
    padding:4px 9px;
    border:1px solid var(--line);
    border-radius:999px;
    background:var(--paper-card);
    white-space:nowrap;
  }
  .sync-dot{ width:6px; height:6px; border-radius:50%; background:var(--ink-faint); flex:none; }
  .sync-pill.live .sync-dot{ background:var(--moss); box-shadow:0 0 0 3px rgba(108,122,87,.18); }
  .sync-pill.local .sync-dot{ background:var(--clay); }

  /* ---------- 日期分頁 ---------- */
  nav.daytabs{
    position:sticky; top:calc(56px + var(--safe-t)); z-index:29;
    display:flex; gap:8px; overflow-x:auto;
    padding:10px 16px 12px;
    background:var(--paper);
    border-bottom:1px solid var(--line);
    scrollbar-width:none;
  }
  nav.daytabs::-webkit-scrollbar{ display:none; }
  .tab{
    flex:none;
    font-family:var(--serif);
    font-size:13px;
    color:var(--ink-soft);
    background:var(--paper-card);
    border:1px solid var(--line);
    border-radius:2px;
    padding:7px 12px 6px;
    cursor:pointer;
    position:relative;
    display:flex; flex-direction:column; align-items:center; gap:1px;
    line-height:1.25;
    transition:color .15s ease, border-color .15s ease;
  }
  .tab .n{ font-size:10px; letter-spacing:.12em; color:var(--ink-faint); }
  .tab.active{
    color:var(--ink);
    border-color:var(--ink);
    background:var(--paper-deep);
  }
  .tab.active::after{
    content:"";
    position:absolute; left:50%; bottom:-7px; transform:translateX(-50%);
    width:4px; height:4px; border-radius:50%;
    background:var(--gold);
  }

  /* ---------- 主體 ---------- */
  main{ max-width:640px; margin:0 auto; padding:22px 16px calc(120px + var(--safe-b)); position:relative; z-index:1; }

  .day-section{ margin-bottom:40px; scroll-margin-top:118px; }
  .day-head{ margin-bottom:18px; padding-left:2px; }
  .day-head .d-label{
    font-family:var(--serif); font-size:12px; letter-spacing:.18em; color:var(--indigo);
  }
  .day-head h2{
    font-family:var(--serif); font-weight:600; font-size:19px; margin:3px 0 0;
    letter-spacing:.02em;
  }

  .timeline{ position:relative; list-style:none; margin:0; padding:0 0 0 2px; }
  .timeline::before{
    content:"";
    position:absolute; left:52px; top:6px; bottom:6px; width:1px;
    background:linear-gradient(var(--line), var(--line) 92%, transparent);
  }

  .item{
    position:relative;
    display:grid;
    grid-template-columns:44px 1fr;
    column-gap:14px;
    padding:9px 0;
    touch-action:pan-y;
  }
  .item.dragging{ opacity:.55; }
  .item.drag-over-before{ box-shadow: inset 0 2px 0 var(--gold); }
  .item.drag-over-after{ box-shadow: inset 0 -2px 0 var(--gold); }

  .item .time{
    font-family:var(--serif);
    font-size:13px;
    color:var(--ink-soft);
    padding-top:9px;
    text-align:right;
    white-space:nowrap;
  }
  .item .time.empty{ color:var(--ink-faint); }
  .item .dot{
    position:absolute; left:52px; top:15px; width:7px; height:7px; margin-left:-3.5px;
    border-radius:50%; background:var(--paper); border:1.5px solid var(--indigo);
  }

  .card{
    background:var(--paper-card);
    border:1px solid var(--line);
    border-radius:var(--radius);
    padding:10px 12px 9px 14px;
    box-shadow:var(--shadow);
  }
  .card .row1{ display:flex; align-items:flex-start; gap:8px; }
  .card .grip{
    flex:none; cursor:grab; color:var(--ink-faint); font-size:15px; line-height:1;
    padding:3px 2px 3px 0; margin-top:1px; touch-action:none; user-select:none;
    letter-spacing:-1px;
  }
  .card .grip:active{ cursor:grabbing; }
  .card h3{
    font-family:var(--serif); font-weight:600; font-size:15px; margin:0; flex:1;
    letter-spacing:.01em;
  }
  .card .desc{
    font-size:12.5px; color:var(--ink-soft); margin:5px 0 0 0; line-height:1.65;
    white-space:pre-line;
  }
  .card .actions{ display:flex; gap:6px; margin-top:8px; }
  .card .actions a, .card .actions button{
    font-size:11px; color:var(--ink-soft);
    background:transparent; border:1px solid var(--line); border-radius:999px;
    padding:4px 10px; display:inline-flex; align-items:center; gap:4px;
    text-decoration:none; cursor:pointer;
  }
  .card .actions a:hover, .card .actions button:hover{ border-color:var(--indigo); color:var(--indigo); }

  .add-item{
    margin:14px 0 0 56px;
    background:transparent;
    border:1px dashed var(--line);
    color:var(--ink-soft);
    font-size:12.5px;
    padding:9px 14px;
    border-radius:var(--radius);
    cursor:pointer;
    width:calc(100% - 56px);
    text-align:left;
  }
  .add-item:hover{ border-color:var(--indigo); color:var(--indigo); }

  /* ---------- 浮動按鈕 ---------- */
  .fab-stack{
    position:fixed; right:16px; bottom:calc(20px + var(--safe-b)); z-index:40;
    display:flex; flex-direction:column; gap:10px;
  }
  .fab{
    width:46px; height:46px; border-radius:50%;
    background:var(--ink); color:var(--paper);
    border:1px solid var(--ink);
    font-size:18px;
    display:flex; align-items:center; justify-content:center;
    cursor:pointer;
    box-shadow:0 3px 10px rgba(43,40,34,.25);
  }

  /* ---------- 底部彈出面板 ---------- */
  .backdrop{
    position:fixed; inset:0; background:rgba(43,40,34,.38);
    opacity:0; pointer-events:none; transition:opacity .2s ease; z-index:49;
  }
  .backdrop.show{ opacity:1; pointer-events:auto; }

  .sheet{
    position:fixed; left:0; right:0; bottom:0; z-index:50;
    max-width:640px; margin:0 auto;
    background:var(--paper);
    border:1px solid var(--line); border-bottom:none;
    border-radius:14px 14px 0 0;
    padding:16px 20px calc(22px + var(--safe-b));
    transform:translateY(105%);
    transition:transform .25s cubic-bezier(.32,.72,.31,1);
    box-shadow:0 -8px 24px rgba(43,40,34,.18);
    max-height:82vh; overflow-y:auto;
  }
  .sheet.show{ transform:translateY(0); }
  .sheet .grabber{ width:36px; height:4px; border-radius:2px; background:var(--line); margin:0 auto 14px; }
  .sheet h3{ font-family:var(--serif); font-size:16px; margin:0 0 4px; }
  .sheet .sub{ font-size:12px; color:var(--ink-soft); margin:0 0 16px; }
  .sheet .close-x{
    position:absolute; right:14px; top:14px; background:none; border:none;
    font-size:18px; color:var(--ink-soft); cursor:pointer; padding:6px;
  }

  label.field{ display:block; margin-bottom:13px; }
  label.field .lbl{ display:block; font-size:11.5px; color:var(--ink-soft); margin-bottom:5px; letter-spacing:.04em; }
  label.field input, label.field textarea{
    width:100%; font-family:inherit; font-size:14.5px; color:var(--ink);
    background:var(--paper-card); border:1px solid var(--line); border-radius:var(--radius);
    padding:9px 11px; resize:vertical;
  }
  label.field input:focus, label.field textarea:focus{ outline:none; border-color:var(--indigo); }

  .btn-row{ display:flex; gap:10px; margin-top:6px; }
  .btn{
    flex:1; text-align:center; padding:11px; border-radius:var(--radius);
    font-size:14px; cursor:pointer; border:1px solid var(--line); background:var(--paper-card); color:var(--ink);
  }
  .btn.primary{ background:var(--ink); color:var(--paper); border-color:var(--ink); }
  .btn.danger{ background:transparent; color:var(--clay); border-color:var(--clay); flex:none; padding:11px 16px; }

  /* 匯率 */
  .rate-line{ font-size:12px; color:var(--ink-soft); margin-bottom:14px; }
  .rate-line b{ color:var(--ink); font-family:var(--serif); }
  .conv-row{ display:flex; align-items:center; gap:10px; margin-bottom:12px; }
  .conv-row .cur{ width:52px; font-size:12px; color:var(--ink-soft); font-family:var(--serif); }
  .conv-row input{
    flex:1; font-size:18px; font-family:var(--serif); color:var(--ink);
    background:var(--paper-card); border:1px solid var(--line); border-radius:var(--radius);
    padding:10px 12px;
  }
  .conv-row input:focus{ outline:none; border-color:var(--indigo); }
  .swap-mark{ text-align:center; font-size:11px; color:var(--ink-faint); margin:-4px 0 10px; letter-spacing:.2em; }

  /* 天氣 */
  .wx-list{ list-style:none; margin:0; padding:0; }
  .wx-list li{
    display:flex; align-items:center; gap:12px;
    padding:9px 0; border-bottom:1px solid var(--line);
  }
  .wx-list li:last-child{ border-bottom:none; }
  .wx-date{ width:78px; font-family:var(--serif); font-size:12.5px; color:var(--ink); flex:none; }
  .wx-icon{ font-size:20px; width:26px; text-align:center; flex:none; }
  .wx-desc{ flex:1; font-size:12px; color:var(--ink-soft); }
  .wx-temp{ font-size:12.5px; color:var(--ink); white-space:nowrap; font-family:var(--serif); }
  .wx-empty{ font-size:12px; color:var(--ink-faint); padding:14px 0; text-align:center; }

  .toast{
    position:fixed; left:50%; bottom:calc(28px + var(--safe-b)); transform:translateX(-50%) translateY(12px);
    background:var(--ink); color:var(--paper); font-size:12.5px;
    padding:9px 16px; border-radius:999px; z-index:60;
    opacity:0; pointer-events:none; transition:opacity .2s ease, transform .2s ease;
    white-space:nowrap;
  }
  .toast.show{ opacity:1; transform:translateX(-50%) translateY(0); }

  footer.credit{
    text-align:center; font-size:11px; color:var(--ink-faint);
    padding:0 20px calc(30px + var(--safe-b)); letter-spacing:.05em;
  }

  @media (min-width:640px){
    nav.daytabs{ padding-left:calc((100% - 640px)/2 + 16px); padding-right:calc((100% - 640px)/2 + 16px); }
    header.topbar{ padding-left:calc((100% - 640px)/2 + 20px); padding-right:calc((100% - 640px)/2 + 20px); }
  }
</style>
</head>
<body>
<div class="grain"></div>

<header class="topbar">
  <div class="title-row">
    <h1>仙台遊 <span class="dates">9/19 – 9/26</span></h1>
    <span class="sync-pill local" id="syncPill"><span class="sync-dot"></span><span id="syncText">連線中…</span></span>
  </div>
</header>

<nav class="daytabs" id="dayTabs"></nav>

<main id="main"></main>

<footer class="credit">旅途中隨手編修 · 內容會即時同步給所有人</footer>

<div class="fab-stack">
  <button class="fab" id="fabWeather" title="天氣">🌤️</button>
  <button class="fab" id="fabCurrency" title="匯率">💴</button>
</div>

<div class="backdrop" id="backdrop"></div>

<section class="sheet" id="weatherSheet">
  <button class="close-x" data-close>✕</button>
  <div class="grabber"></div>
  <h3>仙台天氣</h3>
  <p class="sub">資料來源 Open-Meteo（免金鑰，僅提供未來約 16 天內的預報）</p>
  <ul class="wx-list" id="wxList"><li class="wx-empty">讀取中…</li></ul>
</section>

<section class="sheet" id="currencySheet">
  <button class="close-x" data-close>✕</button>
  <div class="grabber"></div>
  <h3>日幣・新台幣 速算</h3>
  <p class="rate-line" id="rateLine">正在取得即時匯率…</p>
  <div class="conv-row">
    <span class="cur">JPY ¥</span>
    <input type="number" inputmode="decimal" id="jpyInput" placeholder="0">
  </div>
  <div class="swap-mark">≈ ⇅ ≈</div>
  <div class="conv-row">
    <span class="cur">TWD $</span>
    <input type="number" inputmode="decimal" id="twdInput" placeholder="0">
  </div>
</section>

<section class="sheet" id="editSheet">
  <button class="close-x" data-close>✕</button>
  <div class="grabber"></div>
  <h3 id="editTitle">編輯行程</h3>
  <p class="sub" id="editDayLabel"></p>
  <label class="field">
    <span class="lbl">時間（可留白，或填「晚上」等文字）</span>
    <input type="text" id="fTime" placeholder="例如 09:20">
  </label>
  <label class="field">
    <span class="lbl">標題</span>
    <input type="text" id="fTitle" placeholder="行程名稱">
  </label>
  <label class="field">
    <span class="lbl">備註</span>
    <textarea id="fDesc" rows="3" placeholder="交通、注意事項…"></textarea>
  </label>
  <label class="field">
    <span class="lbl">地圖搜尋關鍵字（給導航按鈕用，留白則用標題）</span>
    <input type="text" id="fLoc" placeholder="例如 瑞鳳殿">
  </label>
  <div class="btn-row">
    <button class="btn danger" id="btnDelete">刪除</button>
    <button class="btn" data-close>取消</button>
    <button class="btn primary" id="btnSave">儲存</button>
  </div>
</section>

<div class="toast" id="toast"></div>

<script src="https://www.gstatic.com/firebasejs/10.13.0/firebase-app-compat.js"></script>

function $(sel, root){ return (root||document).querySelector(sel); }
function $all(sel, root){ return Array.prototype.slice.call((root||document).querySelectorAll(sel)); }
function esc(s){
  return String(s==null?"":s).replace(/[&<>"']/g, function(c){
    return {"&":"&amp;","<":"&lt;",">":"&gt;","\"":"&quot;","'":"&#39;"}[c];
  });
}
function uid(){ return "ev" + Date.now().toString(36) + Math.random().toString(36).slice(2,7); }
function showToast(msg){
  var t = $("#toast");
  t.textContent = msg;
  t.classList.add("show");
  clearTimeout(showToast._tm);
  showToast._tm = setTimeout(function(){ t.classList.remove("show"); }, 1800);
}

/* =========================================================================
   4) 資料狀態
   本機記憶體中的資料結構： DATA = { day1:[{id,time,title,desc,loc,order}, ...], day2:[...], ... }
   ========================================================================= */
var DATA = {};
var DAY_META = {}; // id -> {iso,label,title}
SEED_DAYS.forEach(function(d){ DAY_META[d.id] = { iso:d.iso, label:d.label, title:d.title }; });

var dbRef = null;       // firebase database ref（有連上才會設定）
var useFirebase = false;
var lastRenderedJSON = {}; // 每天的資料 JSON 快取，避免不必要的重繪
var draggingDay = null;    // 正在拖曳排序中的天，暫停該天的即時重繪

/* =========================================================================
   5) Firebase 初始化與同步
   ========================================================================= */
function isConfigPlaceholder(){
  return !firebaseConfig.apiKey || firebaseConfig.apiKey.indexOf("REPLACE_ME") === 0;
}

function seedLocalData(){
  SEED_DAYS.forEach(function(d){
    DATA[d.id] = d.events.map(function(ev, i){
      return { id: uid(), time: ev.time||"", title: ev.title||"", desc: ev.desc||"", loc: ev.loc||"", order: i };
    });
  });
}

function initFirebase(){
  if (isConfigPlaceholder()) {
    setSyncState("local", "本機模式（尚未連接 Firebase）");
    seedLocalData();
    loadLocalStorageFallback();
    renderAllDays();
    return;
  }
  try{
    firebase.initializeApp(firebaseConfig);
    dbRef = firebase.database().ref(DB_ROOT);
    useFirebase = true;
    setSyncState("connecting", "連線中…");

    dbRef.once("value").then(function(snap){
      if (!snap.exists()) {
        // 資料庫是空的：寫入預設行程
        var initPayload = {};
        SEED_DAYS.forEach(function(d){
          var obj = {};
          d.events.forEach(function(ev, i){
            var id = uid();
            obj[id] = { time: ev.time||"", title: ev.title||"", desc: ev.desc||"", loc: ev.loc||"", order:i };
          });
          initPayload[d.id] = obj;
        });
        dbRef.set(initPayload);
      }
    }).catch(function(err){
      console.error(err);
      setSyncState("local", "連線失敗，改用本機模式");
      seedLocalData();
      renderAllDays();
    });

    dbRef.on("value", function(snap){
      var val = snap.val() || {};
      SEED_DAYS.forEach(function(d){
        var raw = val[d.id] || {};
        var list = Object.keys(raw).map(function(key){
          var e = raw[key] || {};
          return { id:key, time:e.time||"", title:e.title||"", desc:e.desc||"", loc:e.loc||"", order: (typeof e.order==="number")?e.order:0 };
        });
        list.sort(function(a,b){ return a.order - b.order; });
        DATA[d.id] = list;
      });
      setSyncState("live", "即時同步中");
      renderChangedDays();
    }, function(err){
      console.error(err);
      setSyncState("local", "連線中斷，改用本機模式");
    });
  }catch(err){
    console.error(err);
    setSyncState("local", "本機模式（Firebase 設定有誤）");
    seedLocalData();
    renderAllDays();
  }
}

function setSyncState(state, text){
  var pill = $("#syncPill");
  pill.className = "sync-pill " + (state==="live" ? "live" : "local");
  $("#syncText").textContent = text;
}

/* 沒接 Firebase 時，退而求其次用 localStorage 記住本機的編輯（僅限這台裝置） */
function loadLocalStorageFallback(){
  try{
    var raw = localStorage.getItem("sendaiTripLocal");
    if (raw) {
      var parsed = JSON.parse(raw);
      Object.keys(parsed).forEach(function(k){ if (DATA[k]) DATA[k] = parsed[k]; });
    }
  }catch(e){}
}
function saveLocalStorageFallback(){
  try{ localStorage.setItem("sendaiTripLocal", JSON.stringify(DATA)); }catch(e){}
}

/* =========================================================================
   6) 寫入操作（新增 / 編輯 / 刪除 / 排序），兩種模式（Firebase or 本機）共用介面
   ========================================================================= */
function writeEvent(dayId, ev){
  if (useFirebase) {
    var payload = { time: ev.time||"", title: ev.title||"", desc: ev.desc||"", loc: ev.loc||"", order: ev.order||0 };
    dbRef.child(dayId).child(ev.id).set(payload);
  } else {
    var list = DATA[dayId] || (DATA[dayId] = []);
    var idx = list.findIndex(function(x){ return x.id===ev.id; });
    if (idx>=0) list[idx] = ev; else list.push(ev);
    saveLocalStorageFallback();
    renderDay(dayId);
  }
}
function deleteEvent(dayId, evId){
  if (useFirebase) {
    dbRef.child(dayId).child(evId).remove();
  } else {
    DATA[dayId] = (DATA[dayId]||[]).filter(function(x){ return x.id!==evId; });
    saveLocalStorageFallback();
    renderDay(dayId);
  }
}
function writeOrder(dayId, orderedIds){
  if (useFirebase) {
    var updates = {};
    orderedIds.forEach(function(id, i){ updates[dayId + "/" + id + "/order"] = i; });
    dbRef.root.update(prefixUpdates(updates));
  } else {
    var list = DATA[dayId]||[];
    orderedIds.forEach(function(id, i){
      var it = list.find(function(x){ return x.id===id; });
      if (it) it.order = i;
    });
    list.sort(function(a,b){ return a.order-b.order; });
    saveLocalStorageFallback();
  }
}
function prefixUpdates(updates){
  var out = {};
  Object.keys(updates).forEach(function(k){ out[DB_ROOT + "/" + k] = updates[k]; });
  return out;
}

      '<div class="time'+(ev.time?'':' empty')+'">'+(esc(ev.time)||'－')+'</div>'+
      '<div class="dot"></div>'+
      '<div class="card">'+
        '<div class="row1">'+
          '<span class="grip" data-grip>⠿</span>'+
          '<h3>'+esc(ev.title || "（未命名）")+'</h3>'+
        '</div>'+
        (ev.desc ? '<p class="desc">'+esc(ev.desc)+'</p>' : '')+
        '<div class="actions">'+
          '<a href="'+mapHref+'" target="_blank" rel="noopener">🗺️ 導航</a>'+
          '<button type="button" data-edit>✏️ 編輯</button>'+
        '</div>'+
      '</div>'+
    '</li>'
  );
}

function renderDay(dayId){
  var list = (DATA[dayId]||[]).slice().sort(function(a,b){ return a.order-b.order; });
  var ul = document.getElementById("tl-"+dayId);
  if (!ul) return;
  ul.innerHTML = list.map(function(ev){ return eventCardHTML(dayId, ev); }).join("");
  lastRenderedJSON[dayId] = JSON.stringify(list);
}

function renderAllDays(){
  SEED_DAYS.forEach(function(d){ renderDay(d.id); });
}

function renderChangedDays(){
  SEED_DAYS.forEach(function(d){
    if (draggingDay === d.id) return; // 拖曳中先不要重繪，避免手感被打斷
    var list = (DATA[d.id]||[]).slice().sort(function(a,b){ return a.order-b.order; });
    var json = JSON.stringify(list);
    if (json !== lastRenderedJSON[d.id]) renderDay(d.id);
  });
}

/* Sticky 分頁：捲動時自動高亮目前所在的天 */
function setupActiveTabObserver(){
  var tabs = $all(".tab");
  var sections = SEED_DAYS.map(function(d){ return document.getElementById(d.id); });
  var io = new IntersectionObserver(function(entries){
    entries.forEach(function(entry){
      if (!entry.isIntersecting) return;
      var id = entry.target.id;
      tabs.forEach(function(t){ t.classList.toggle("active", t.dataset.day===id); });
    });
  }, { rootMargin: "-120px 0px -70% 0px", threshold: 0 });
  sections.forEach(function(s){ if (s) io.observe(s); });
}

var editingCtx = null; // { dayId, evId } 或 { dayId, isNew:true }

function openEditSheet(dayId, evId){
  var meta = DAY_META[dayId];
  var isNew = !evId;
  var ev = isNew ? { time:"", title:"", desc:"", loc:"" } : (DATA[dayId]||[]).find(function(x){ return x.id===evId; });
  if (!ev) return;
  editingCtx = { dayId:dayId, evId: isNew? null : evId, isNew: isNew };
  $("#editTitle").textContent = isNew ? "新增行程" : "編輯行程";
  $("#editDayLabel").textContent = meta ? (meta.label + "　" + meta.title) : "";
  $("#fTime").value = ev.time||"";
  $("#fTitle").value = ev.title||"";
  $("#fDesc").value = ev.desc||"";
  $("#fLoc").value = ev.loc||"";
  $("#btnDelete").style.display = isNew ? "none" : "inline-block";
  openSheet("#editSheet");
  setTimeout(function(){ $("#fTitle").focus(); }, 260);
}

function saveEditSheet(){
  if (!editingCtx) return;
  var title = $("#fTitle").value.trim();
  if (!title) { showToast("請輸入標題"); return; }
  var dayId = editingCtx.dayId;
  if (editingCtx.isNew) {
    var list = DATA[dayId]||[];
    var maxOrder = list.reduce(function(m,x){ return Math.max(m, x.order||0); }, -1);
    var ev = { id: uid(), time:$("#fTime").value.trim(), title:title, desc:$("#fDesc").value.trim(), loc:$("#fLoc").value.trim(), order: maxOrder+1 };
    writeEvent(dayId, ev);
  } else {
    var cur = (DATA[dayId]||[]).find(function(x){ return x.id===editingCtx.evId; });
    var order = cur ? cur.order : 0;
    var ev2 = { id: editingCtx.evId, time:$("#fTime").value.trim(), title:title, desc:$("#fDesc").value.trim(), loc:$("#fLoc").value.trim(), order: order };
    writeEvent(dayId, ev2);
  }
  closeSheets();
  showToast("已儲存");
}

function deleteCurrentEvent(){
  if (!editingCtx || editingCtx.isNew) return;
  deleteEvent(editingCtx.dayId, editingCtx.evId);
  closeSheets();
  showToast("已刪除");
}

document.addEventListener("click", function(e){

/* =========================================================================
   9) 拖拉排序（Pointer Events，支援觸控與滑鼠）
   ========================================================================= */
(function setupDragReorder(){
  var dragEl = null, dayId = null, startY = 0, placeholderIndex = -1, itemsEls = [];

  document.addEventListener("pointerdown", function(e){
    var grip = e.target.closest("[data-grip]");
    if (!grip) return;
    var li = grip.closest(".item");
    if (!li) return;
    e.preventDefault();
    dragEl = li;
    dayId = li.dataset.day;
    draggingDay = dayId;
    startY = e.clientY;
    var ul = document.getElementById("tl-"+dayId);
    itemsEls = $all(".item", ul);
    placeholderIndex = itemsEls.indexOf(li);
    li.classList.add("dragging");
    li.setPointerCapture && grip.setPointerCapture(e.pointerId);
    document.addEventListener("pointermove", onMove);
    document.addEventListener("pointerup", onUp, { once:true });
  });

  function onMove(e){
    if (!dragEl) return;
    var dy = e.clientY - startY;
    dragEl.style.transform = "translateY("+dy+"px)";
    dragEl.style.zIndex = "5";
    dragEl.style.position = "relative";

    // 找出目前指標所在的項目，決定插入位置
    var overEl = null;
    for (var i=0;i<itemsEls.length;i++){
      var el = itemsEls[i];
      if (el===dragEl) continue;
      var r = el.getBoundingClientRect();
      if (e.clientY > r.top && e.clientY < r.bottom) { overEl = el; break; }
    }
    itemsEls.forEach(function(el){ el.classList.remove("drag-over-before","drag-over-after"); });
    if (overEl) {
      var idx = itemsEls.indexOf(overEl);
      var r2 = overEl.getBoundingClientRect();
      var before = e.clientY < (r2.top + r2.height/2);
      overEl.classList.add(before ? "drag-over-before" : "drag-over-after");
      placeholderIndex = before ? idx : idx+1;
      if (placeholderIndex > itemsEls.indexOf(dragEl)) placeholderIndex--;
    }
  }

  function onUp(){
    document.removeEventListener("pointermove", onMove);
    if (!dragEl) return;
    dragEl.style.transform = "";
    dragEl.style.zIndex = "";
    dragEl.style.position = "";
    dragEl.classList.remove("dragging");
    itemsEls.forEach(function(el){ el.classList.remove("drag-over-before","drag-over-after"); });

    var ul = document.getElementById("tl-"+dayId);
    var order = $all(".item", ul).map(function(el){ return el.dataset.id; });
    var fromIdx = order.indexOf(dragEl.dataset.id);
    order.splice(fromIdx, 1);
    var insertAt = Math.max(0, Math.min(placeholderIndex, order.length));
    order.splice(insertAt, 0, dragEl.dataset.id);

    // 依新順序重排 DOM，立即回饋
    order.forEach(function(id){
      var el = ul.querySelector('.item[data-id="'+id+'"]');
      if (el) ul.appendChild(el);
    });

    writeOrder(dayId, order);
    draggingDay = null;
    dragEl = null;
  }
})();

   11) 匯率速算（open.er-api.com，免金鑰）
   ========================================================================= */
var FALLBACK_RATE = 0.215; // 抓取失敗時的備援參考值（1 JPY ≈ 幾元 TWD）
var currentRate = null;
var rateLoaded = false;

function loadRate(){
  if (rateLoaded) return;
  rateLoaded = true;
  fetch("https://open.er-api.com/v6/latest/JPY")
    .then(function(r){ return r.json(); })
    .then(function(data){
      if (data && data.rates && data.rates.TWD) {
        currentRate = data.rates.TWD;
        $("#rateLine").innerHTML = "即時匯率　1 <b>JPY</b> ≈ <b>"+currentRate.toFixed(4)+"</b> TWD";
      } else {
        throw new Error("no rate");
      }
    })
    .catch(function(){
      currentRate = FALLBACK_RATE;
      $("#rateLine").innerHTML = "（即時匯率取得失敗，暫用參考值）1 <b>JPY</b> ≈ <b>"+FALLBACK_RATE+"</b> TWD";
    });
}

var jpyEl = $("#jpyInput"), twdEl = $("#twdInput");
jpyEl.addEventListener("input", function(){
  var r = currentRate || FALLBACK_RATE;
  var v = parseFloat(jpyEl.value);
  twdEl.value = isNaN(v) ? "" : Math.round(v * r * 100)/100;
});
twdEl.addEventListener("input", function(){
  var r = currentRate || FALLBACK_RATE;
  var v = parseFloat(twdEl.value);
  jpyEl.value = isNaN(v) ? "" : Math.round((v / r) * 100)/100;
});

/* =========================================================================
   12) 天氣（Open-Meteo，免金鑰）
   ========================================================================= */
var wxLoaded = false;
function wmoIcon(code){
  if (code===0) return "☀️";
  if (code===1) return "🌤️";
  if (code===2) return "⛅";
  if (code===3) return "☁️";
  if (code===45||code===48) return "🌫️";
  if ([51,53,55,56,57].indexOf(code)>=0) return "🌦️";
  if ([61,63,65,66,67,80,81,82].indexOf(code)>=0) return "🌧️";
  if ([71,73,75,77,85,86].indexOf(code)>=0) return "❄️";
  if ([95,96,99].indexOf(code)>=0) return "⛈️";
  return "🌡️";
}
function wmoText(code){
  var map = {0:"晴朗",1:"晴時多雲",2:"多雲時晴",3:"陰天",45:"有霧",48:"霧淞",
    51:"小毛毛雨",53:"毛毛雨",55:"大毛毛雨",56:"凍雨",57:"凍雨",
    61:"小雨",63:"中雨",65:"大雨",66:"凍雨",67:"凍雨",
    71:"小雪",73:"中雪",75:"大雪",77:"雪粒",
    80:"陣雨",81:"陣雨",82:"強陣雨",85:"陣雪",86:"強陣雪",
    95:"雷雨",96:"雷雨挾冰雹",99:"強雷雨挾冰雹"};
  return map[code] || "－";
}

function loadWeather(){
  if (wxLoaded) return;
  wxLoaded = true;
  var start = SEED_DAYS[0].iso, end = SEED_DAYS[SEED_DAYS.length-1].iso;
  var url = "https://api.open-meteo.com/v1/forecast?latitude="+LAT+"&longitude="+LON+
    "&daily=weather_code,temperature_2m_max,temperature_2m_min,precipitation_probability_max"+
    "&timezone=Asia%2FTokyo&start_date="+start+"&end_date="+end;
  fetch(url).then(function(r){ return r.json(); }).then(function(data){
    if (!data || !data.daily || !data.daily.time) throw new Error("no data");
    var byIso = {};
    data.daily.time.forEach(function(iso, i){
      byIso[iso] = {
        code: data.daily.weather_code[i],
        max: data.daily.temperature_2m_max[i],
        min: data.daily.temperature_2m_min[i],
        pop: data.daily.precipitation_probability_max[i]
      };
    });
    var html = SEED_DAYS.map(function(d){
      var w = byIso[d.iso];
      if (!w) {
        return '<li><span class="wx-date">'+d.label.replace(/（.+）/,'')+'</span><span class="wx-desc" style="flex:1">預報尚未開放（僅提供約 16 天內）</span></li>';
      }
      return '<li><span class="wx-date">'+d.label.replace(/（.+）/,'')+'</span>'+
        '<span class="wx-icon">'+wmoIcon(w.code)+'</span>'+
        '<span class="wx-desc">'+wmoText(w.code)+'・降雨 '+Math.round(w.pop)+'%</span>'+
        '<span class="wx-temp">'+Math.round(w.min)+'° / '+Math.round(w.max)+'°</span></li>';
    }).join("");
    $("#wxList").innerHTML = html;
  }).catch(function(){
    $("#wxList").innerHTML = '<li class="wx-empty">天氣資料取得失敗，稍後再試一次。</li>';
    wxLoaded = false;
  });
}

/* =========================================================================
   13) PWA：註冊 Service Worker
   ========================================================================= */
if ("serviceWorker" in navigator) {
  window.addEventListener("load", function(){
    navigator.serviceWorker.register("sw.js").catch(function(err){ console.warn("SW 註冊失敗", err); });
  });
}

   ========================================================================= */
buildTabs();
buildSkeleton();
setupActiveTabObserver();
initFirebase();

})();
