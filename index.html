<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>仙台夏日行程 · 9/19–9/26</title>
<meta name="description" content="五人仙台自由行協作行程表">
<meta name="theme-color" content="#3F6E7A">
<link rel="manifest" href="./manifest.json">
<link rel="icon" href="./icon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="./icon.svg">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="仙台行程">

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Zen+Maru+Gothic:wght@500;700;900&family=Noto+Sans+TC:wght@400;500;700&display=swap" rel="stylesheet">

<style>
  :root{
    --paper:#F3EAD3;
    --paper-card:#FBF6E9;
    --ink:#2C3B45;
    --ink-soft:#4C5F6B;
    --sea:#3F6E7A;
    --sea-deep:#2A4A54;
    --sky:#7FBAC4;
    --sun:#E4692F;
    --sun-deep:#C6541F;
    --green:#7C9463;
    --gold:#C99A3E;
    --line:#D9C9A3;
    --danger:#B4483C;
    --radius-lg:22px;
    --radius-md:14px;
    --radius-sm:9px;
    --shadow-card:0 3px 0 rgba(44,59,69,0.08), 0 10px 24px -14px rgba(44,59,69,0.35);
    --font-display:'Zen Maru Gothic', sans-serif;
    --font-body:'Noto Sans TC','Noto Sans JP',sans-serif;
  }

  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;}
  body{
    background:
      radial-gradient(circle at 12% 8%, rgba(127,186,196,0.35), transparent 40%),
      radial-gradient(circle at 90% 4%, rgba(228,105,47,0.15), transparent 45%),
      var(--paper);
    color:var(--ink);
    font-family:var(--font-body);
    line-height:1.6;
    -webkit-font-smoothing:antialiased;
    padding-bottom:64px;
  }

  ::selection{background:var(--sun);color:#fff;}

  a{color:var(--sea-deep);}

  button{font-family:inherit;}

  h1,h2,h3{font-family:var(--font-display); margin:0; color:var(--ink);}

  /* ---------- sprocket strip ---------- */
  .sprockets{
    display:flex;
    justify-content:space-between;
    padding:6px 14px;
    background:var(--ink);
  }
  .sprockets span{
    width:8px;height:8px;border-radius:2px;
    background:var(--paper);
    opacity:.55;
  }

  /* ---------- header ---------- */
  header.top{
    background:linear-gradient(160deg, var(--sea) 0%, var(--sea-deep) 100%);
    color:var(--paper-card);
    padding:18px 18px 16px;
    position:relative;
    overflow:hidden;
  }
  header.top::after{
    content:"";
    position:absolute; right:-40px; bottom:-60px;
    width:180px;height:180px;border-radius:50%;
    background:radial-gradient(circle, rgba(228,105,47,0.35), transparent 70%);
  }
  .trip-title{
    font-size:1.5rem;
    font-weight:900;
    letter-spacing:.02em;
    display:flex;
    align-items:baseline;
    gap:10px;
  }
  .trip-title .accent{color:var(--sun);}
  .trip-sub{
    margin-top:4px;
    font-size:.85rem;
    color:#DCEAEA;
    display:flex;
    gap:14px;
    flex-wrap:wrap;
  }
  .conn-dot{
    display:inline-flex; align-items:center; gap:6px;
    font-size:.75rem; color:#DCEAEA;
  }
  .conn-dot i{
    width:8px;height:8px;border-radius:50%;
    background:#9AA; display:inline-block;
    box-shadow:0 0 0 3px rgba(255,255,255,0.08);
  }
  .conn-dot.online i{background:#8FC97A;}
  .conn-dot.offline i{background:var(--danger);}

  /* ---------- utility bar (currency / weather) ---------- */
  .utility-bar{
    display:flex;
    gap:8px;
    padding:12px 14px;
    background:var(--paper);
    border-bottom:1px dashed var(--line);
    overflow-x:auto;
  }
  .util-toggle{
    flex:0 0 auto;
    display:flex; align-items:center; gap:6px;
    background:var(--paper-card);
    border:1px solid var(--line);
    border-radius:999px;
    padding:8px 14px;
    font-size:.82rem;
    font-weight:500;
    color:var(--ink-soft);
    cursor:pointer;
    box-shadow:var(--shadow-card);
    white-space:nowrap;
  }
  .util-toggle .ico{font-size:1rem;}
  .util-toggle[aria-expanded="true"]{
    background:var(--sun);
    color:#fff;
    border-color:var(--sun-deep);
  }

  .util-panel{
    display:none;
    padding:14px 16px 18px;
    background:var(--paper-card);
    border-bottom:1px solid var(--line);
  }
  .util-panel.open{display:block;}

  .fx-row{display:flex; gap:10px; align-items:center; flex-wrap:wrap;}
  .fx-field{
    display:flex; flex-direction:column; gap:4px; flex:1; min-width:120px;
  }
  .fx-field label{font-size:.72rem; color:var(--ink-soft);}
  .fx-field input, .fx-field select{
    border:1px solid var(--line);
    border-radius:var(--radius-sm);
    padding:9px 10px;
    font-size:1rem;
    font-family:inherit;
    background:#fff;
    color:var(--ink);
  }
  .fx-swap{
    align-self:flex-end;
    border:1px solid var(--line);
    background:#fff;
    border-radius:50%;
    width:38px;height:38px;
    display:flex;align-items:center;justify-content:center;
    cursor:pointer;
    color:var(--sea-deep);
    font-size:1.1rem;
  }
  .fx-note{margin-top:8px; font-size:.72rem; color:var(--ink-soft);}

  .weather-grid{
    display:grid;
    grid-template-columns:repeat(auto-fill,minmax(84px,1fr));
    gap:8px;
  }
  .weather-cell{
    background:#fff;
    border:1px solid var(--line);
    border-radius:var(--radius-sm);
    padding:8px 6px;
    text-align:center;
  }
  .weather-cell .wd{font-size:.68rem; color:var(--ink-soft);}
  .weather-cell .wicon{font-size:1.35rem; margin:2px 0;}
  .weather-cell .wtemp{font-size:.78rem; font-weight:700;}
  .weather-cell .wtemp .lo{color:var(--sea-deep); font-weight:400;}

  /* ---------- day nav ---------- */
  .day-nav{
    display:flex;
    gap:8px;
    padding:12px 14px;
    overflow-x:auto;
    background:var(--sea-deep);
    scroll-snap-type:x proximity;
  }
  .day-nav::-webkit-scrollbar{display:none;}
  .day-chip{
    scroll-snap-align:start;
    flex:0 0 auto;
    background:rgba(255,255,255,0.08);
    border:1px solid rgba(255,255,255,0.18);
    color:#E4EEEE;
    border-radius:var(--radius-md);
    padding:8px 12px;
    text-align:left;
    cursor:pointer;
    min-width:72px;
  }
  .day-chip .fno{
    font-size:.62rem; letter-spacing:.06em; color:#B9D3D3;
    font-family:var(--font-display);
  }
  .day-chip .fdate{font-size:.86rem; font-weight:700;}
  .day-chip.active{
    background:var(--sun);
    border-color:var(--sun-deep);
    color:#fff;
  }
  .day-chip.active .fno{color:#FBD9C4;}

  /* ---------- trip info card ---------- */
  .wrap{max-width:640px; margin:0 auto; padding:16px;}

  .card{
    background:var(--paper-card);
    border:1px solid var(--line);
    border-radius:var(--radius-lg);
    box-shadow:var(--shadow-card);
    padding:16px 16px 18px;
    margin-bottom:18px;
  }
  .card h2{font-size:1.02rem; margin-bottom:10px; display:flex; align-items:center; gap:8px;}
  .card h2 .tag{
    font-size:.65rem; background:var(--green); color:#fff; padding:2px 8px; border-radius:999px;
    font-family:var(--font-body); font-weight:700;
  }

  .info-grid{display:grid; grid-template-columns:1fr; gap:10px;}
  .info-item{display:flex; flex-direction:column; gap:3px;}
  .info-item .k{font-size:.7rem; color:var(--ink-soft);}
  .info-item [contenteditable]{
    border-bottom:1px dashed var(--line);
    padding:4px 2px;
    font-size:.95rem;
    min-height:1.4em;
    outline:none;
    white-space:pre-wrap;
  }
  .info-item [contenteditable]:focus{
    border-bottom:1px solid var(--sun);
    background:rgba(228,105,47,0.06);
  }

  /* ---------- day section ---------- */
  .day-section{scroll-margin-top:12px; margin-bottom:26px;}
  .day-head{
    display:flex; align-items:baseline; gap:10px; margin-bottom:12px; padding-left:2px;
  }
  .day-head .fno{
    font-family:var(--font-display); font-weight:900; color:var(--sun);
    font-size:.78rem; border:1.5px solid var(--sun); border-radius:6px; padding:1px 6px;
  }
  .day-head h2{font-size:1.15rem;}
  .day-head .dlabel{font-size:.8rem; color:var(--ink-soft);}

  .timeline{position:relative; padding-left:34px;}
  .timeline::before{
    content:"";
    position:absolute; left:14px; top:6px; bottom:6px; width:2px;
    background:repeating-linear-gradient(to bottom, var(--gold) 0 6px, transparent 6px 11px);
  }

  .item{
    position:relative;
    background:var(--paper-card);
    border:1px solid var(--line);
    border-radius:var(--radius-md);
    box-shadow:var(--shadow-card);
    padding:10px 12px 11px 14px;
    margin-bottom:10px;
    display:flex;
    gap:8px;
    align-items:flex-start;
  }
  .item::before{
    content:"";
    position:absolute; left:-27px; top:16px;
    width:12px; height:12px; border-radius:50%;
    background:var(--sea);
    border:2px solid var(--paper-card);
    box-shadow:0 0 0 2px var(--gold);
  }
  .item.sortable-ghost{opacity:.35;}
  .item.sortable-drag{box-shadow:0 10px 20px -6px rgba(0,0,0,.35);}

  .item .grip{
    flex:0 0 auto;
    color:var(--line);
    cursor:grab;
    font-size:1.1rem;
    line-height:1;
    padding:4px 2px;
    touch-action:none;
    user-select:none;
  }
  .item .body{flex:1; min-width:0;}
  .item .time{
    font-family:var(--font-display);
    font-weight:700;
    color:var(--sun-deep);
    font-size:.86rem;
    display:inline-block;
    margin-bottom:2px;
  }
  .item .time:empty::before{content:"—"; color:var(--line);}
  .item .title{font-weight:500; font-size:.97rem; word-break:break-word;}
  .item .note{
    margin-top:3px; font-size:.82rem; color:var(--ink-soft);
    white-space:pre-wrap; word-break:break-word;
  }
  .item .edit-btn{
    flex:0 0 auto;
    background:none; border:none;
    color:var(--sea-deep);
    font-size:1.05rem;
    cursor:pointer;
    padding:4px 2px;
  }

  .add-item-btn{
    margin-left:34px;
    display:flex; align-items:center; gap:6px;
    background:none;
    border:1.5px dashed var(--sea);
    color:var(--sea-deep);
    border-radius:var(--radius-md);
    padding:10px 14px;
    font-size:.88rem;
    font-weight:500;
    cursor:pointer;
    width:calc(100% - 34px);
  }
  .add-item-btn:active{background:rgba(63,110,122,0.08);}

  .empty-day{
    margin-left:34px;
    color:var(--ink-soft);
    font-size:.85rem;
    padding:14px 0;
  }

  /* ---------- modal ---------- */
  .sheet-backdrop{
    position:fixed; inset:0; background:rgba(44,59,69,0.45);
    display:none; align-items:flex-end; justify-content:center;
    z-index:50;
  }
  .sheet-backdrop.open{display:flex;}
  .sheet{
    background:var(--paper-card);
    width:100%; max-width:640px;
    border-radius:22px 22px 0 0;
    padding:18px 18px calc(18px + env(safe-area-inset-bottom));
    box-shadow:0 -10px 30px rgba(0,0,0,.25);
    max-height:86vh;
    overflow-y:auto;
  }
  .sheet-handle{
    width:40px;height:4px;border-radius:2px;background:var(--line);
    margin:0 auto 14px;
  }
  .sheet h3{font-size:1.05rem; margin-bottom:14px;}
  .field{margin-bottom:12px; display:flex; flex-direction:column; gap:4px;}
  .field label{font-size:.75rem; color:var(--ink-soft);}
  .field input, .field textarea{
    border:1px solid var(--line);
    border-radius:var(--radius-sm);
    padding:10px 11px;
    font-size:1rem;
    font-family:inherit;
    background:#fff;
    color:var(--ink);
    resize:vertical;
  }
  .field textarea{min-height:70px;}
  .sheet-actions{display:flex; gap:10px; margin-top:16px;}
  .btn{
    flex:1;
    border:none;
    border-radius:var(--radius-sm);
    padding:12px;
    font-size:.94rem;
    font-weight:700;
    cursor:pointer;
    font-family:inherit;
  }
  .btn-primary{background:var(--sun); color:#fff;}
  .btn-primary:active{background:var(--sun-deep);}
  .btn-ghost{background:#fff; color:var(--ink-soft); border:1px solid var(--line);}
  .btn-danger{background:none; color:var(--danger); border:1px solid var(--danger); flex:0 0 auto; width:44px;}

  footer.app-footer{
    text-align:center; font-size:.72rem; color:var(--ink-soft); padding:20px 16px 6px;
  }

  @media (min-width:560px){
    .info-grid{grid-template-columns:1fr 1fr;}
  }

  @media (prefers-reduced-motion: reduce){
    *{scroll-behavior:auto !important; transition:none !important;}
  }
</style>
</head>

</div>

<header class="top">
  <div class="trip-title"><span class="accent">仙台</span>夏日行</div>
  <div class="trip-sub">
    <span id="hdrDateRange">9/19 – 9/26</span>
    <span id="connIndicator" class="conn-dot offline"><i></i>連線中…</span>
  </div>
</header>

<!-- Utility bar -->
<div class="utility-bar">
  <button class="util-toggle" id="toggleFx" aria-expanded="false"><span class="ico">💴</span>匯率換算</button>
  <button class="util-toggle" id="toggleWx" aria-expanded="false"><span class="ico">🌤️</span>仙台天氣</button>
</div>

<div class="util-panel" id="fxPanel">
  <div class="fx-row">
    <div class="fx-field">
      <label for="fxFrom">從</label>
      <input type="number" id="fxAmount" value="1000" inputmode="decimal">
      <select id="fxFrom"></select>
    </div>
    <button class="fx-swap" id="fxSwap" title="交換幣別" type="button">⇄</button>
    <div class="fx-field">
      <label for="fxTo">換成</label>
      <input type="text" id="fxResult" readonly>
      <select id="fxTo"></select>
    </div>
  </div>
  <div class="fx-note" id="fxUpdated">即時匯率讀取中…</div>
</div>

<div class="util-panel" id="wxPanel">
  <div class="weather-grid" id="weatherGrid">
    <div class="weather-cell"><div class="wd">讀取中</div></div>
  </div>
  <div class="fx-note">資料來源：Open-Meteo（免金鑰），僅未來 16 天內提供實際預報</div>
</div>

<!-- Day navigation -->
<nav class="day-nav" id="dayNav" aria-label="行程天數"></nav>

<div class="wrap">

  <!-- Trip info -->
  <section class="card">
    <h2>旅程資訊 <span class="tag">可編輯</span></h2>
    <div class="info-grid">
      <div class="info-item">
        <span class="k">目的地</span>
        <div contenteditable="true" id="infoDestination" data-path="tripInfo/destination"></div>
      </div>
      <div class="info-item">
        <span class="k">日期</span>
        <div contenteditable="true" id="infoDates" data-path="tripInfo/dateRange"></div>
      </div>
      <div class="info-item">
        <span class="k">成員</span>
        <div contenteditable="true" id="infoMembers" data-path="tripInfo/members"></div>
      </div>
      <div class="info-item">
        <span class="k">住宿</span>
        <div contenteditable="true" id="infoHotels" data-path="tripInfo/hotels"></div>
      </div>
      <div class="info-item" style="grid-column:1/-1">
        <span class="k">航班</span>
        <div contenteditable="true" id="infoFlights" data-path="tripInfo/flights"></div>
      </div>
    </div>
  </section>

  <div id="daysContainer"></div>

</div>

<footer class="app-footer">
  仙台夏日行 · 內容由所有持有連結的成員共同即時編輯
</footer>

<!-- Edit / Add item sheet -->
<div class="sheet-backdrop" id="sheetBackdrop">
  <div class="sheet">
    <div class="sheet-handle"></div>
    <h3 id="sheetTitle">編輯行程</h3>
    <div class="field">
      <label for="fldTime">時間</label>
      <input type="text" id="fldTime" placeholder="例如 09:20 或 → 10:13/10:28">
    </div>
    <div class="field">
      <label for="fldTitle">內容</label>
      <input type="text" id="fldTitle" placeholder="行程標題">
    </div>
    <div class="field">
      <label for="fldNote">備註</label>
      <textarea id="fldNote" placeholder="交通方式、注意事項…（選填）"></textarea>
    </div>
    <div class="sheet-actions">
      <button class="btn btn-danger" id="btnDelete" title="刪除" type="button">🗑</button>
      <button class="btn btn-ghost" id="btnCancel" type="button">取消</button>
      <button class="btn btn-primary" id="btnSave" type="button">儲存</button>
    </div>
  </div>
</div>

/* ---------------------------------------------------------------------
   旅程資訊：可編輯欄位，雙向同步
--------------------------------------------------------------------- */
function bindEditableField(elId, path) {
  const el = document.getElementById(elId);
  db.ref(path).on('value', (snap) => {
    if (document.activeElement === el) return; // 使用者正在打字時不要覆蓋
    const val = snap.val();
    el.textContent = val || '';
  });
  const save = () => db.ref(path).set(el.textContent.trim());
  el.addEventListener('blur', save);
  el.addEventListener('keydown', (e) => {
    if (e.key === 'Enter') { e.preventDefault(); el.blur(); }
  });
}
bindEditableField('infoDestination', 'tripInfo/destination');

});

/* ---------------------------------------------------------------------
   天數導覽 + 行程時間軸
--------------------------------------------------------------------- */
const dayNav = document.getElementById('dayNav');
const daysContainer = document.getElementById('daysContainer');
const DAY_IDS = ['day1','day2','day3','day4','day5','day6','day7','day8'];
let dayMeta = {}; // dayId -> {date,label}
let draggingNow = false;

// 建立每天的固定 DOM 骨架（導覽 chip + section + timeline 容器）一次即可
DAY_IDS.forEach((dayId, idx) => {
  const chip = document.createElement('button');
  chip.className = 'day-chip';
  chip.dataset.day = dayId;
  chip.innerHTML = `<div class="fno">No.${String(idx+1).padStart(2,'0')}</div><div class="fdate">…</div>`;
  chip.addEventListener('click', () => {
    document.getElementById('sec-' + dayId).scrollIntoView({ behavior:'smooth', block:'start' });
    setActiveChip(dayId);
  });
  dayNav.appendChild(chip);

  const section = document.createElement('section');
  section.className = 'day-section';
  section.id = 'sec-' + dayId;
  section.innerHTML = `
    <div class="day-head">
      <span class="fno">No.${String(idx+1).padStart(2,'0')}</span>
      <h2 class="dtitle">…</h2>
      <span class="dlabel">…</span>
    </div>
    <div class="timeline" id="tl-${dayId}"></div>
    <button class="add-item-btn" data-day="${dayId}" type="button">＋ 新增行程</button>
  `;
  daysContainer.appendChild(section);
});

function setActiveChip(dayId) {
  document.querySelectorAll('.day-chip').forEach(c => c.classList.toggle('active', c.dataset.day === dayId));
}

// 監聽每天的 date/label
DAY_IDS.forEach((dayId) => {
  db.ref(`days/${dayId}/date`).on('value', (snap) => {
    const v = snap.val() || '';
    dayMeta[dayId] = dayMeta[dayId] || {};
    dayMeta[dayId].date = v;
    const chip = dayNav.querySelector(`.day-chip[data-day="${dayId}"] .fdate`);
    if (chip) chip.textContent = v;
    const h2 = document.querySelector(`#sec-${dayId} .dtitle`);
    if (h2) h2.textContent = v;
  });
  db.ref(`days/${dayId}/label`).on('value', (snap) => {
    const v = snap.val() || '';
    const lab = document.querySelector(`#sec-${dayId} .dlabel`);
    if (lab) lab.textContent = v;
  });
});

// 監聽每天的 items，重繪該天時間軸
const sortableInstances = {};
DAY_IDS.forEach((dayId) => {
  db.ref(`days/${dayId}/items`).on('value', (snap) => {
    if (draggingNow) return; // 拖曳中先不重繪，避免打架
    renderTimeline(dayId, snap.val() || {});
  });
});

function renderTimeline(dayId, itemsObj) {
  const tl = document.getElementById('tl-' + dayId);
  if (!tl) return;
  const entries = Object.entries(itemsObj).sort((a,b) => (a[1].order||0) - (b[1].order||0));

  if (entries.length === 0) {
    tl.innerHTML = '<div class="empty-day">這天還沒有行程，點下方「新增行程」開始安排吧</div>';
    return;
  }

  tl.innerHTML = entries.map(([itemId, item]) => `
    <div class="item" data-id="${itemId}">
      <div class="grip" title="按住拖曳排序">⠿</div>
      <div class="body">
        <div class="time">${escapeHtml(item.time || '')}</div>
        <div class="title">${escapeHtml(item.title || '')}</div>
        ${item.note ? `<div class="note">${escapeHtml(item.note)}</div>` : ''}
      </div>
      <button class="edit-btn" data-day="${dayId}" data-id="${itemId}" title="編輯">✎</button>
    </div>
  `).join('');

  tl.querySelectorAll('.edit-btn').forEach(btn => {
    btn.addEventListener('click', () => openSheet(btn.dataset.day, btn.dataset.id));
  });

  // 初始化 / 重新綁定 SortableJS（按住拖曳排序）
  if (sortableInstances[dayId]) sortableInstances[dayId].destroy();
  sortableInstances[dayId] = new Sortable(tl, {
    handle: '.grip',
    animation: 150,
    delay: 120,
    delayOnTouchOnly: true,
    touchStartThreshold: 4,
    onStart: () => { draggingNow = true; },
    onEnd: (evt) => {
      draggingNow = false;
      const ids = Array.from(tl.querySelectorAll('.item')).map(el => el.dataset.id);
      const updates = {};
      ids.forEach((id, i) => { updates[`days/${dayId}/items/${id}/order`] = i + 1; });
      db.ref().update(updates);
    }
  });
}

function escapeHtml(str) {
  return String(str)
    .replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
}

/* ---------------------------------------------------------------------
   新增 / 編輯 / 刪除 行程項目（底部彈出面板）
--------------------------------------------------------------------- */
const sheetBackdrop = document.getElementById('sheetBackdrop');
const sheetTitle = document.getElementById('sheetTitle');
const fldTime = document.getElementById('fldTime');
const fldTitle = document.getElementById('fldTitle');
const fldNote = document.getElementById('fldNote');
const btnSave = document.getElementById('btnSave');
const btnCancel = document.getElementById('btnCancel');
const btnDelete = document.getElementById('btnDelete');

let sheetCtx = { dayId:null, itemId:null, mode:'edit' };

function openSheet(dayId, itemId) {
  sheetCtx = { dayId, itemId, mode:'edit' };
  sheetTitle.textContent = '編輯行程';
  btnDelete.style.display = 'inline-block';
  db.ref(`days/${dayId}/items/${itemId}`).once('value').then(snap => {
    const v = snap.val() || {};
    fldTime.value = v.time || '';
    fldTitle.value = v.title || '';
    fldNote.value = v.note || '';
    sheetBackdrop.classList.add('open');
    fldTitle.focus();
  });
}

function openSheetForNew(dayId) {
  sheetCtx = { dayId, itemId:null, mode:'add' };
  sheetTitle.textContent = '新增行程';
  btnDelete.style.display = 'none';
  fldTime.value = '';
  fldTitle.value = '';
  fldNote.value = '';
  sheetBackdrop.classList.add('open');
  fldTitle.focus();
}

function closeSheet() {
  sheetBackdrop.classList.remove('open');
}

document.querySelectorAll('.add-item-btn').forEach(btn => {
  btn.addEventListener('click', () => openSheetForNew(btn.dataset.day));
});

btnCancel.addEventListener('click', closeSheet);
sheetBackdrop.addEventListener('click', (e) => { if (e.target === sheetBackdrop) closeSheet(); });

btnSave.addEventListener('click', () => {
  const title = fldTitle.value.trim();
  if (!title) { fldTitle.focus(); return; }
  const data = { time: fldTime.value.trim(), title, note: fldNote.value.trim() };

  if (sheetCtx.mode === 'add') {
    db.ref(`days/${sheetCtx.dayId}/items`).once('value').then(snap => {
      const items = snap.val() || {};
      const maxOrder = Object.values(items).reduce((m,it) => Math.max(m, it.order||0), 0);
      const newRef = db.ref(`days/${sheetCtx.dayId}/items`).push();
      newRef.set({ ...data, order: maxOrder + 1 });
      closeSheet();
    });
  } else {
    db.ref(`days/${sheetCtx.dayId}/items/${sheetCtx.itemId}`).update(data);
    closeSheet();
  }
});

btnDelete.addEventListener('click', () => {
  if (sheetCtx.mode === 'edit' && sheetCtx.itemId) {
    db.ref(`days/${sheetCtx.dayId}/items/${sheetCtx.itemId}`).remove();
  }
  closeSheet();
});

/* ---------------------------------------------------------------------
   工具列：展開/收合
--------------------------------------------------------------------- */
function setupToggle(btnId, panelId, otherBtnId, otherPanelId) {
  const btn = document.getElementById(btnId);
  const panel = document.getElementById(panelId);
  btn.addEventListener('click', () => {
    const isOpen = panel.classList.contains('open');
    panel.classList.toggle('open', !isOpen);
    btn.setAttribute('aria-expanded', String(!isOpen));
    if (!isOpen) {
      document.getElementById(otherPanelId).classList.remove('open');
      document.getElementById(otherBtnId).setAttribute('aria-expanded', 'false');
    }
  });
}
setupToggle('toggleFx','fxPanel','toggleWx','wxPanel');
setupToggle('toggleWx','wxPanel','toggleFx','fxPanel');

/* ---------------------------------------------------------------------
   匯率換算（Open Exchange Rates 免金鑰公開端點）
--------------------------------------------------------------------- */
const CURRENCIES = [
  { code:'JPY', label:'日圓 JPY' },
  { code:'TWD', label:'新台幣 TWD' },
  { code:'USD', label:'美金 USD' },
  { code:'CNY', label:'人民幣 CNY' },
  { code:'KRW', label:'韓元 KRW' },
  { code:'HKD', label:'港幣 HKD' }
];
const fxFrom = document.getElementById('fxFrom');
const fxTo = document.getElementById('fxTo');
const fxAmount = document.getElementById('fxAmount');
const fxResult = document.getElementById('fxResult');
const fxUpdated = document.getElementById('fxUpdated');
const fxSwap = document.getElementById('fxSwap');

CURRENCIES.forEach(c => {
  fxFrom.appendChild(new Option(c.label, c.code));
  fxTo.appendChild(new Option(c.label, c.code));
});
fxFrom.value = 'JPY';
fxTo.value = 'TWD';

let fxRates = null; // relative to JPY (base)

async function loadFxRates() {
  try {
    const res = await fetch('https://open.er-api.com/v6/latest/JPY');
    const json = await res.json();
    if (json.result === 'success' && json.rates) {
      fxRates = json.rates; // 1 JPY = rates[code]
      const t = new Date(json.time_last_update_utc || Date.now());
      fxUpdated.textContent = '即時匯率（以 JPY 為基準）更新於 ' + t.toLocaleString('zh-TW');
      calcFx();
    } else {
      throw new Error('bad response');
    }
  } catch (e) {
    fxUpdated.textContent = '匯率讀取失敗，請檢查網路連線後重新整理';
  }
}

function calcFx() {
  if (!fxRates) return;
  const amount = parseFloat(fxAmount.value) || 0;
  const from = fxFrom.value;
  const to = fxTo.value;
  // rates are per 1 JPY. Convert amount(from) -> JPY -> to
  const fromRate = fxRates[from]; // 1 JPY = fromRate[from]
  const toRate = fxRates[to];
  if (!fromRate || !toRate) { fxResult.value = '—'; return; }
  const amountInJpy = amount / fromRate;
  const result = amountInJpy * toRate;
  fxResult.value = result.toLocaleString('zh-TW', { maximumFractionDigits: 2 });
}

fxAmount.addEventListener('input', calcFx);
fxFrom.addEventListener('change', calcFx);
fxTo.addEventListener('change', calcFx);
fxSwap.addEventListener('click', () => {
  const a = fxFrom.value; fxFrom.value = fxTo.value; fxTo.value = a;
  calcFx();
});
loadFxRates();

/* ---------------------------------------------------------------------
   天氣（Open-Meteo，免金鑰）－ 仙台市
--------------------------------------------------------------------- */
const SENDAI_LAT = 38.2682, SENDAI_LON = 140.8694;
const TRIP_START = '2026-09-19', TRIP_END = '2026-09-26';

const WMO_ICON = {
  0:'☀️',1:'🌤️',2:'⛅',3:'☁️',
  45:'🌫️',48:'🌫️',
  51:'🌦️',53:'🌦️',55:'🌦️',
  61:'🌧️',63:'🌧️',65:'🌧️',
  71:'🌨️',73:'🌨️',75:'🌨️',
  80:'🌦️',81:'🌧️',82:'⛈️',
  95:'⛈️',96:'⛈️',99:'⛈️'
};

async function loadWeather() {
  const grid = document.getElementById('weatherGrid');
  try {
    const url = `https://api.open-meteo.com/v1/forecast?latitude=${SENDAI_LAT}&longitude=${SENDAI_LON}&daily=weathercode,temperature_2m_max,temperature_2m_min&timezone=Asia%2FTokyo&start_date=${TRIP_START}&end_date=${TRIP_END}`;
    const res = await fetch(url);
    const json = await res.json();
    if (!json.daily || !json.daily.time) throw new Error('no data');
    const { time, weathercode, temperature_2m_max, temperature_2m_min } = json.daily;
    grid.innerHTML = time.map((d, i) => {
      const dt = new Date(d + 'T00:00:00');
      const md = `${dt.getMonth()+1}/${dt.getDate()}`;
      const icon = WMO_ICON[weathercode[i]] || '🌡️';
      return `<div class="weather-cell">
        <div class="wd">${md}</div>
        <div class="wicon">${icon}</div>
        <div class="wtemp">${Math.round(temperature_2m_max[i])}°<span class="lo">/${Math.round(temperature_2m_min[i])}°</span></div>
      </div>`;
    }).join('');
  } catch (e) {
    grid.innerHTML = '<div class="weather-cell" style="grid-column:1/-1">尚未進入 16 天預報範圍，出發前幾天再回來查看即時預報</div>';
  }
}
loadWeather();
