<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,viewport-fit=cover">
<title>仙台遊 9/19－9/26</title>
<meta name="theme-color" content="#f7faf9">
<link rel="manifest" href="manifest.webmanifest">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="仙台遊">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Shippori+Mincho:wght@500;600;700&family=Zen+Kaku+Gothic+New:wght@400;500;700&display=swap" rel="stylesheet">
<style>
:root{
  --sand:#f7faf9; --sand-2:#eaf2f0; --washi:#ffffff;
  --ink:#2e3937; --ink-2:#55625f; --ink-3:#95a3a0;
  --line:#dde7e4; --line-2:#e8efed;
  --sea-1:#5f9e97; --sea-2:#6da9a0; --sea-3:#7ab3a9; --sea-4:#88bdb1;
  --sea-5:#7ba9ad; --sea-6:#68a29e; --sea-7:#84b7ab; --sea-8:#9cb6a8;
  --accent:#4f9a92; --ok:#6fae9a;
  --r:12px; --sh:none;
  --mincho:'Shippori Mincho',"Yu Mincho","Songti TC","Noto Serif TC",serif;
  --gothic:'Zen Kaku Gothic New',"Hiragino Sans","PingFang TC","Noto Sans TC",system-ui,sans-serif;
  --daycolor:var(--sea-1);
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;padding:0}
body{
  background:var(--sand);font-family:var(--gothic);color:var(--ink);
  font-size:15px;line-height:1.6;-webkit-text-size-adjust:100%;
  background-image:none;
}
a{color:var(--sea-1)}
a:hover{color:var(--sea-2)}
.wrap{max-width:720px;margin:0 auto;padding:0 14px 120px}

/* ── Header ───────────────────────── */
.hero{position:relative;padding:19px 2px 12px;min-height:66px;margin:0;overflow:hidden;background:transparent}
.hero .seaside{display:none}
.hero h1,.hero h2,.hero .edited{position:relative;z-index:1}
.hero{--pad-b:78px}
.hero .edited{font-family:var(--mincho);position:absolute;top:23px;right:2px;font-size:11px;color:var(--ink-3);letter-spacing:.06em;z-index:1}
.hero h1{font-family:var(--mincho);font-weight:600;font-size:23px;line-height:1.3;margin:0;letter-spacing:.06em;color:var(--ink)}
.hero h2{font-family:var(--mincho);font-weight:600;font-size:13px;line-height:1.3;margin:2px 0 0 0;letter-spacing:.06em;color:var(--ink-3)}
.hero .sub{font-size:11px;color:var(--ink-3);margin:7px 0 0;letter-spacing:.2em}
.waves{display:block;width:100%;height:34px;margin-top:12px;opacity:.85}
.hero .live{position:absolute;right:2px;bottom:8px;margin:0;z-index:1;display:flex;align-items:center;gap:6px;
  font-size:10.5px;color:var(--ink-3);letter-spacing:.06em}
.dot{width:7px;height:7px;border-radius:50%;background:var(--ok);box-shadow:0 0 0 3px rgba(77,138,95,.18)}
.dot.off{background:#c0744f;box-shadow:0 0 0 3px rgba(192,116,79,.18)}

/* ── top tools ────────────────────── */
.tools{display:grid;grid-template-columns:1fr;gap:6px;margin:8px 0 4px;align-items:stretch}
.tools>.tool{min-width:0}
.tool{position:relative;background:var(--washi);border:1px solid var(--line);border-radius:var(--r);padding:7px 9px}
.tool .lbl{font-size:10px;letter-spacing:.16em;color:var(--ink-3);margin-bottom:3px}
.tool .big{font-family:var(--gothic);font-size:16px;font-weight:500;line-height:1.15;color:var(--ink);letter-spacing:.02em}
.tool .fine{font-size:10px;color:var(--ink-3);margin-top:2px;letter-spacing:.03em}
.tool .fine.tr{position:static;margin:0;text-align:right;min-width:0;flex:1;
  overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.thead{display:flex;align-items:baseline;justify-content:space-between;gap:6px;margin-bottom:3px}
.thead .lbl{margin:0;white-space:nowrap;min-width:0;overflow:hidden;text-overflow:ellipsis}
#wxDesc{min-width:0}
.fxrow input{padding:5px 8px;font-size:15px;border-radius:9px;font-weight:500;min-width:0;width:100%}
.wx-ico{font-size:18px;line-height:1}
.wxstrip{display:flex;gap:6px;overflow-x:auto;scrollbar-width:none;min-width:0;padding-bottom:2px;align-items:stretch}
.wxstrip::-webkit-scrollbar{display:none}
.wxd{flex:0 0 auto;min-width:52px;background:var(--washi);border:1px solid var(--line);
  border-radius:var(--r);padding:7px 6px;text-align:center;display:flex;flex-direction:column;justify-content:center;gap:1px}
.wxd.today{border-color:#9bc9c2;background:#f4faf8}
.wxd .d{font-size:10px;color:var(--ink-3);letter-spacing:.06em}
.wxd .i{font-size:16px;line-height:1.3}
.wxd .t{font-size:11px;color:var(--ink-2);letter-spacing:.02em}
.wxd .p{font-size:9.5px;color:var(--ink-3);letter-spacing:.08em}
.fxrow{display:flex;align-items:center;gap:6px;margin-top:4px}
.fxrow input{width:100%;min-width:0;font:600 16px/1.2 var(--gothic);color:var(--ink);
  border:1px solid var(--line);border-radius:9px;padding:7px 8px;background:#fff}
.fxrow span{font-size:12px;color:var(--ink-3);white-space:nowrap}

/* ── sticky tabs ──────────────────── */
.tabbar{position:sticky;top:0;z-index:40;margin:12px -14px 0;padding:8px 14px;
  background:rgba(247,250,249,.95);backdrop-filter:blur(10px);border-bottom:1px solid var(--line)}
.tabs{display:flex;gap:7px;overflow-x:auto;scrollbar-width:none;padding-bottom:2px}
.tabs::-webkit-scrollbar{display:none}
.tab{flex:0 0 auto;position:relative;text-decoration:none;background:#fff;border:1px solid var(--line);
  border-radius:10px;padding:6px 11px;min-width:58px;text-align:center;color:var(--ink-2);
  font-size:10.5px;letter-spacing:.08em;cursor:pointer;transition:.18s}
.tab b{display:block;font-family:var(--gothic);font-size:14px;font-weight:500;color:var(--ink);letter-spacing:.02em}
.tab.on{background:var(--tc,var(--sea-1));border-color:var(--tc,var(--sea-1));color:rgba(255,255,255,.82)}
.tab.on b{color:#fff}
.tab .today-dot{position:absolute;top:5px;right:6px;width:6px;height:6px;border-radius:50%;background:var(--accent)}

/* ── day ──────────────────────────── */
.day{scroll-margin-top:74px;padding-top:26px}
.dayhead{display:flex;align-items:center;gap:10px}
.daynum{font-family:var(--gothic);font-size:13px;line-height:1.2;font-weight:500;color:var(--sea-1);
  letter-spacing:.14em;padding-top:4px}
.dayhead .t{flex:1;min-width:0}
.dayhead h2{font-family:var(--mincho);font-size:18px;font-weight:600;margin:0;letter-spacing:.05em;
  display:flex;align-items:center;gap:6px;flex-wrap:wrap}
.dayedit{border:none;background:none;padding:2px;color:#bcb1a2;cursor:pointer;display:inline-grid;place-items:center}
.dayedit svg{width:14px;height:14px}
.dayhead .m{font-size:11.5px;color:var(--ink-3);letter-spacing:.06em;margin-top:2px}
.dayweather{margin-left:auto;display:flex;align-items:center;gap:5px;white-space:nowrap;color:var(--ink-2);font-size:12px;letter-spacing:.02em;padding-top:3px}
.dayweather .wi{font-size:17px;line-height:1}.dayweather .wt{font-weight:500}.dayweather .temp{font-size:11px;color:var(--ink-3)}
.badge-today{display:inline-block;background:var(--accent);color:#fff;font-size:10px;
  border-radius:20px;padding:2px 8px;margin-left:8px;letter-spacing:.14em;animation:pulse 2.2s infinite}
@keyframes pulse{0%,100%{opacity:1}50%{opacity:.55}}
.daybar{height:1px;border-radius:0;margin:12px 0 2px;
  background:linear-gradient(90deg,var(--daycolor) 0%,var(--line) 55%,var(--line) 100%)}

/* ── timeline ─────────────────────── */
.tl{position:relative;padding:14px 0 0 40px}
.stop:after{content:"";position:absolute;left:-26px;top:35px;bottom:2px;width:2px;
  border-radius:2px;pointer-events:none;
  background:linear-gradient(to bottom,var(--daycolor) 0,color-mix(in oklch,var(--daycolor) 45%,transparent) 55%,transparent 100%);
  opacity:.75}
.stop{position:relative;margin-bottom:14px}
.stop .when{position:absolute;left:-40px;top:0;width:46px;text-align:left;
  font-family:var(--gothic);font-size:14.5px;font-weight:500;color:var(--ink-2);letter-spacing:.04em}
.stop .when.empty{color:#c9c8c2;font-size:12px}
.stop .node{position:absolute;left:-29px;top:24px;width:9px;height:9px;border-radius:50%;
  background:var(--daycolor);border:none;z-index:2}
.card{background:var(--washi);border:1px solid var(--line);border-radius:var(--r);
  padding:12px 13px 9px;position:relative;transition:border-color .18s,transform .18s}
.stop.now .card{border-color:var(--ink-2);background:#fafaf7}
.stop.drag .card{transform:scale(1.02);box-shadow:0 14px 30px rgba(36,50,60,.18)}
.stop.ghost{opacity:.35}
.chips{display:flex;flex-wrap:wrap;gap:6px;align-items:center;margin-bottom:0}
.cat{font-size:10.5px;letter-spacing:.12em;color:#3d6f68;background:#e8f3f0;
  border-radius:20px;padding:3px 9px;font-weight:500}
.chip-now{font-size:10.5px;letter-spacing:.12em;color:var(--accent);border:1px solid var(--accent);
  border-radius:20px;padding:2px 8px}
.card h4{font-family:var(--mincho);font-size:16.5px;font-weight:600;margin:0;line-height:1.4;letter-spacing:.03em;word-break:break-word}
.card .sub{font-size:13.5px;color:var(--ink-3);margin-top:3px}
.move{display:inline-flex;align-items:center;gap:4px;font-size:10.5px;letter-spacing:.08em;
  color:#3d6f68;background:#eef5f3;border:1px solid #dfece9;border-radius:20px;padding:2px 9px}
.hours{display:inline-flex;align-items:center;gap:4px;font-size:10.5px;letter-spacing:.08em;
  color:#7a6340;background:#f7f1e6;border:1px solid #ece0cb;border-radius:20px;padding:2px 9px}
.pastebox{border:1px dashed var(--line);border-radius:10px;padding:10px;text-align:center;
  font-size:12px;color:var(--ink-3);background:var(--sand);margin-top:8px}
.acts{display:flex;flex-wrap:wrap;gap:7px;margin-top:11px;padding-top:9px;border-top:1px dashed var(--line-2)}
.btn{display:inline-flex;align-items:center;gap:5px;min-height:36px;padding:0 12px;
  border:1px solid var(--line);border-radius:10px;background:#fff;color:var(--ink-2);
  font:500 12.5px var(--gothic);letter-spacing:.04em;cursor:pointer;text-decoration:none;transition:.15s}
.btn:active{transform:translateY(1px)}
.btn.nav{border-color:#bfdcd6;color:#3d6f68;background:#f4faf8}
.btn.edit{border-color:var(--line);color:var(--ink)}
.btn.ghost{color:var(--ink-3)}
.btn svg{width:15px;height:15px;flex:0 0 auto}
.btn.sm{min-height:32px;font-size:12px;padding:0 10px}
.grip{position:absolute;top:50%;transform:translateY(-50%);left:-24px;width:22px;height:32px;display:grid;place-items:center;
  color:#bcb1a2;background:none;border:none;padding:0;cursor:grab;touch-action:none;z-index:3}
.desc a,.note .txt a{color:#3d6f68;word-break:break-all}
.desc{font-size:13.2px;line-height:1.35;letter-spacing:.05em;color:var(--ink-2);margin-top:6px;
  white-space:pre-wrap;word-break:break-word}
.descimgs{display:flex;flex-wrap:wrap;gap:7px;margin-top:8px}
.descimgs .ph{position:relative}
.descimgs img{width:104px;height:104px;object-fit:cover;border-radius:10px;border:1px solid var(--line-2);display:block;cursor:zoom-in}
.descimgs .rm{position:absolute;top:-6px;right:-6px;width:22px;height:22px;border-radius:50%;
  border:none;background:#24323c;color:#fff;font-size:13px;line-height:1;cursor:pointer}
.cardtop{display:flex;align-items:flex-start;gap:8px;flex-wrap:wrap;margin-bottom:6px}
.ctools{display:flex;gap:6px;flex-wrap:wrap;margin-top:10px}
.slist{margin-top:9px;display:flex;flex-direction:column;gap:5px}
.slist-t{font-family:var(--gothic);font-size:12px;font-weight:500;color:var(--ink-3);letter-spacing:.14em;margin-bottom:2px}
.slist a,.slist span.n{display:flex;align-items:center;gap:6px;font-size:13px;color:#3d6f68;
  text-decoration:none;padding:5px 8px;background:#f4faf8;border:1px solid #dfece9;
  border-radius:9px;min-height:34px}
.slist span.n{color:var(--ink-2)}
.slist svg{width:14px;height:14px;flex:0 0 auto}
.lrow{display:grid;grid-template-columns:24px 1fr 1fr auto;gap:7px;margin-bottom:7px;align-items:center}
.lrow .lgrip{display:grid;place-items:center;height:36px;color:#bcb1a2;background:none;border:none;
  padding:0;cursor:grab;touch-action:none}
.lrow .lgrip svg{width:16px;height:16px}
.lrow.ldrag{opacity:.9;transform:scale(1.01)}
.lrow.lover{outline:2px dashed var(--line);outline-offset:3px;border-radius:10px}
.lrow input{border:1px solid var(--line);border-radius:9px;padding:9px;font:400 14px var(--gothic);min-width:0}
.lrow button{border:none;background:none;color:#b03c28;font-size:17px;cursor:pointer;padding:0 4px}

/* ── note ─────────────────────────── */
.note{margin-top:8px;border-top:1px solid var(--line-2);padding-top:7px}
.note>summary{list-style:none;cursor:pointer;display:flex;align-items:center;gap:6px;
  font-size:12.5px;color:var(--ink-2);letter-spacing:.08em;padding:3px 0}
.note>summary::-webkit-details-marker{display:none}
.note>summary .car{transition:transform .2s;font-size:10px;color:var(--ink-3)}
.note[open]>summary .car{transform:rotate(90deg)}
.note .body{padding:6px 0 4px}
.note textarea{width:100%;min-height:66px;border:1px solid var(--line);border-radius:10px;
  padding:9px;font:400 14px/1.75 var(--gothic);color:var(--ink);background:#fff;resize:vertical}
.note .txt{font-size:14px;line-height:1.75;white-space:pre-wrap;color:var(--ink-2);
  background:#f6faf9;border-left:2px solid #bfdcd6;border-radius:0 10px 10px 0;padding:8px 10px;word-break:break-word}
.imgs{display:flex;flex-wrap:wrap;gap:7px;margin-top:8px}
.imgs .ph{position:relative}
.imgs img{width:88px;height:88px;object-fit:cover;border-radius:9px;border:1px solid var(--line-2);display:block;cursor:zoom-in}
.imgs .rm{position:absolute;top:-6px;right:-6px;width:22px;height:22px;border-radius:50%;
  border:none;background:#24323c;color:#fff;font-size:13px;line-height:1;cursor:pointer}
.noteacts{display:flex;gap:7px;margin-top:8px;flex-wrap:wrap}

.addstop{width:100%;margin-top:4px;min-height:44px;border:1px dashed var(--line);
  border-radius:var(--r);background:#fcfbf9;color:var(--ink-2);
  font:500 13px var(--gothic);cursor:pointer}

/* ── modal ────────────────────────── */
.mask{position:fixed;inset:0;background:rgba(30,40,48,.42);z-index:90;display:none;
  align-items:flex-end;justify-content:center;backdrop-filter:blur(2px)}
.mask.on{display:flex}
.sheet{width:100%;max-width:520px;background:var(--washi);border-radius:18px 18px 0 0;
  padding:16px 16px calc(18px + env(safe-area-inset-bottom));max-height:88vh;overflow:auto;
  box-shadow:0 -10px 40px rgba(0,0,0,.2);animation:up .22s ease}
@keyframes up{from{transform:translateY(24px);opacity:.6}to{transform:none;opacity:1}}
.sheet h3{font-family:var(--mincho);font-size:17px;margin:0 0 12px;font-weight:600;letter-spacing:.05em}
.f{margin-bottom:11px}
.f label{display:block;font-size:11px;letter-spacing:.12em;color:var(--ink-3);margin-bottom:4px}
.f input,.f select,.f textarea{width:100%;border:1px solid var(--line);border-radius:9px;
  padding:10px;font:400 16px var(--gothic);color:var(--ink);background:#fff}
.f textarea{min-height:80px;line-height:1.6;resize:vertical}
.f2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.sheetacts{display:flex;gap:8px;margin-top:14px}
.sheetacts .btn{flex:1;justify-content:center;min-height:44px}
.btn.primary{background:var(--sea-1);border-color:var(--sea-1);color:#fff}
.btn.danger{border-color:var(--line);color:#a8534a}

/* ── checklist / fx card ──────────── */
.block{margin-top:34px;background:var(--washi);border:1px solid var(--line);
  border-radius:var(--r);padding:15px}
.block h3{font-family:var(--mincho);font-size:16px;margin:0 0 4px;font-weight:600;letter-spacing:.05em}
.block .hint{font-size:11.5px;color:var(--ink-3);margin-bottom:10px}
.check{display:flex;align-items:flex-start;gap:9px;padding:7px 0;border-bottom:1px dashed var(--line-2)}
.check input{width:18px;height:18px;margin:3px 0 0;accent-color:var(--sea-1);flex:0 0 auto}
.check span{flex:1;font-size:14px;word-break:break-word}
.check input:checked+span{color:var(--ink-3);text-decoration:line-through}
.check .rm{border:none;background:none;color:#c4b9aa;font-size:16px;cursor:pointer;padding:0 2px}
.addrow{display:flex;gap:7px;margin-top:10px}
.addrow input{flex:1;min-width:0;border:1px solid var(--line);border-radius:9px;padding:9px;font:400 14px var(--gothic)}
.fxbig{font-family:var(--gothic);font-size:22px;font-weight:500;color:var(--sea-1);margin-top:6px;letter-spacing:.02em}

/* ── utility notebook ─────────────── */
.utility{scroll-margin-top:74px;margin:20px 0 28px}.utility-grid{display:grid;grid-template-columns:1fr;gap:10px}
.utility-card{background:var(--washi);border:1px solid var(--line);border-radius:var(--r);padding:13px}
.utility-card h3{font-family:var(--mincho);font-size:16px;margin:0;color:var(--ink);font-weight:600;letter-spacing:.05em}
.utility-card .hint{font-size:11px;color:var(--ink-3);margin:2px 0 9px}.utility-list{display:flex;flex-direction:column;gap:7px}
.utility-item{border-top:1px dashed var(--line-2);padding:8px 0 0}.utility-item:first-child{border-top:0;padding-top:0}
.utility-item-top{display:flex;align-items:flex-start;gap:7px}.utility-item-title{font-size:14px;font-weight:500;flex:1;word-break:break-word}
.utility-item-text{font-size:12.5px;color:var(--ink-2);white-space:pre-wrap;word-break:break-word;margin-top:3px}
.utility-item .imgs img{width:70px;height:70px}.utility-empty{font-size:12px;color:var(--ink-3);padding:4px 0 8px}
.utility-menu{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:9px}.utility-menu .btn{min-height:48px;justify-content:center;text-align:center;font-size:13px}
.utility-menu .btn:last-child:nth-child(odd){grid-column:1/-1}.utility-back{margin-bottom:10px}.utility-done{width:19px;height:19px;accent-color:var(--sea-1);margin:3px 1px 0 0;flex:0 0 auto}
.utility-menu .btn.on{background:var(--sea-1);border-color:var(--sea-1);color:#fff}
.utility-item.done .utility-item-title,.utility-item.done .utility-item-text{color:var(--ink-3);text-decoration:line-through}

/* ── split bill ───────────────────── */
.fxsw{display:flex;gap:4px;flex:0 0 auto}
.fxb{font:500 10.5px/1 var(--gothic);letter-spacing:.06em;color:var(--ink-2);background:#fff;
  border:1px solid var(--line);border-radius:20px;padding:5px 8px;cursor:pointer}
.fxb.on{background:var(--sea-1);border-color:var(--sea-1);color:#fff}
.seg{display:grid;grid-auto-flow:column;grid-auto-columns:1fr;border:1px solid var(--line);
  border-radius:11px;overflow:hidden;background:#fff}
.segb{font:500 13px/1 var(--gothic);color:var(--ink-2);background:#fff;border:0;border-left:1px solid var(--line-2);
  padding:11px 4px;cursor:pointer;letter-spacing:.04em}
.segb:first-child{border-left:0}
.segb.on{background:var(--sea-1);color:#fff}
.seg.sm{flex:0 0 auto;grid-auto-columns:42px;border-radius:9px}
.seg.sm .segb{padding:9px 0}
.splitform{display:flex;flex-direction:column;gap:9px}
.splitform select,.splitform input[type=text],.splitform textarea{width:100%;font:500 14px/1.2 var(--gothic);color:var(--ink);
  border:1px solid var(--line);border-radius:10px;padding:10px 9px;background:#fff}
.splitform .fxrow{margin:0}
.catchip{font:500 12px/1 var(--gothic);letter-spacing:.06em;color:var(--ink-2);background:#fff;
  border:1px solid var(--line);border-radius:20px;padding:8px 12px;cursor:pointer}
.catchip.on{background:#e8f3f0;border-color:#9bc9c2;color:#2f6a62}
.splitwho{display:flex;flex-direction:column;gap:6px}
.wholbl{font-size:11px;letter-spacing:.1em;color:var(--ink-3)}
.whochip{font:500 12px/1 var(--gothic);letter-spacing:.06em;color:var(--ink-3);background:#fff;
  border:1px dashed var(--line);border-radius:20px;padding:8px 11px;cursor:pointer}
.whochip.on{background:var(--sea-1);border-style:solid;border-color:var(--sea-1);color:#fff}

function todayISO(){
  const d = new Date(); const p = n => String(n).padStart(2,'0');
  return `${d.getFullYear()}-${p(d.getMonth()+1)}-${p(d.getDate())}`;
}
function markNow(){
  const ti = todayISO();
  const day = DAYS.find(d => d.iso === ti);
  if (!day) return;
  const sec = document.getElementById(day.id);
  if (!sec) return;
  const now = new Date().getHours() * 60 + new Date().getMinutes();
  const stops = [...sec.querySelectorAll('.stop')];
  let cur = null;
  stops.forEach(s => {
    const m = (s.querySelector('.when').textContent || '').match(/(\d{1,2}):(\d{2})/);
    if (!m) return;
    const mins = +m[1] * 60 + +m[2];
    if (mins <= now) cur = s;
  });
  if (cur){
    cur.classList.add('now');
    cur.querySelector('.chips').insertAdjacentHTML('beforeend','<span class="chip-now">現在</span>');
  }
}

function normalizeWebURL(value){

function isGoogleMapURL(value){

    return host === 'maps.app.goo.gl' || host === 'goo.gl' && path.startsWith('/maps') || host.startsWith('maps.google.') || /^(.+\.)?google\.[a-z.]+$/.test(host) && path.startsWith('/maps');

}

function uploadToolImage(group,id,f){
  if (!f) return; toast('處理圖片中…'); const img = new Image(), fr = new FileReader();

  fr.readAsDataURL(f);
}

function wireRowDrag(box){
  let cur = null;
  const yOf = e => e.touches ? e.touches[0].clientY : e.clientY;
  const xOf = e => e.touches ? e.touches[0].clientX : e.clientX;
  const down = e => {
    const g = e.target.closest('[data-lgrip]'); if (!g) return;
    e.preventDefault();
    cur = g.closest('.lrow'); cur.classList.add('ldrag');
    if (navigator.vibrate) navigator.vibrate(10);
  };
  const move = e => {
    if (!cur) return;
    e.preventDefault();
    const el = document.elementFromPoint(xOf(e), yOf(e));
    const over = el && el.closest('.lrow');
    box.querySelectorAll('.lover').forEach(n => n.classList.remove('lover'));
    if (over && over !== cur && over.parentNode === box){
      over.classList.add('lover');
      const r = over.getBoundingClientRect();
      box.insertBefore(cur, yOf(e) > r.top + r.height / 2 ? over.nextSibling : over);
    }
  };
  const up = () => {
    if (!cur) return;
    cur.classList.remove('ldrag'); cur = null;
    box.querySelectorAll('.lover').forEach(n => n.classList.remove('lover'));
  };
  box.addEventListener('touchstart', down, {passive:false});
  box.addEventListener('mousedown', down);
  box.addEventListener('touchmove', move, {passive:false});
  document.addEventListener('mousemove', move);
  box.addEventListener('touchend', up);
  document.addEventListener('mouseup', up);
}

function uploadImage(day,id,f,field){
  if (!f) return;
  const target = field || 'images';
  toast('處理圖片中…');
  const img = new Image(), fr = new FileReader();
  fr.onload = () => { img.src = fr.result; };
  img.onload = () => {
    const max = 900, sc = Math.min(1, max / Math.max(img.width, img.height));
    const c = document.createElement('canvas');
    c.width = Math.round(img.width * sc); c.height = Math.round(img.height * sc);
    c.getContext('2d').drawImage(img, 0, 0, c.width, c.height);
    const data = c.toDataURL('image/jpeg', .62);
    if (data.length > 900000) { toast('圖片太大，請選小一點的'); return; }
    pushUndo('新增圖片');
    itemRef(day,id).child(target).push(data).then(() => { stamp(); toast('圖片已加入'); });
  };
  fr.readAsDataURL(f);
}

/* ═══ 5. 長按拖曳排序 ═══════════════════════════════════════ */
let drag = null;
function onDown(e){
  const onGrip = !!e.target.closest('[data-drag]');
  if (!onGrip) return;
  const stop = e.target.closest('.stop'); if (!stop) return;
  const sy = e.touches ? e.touches[0].clientY : e.clientY;
  const start = () => {
    drag = { stop, day:stop.dataset.day, startY:sy, list:[...stop.parentNode.querySelectorAll('.stop')] };
    stop.classList.add('drag');
    if (navigator.vibrate) navigator.vibrate(12);
    document.body.style.overflow = 'hidden';
  };
  start();
}
function onMove(e){
  const stop = e.target.closest('.stop');
  if (!drag) return;
  e.preventDefault();
  const y = e.touches ? e.touches[0].clientY : e.clientY;
  const el = document.elementFromPoint(e.touches ? e.touches[0].clientX : e.clientX, y);
  const over = el && el.closest('.stop');
  if (over && over !== drag.stop && over.dataset.day === drag.day){
    const r = over.getBoundingClientRect();
    const after = y > r.top + r.height / 2;
    over.parentNode.insertBefore(drag.stop, after ? over.nextSibling : over);
  }
}
function onUp(){
  document.querySelectorAll('.stop').forEach(s => s._cancel && s._cancel());
  if (!drag) return;
  const d = drag; drag = null;
  d.stop.classList.remove('drag');
  document.body.style.overflow = '';
  const order = {};
  [...d.stop.parentNode.querySelectorAll('.stop')].forEach((s,i) => { order[s.dataset.id] = (i+1) * 10; });
  pushUndo('調整順序');
  const up = {};
  Object.keys(order).forEach(k => { up['days/' + d.day + '/items/' + k + '/order'] = order[k]; });
  up['updatedAt'] = Date.now();
  ROOT.update(up).then(() => toast('順序已更新'));
}
document.addEventListener('touchstart', onDown, {passive:true});
document.addEventListener('mousedown', onDown);
document.addEventListener('touchmove', onMove, {passive:false});
document.addEventListener('mousemove', onMove);
document.addEventListener('touchend', onUp);
document.addEventListener('touchcancel', onUp);
document.addEventListener('mouseup', onUp);

      const id = en.target.id;
      $$('.tab').forEach(t => {

        t.classList.toggle('on', on);
        if (on) t.scrollIntoViewIfNeeded ? t.scrollIntoViewIfNeeded() :

/* ═══ 8. 天氣（Open-Meteo 免金鑰） ══════════════════════════ */
const WX = {0:['☀️','晴'],1:['🌤','晴時多雲'],2:['⛅','多雲'],3:['☁️','陰'],45:['🌫','霧'],48:['🌫','霧'],
51:['🌦','毛毛雨'],53:['🌦','小雨'],55:['🌧','雨'],61:['🌧','小雨'],63:['🌧','雨'],65:['🌧','大雨'],
71:['🌨','小雪'],73:['🌨','雪'],75:['❄️','大雪'],80:['🌦','陣雨'],81:['🌧','陣雨'],82:['⛈','強陣雨'],
95:['⛈','雷雨'],96:['⛈','雷雨'],99:['⛈','雷雨']};
const wxCache = {};
async function setWeather(day){
  if (wxCache[day.id]) return;
  try {
    const u = `https://api.open-meteo.com/v1/forecast?latitude=${day.lat}&longitude=${day.lon}`
      + `&daily=weather_code,temperature_2m_max,temperature_2m_min&current=temperature_2m,weather_code`
      + `&timezone=Asia%2FTokyo&start_date=${day.iso}&end_date=${day.iso}`;
    const d = await (await fetch(u)).json();
    const isToday = todayISO() === day.iso;
    const code = isToday && d.current ? d.current.weather_code : (d.daily && d.daily.weather_code ? d.daily.weather_code[0] : null);
    const hi = d.daily && d.daily.temperature_2m_max ? d.daily.temperature_2m_max[0] : null;
    const lo = d.daily && d.daily.temperature_2m_min ? d.daily.temperature_2m_min[0] : null;
    const cur = isToday && d.current ? d.current.temperature_2m : null;
    wxCache[day.id] = { code, hi, lo, cur, date:day.date };
    paintDayWeather();
  } catch(_){}
}
function dayWeatherHTML(day){
  const w = wxCache[day.id];
  if (!w) return '<span class="temp">天氣讀取中…</span>';
  const m = WX[w.code] || ['🌡','天氣'];
  const t = w.hi != null && w.lo != null ? `${Math.round(w.lo)}–${Math.round(w.hi)}°` : '--';
  return `<span class="wi">${m[0]}</span><span class="wt">${m[1]}</span><span class="temp">${t}</span>`;
}
function paintWxStrip(){
  const el = $('#wxStrip'); if (!el) return;
  const ti = todayISO();
  el.innerHTML = DAYS.map(d => {
    const w = wxCache[d.id], m = w ? (WX[w.code] || ['🌡','']) : null;
    const t = w && w.hi != null && w.lo != null ? Math.round(w.lo) + '–' + Math.round(w.hi) + '°' : '--';
    return '<div class="wxd' + (d.iso === ti ? ' today' : '') + '"><div class="d">' + d.date + '</div>'
      + '<div class="i">' + (m ? m[0] : '…') + '</div><div class="t">' + t + '</div>'
      + '<div class="p">' + esc(d.place) + '</div></div>';
  }).join('');
}
function paintDayWeather(){
  paintWxStrip();
  DAYS.forEach(d => { const el = document.querySelector('[data-weather="' + d.id + '"]'); if (el) el.innerHTML = dayWeatherHTML(d); });
}
async function fetchAllWeather(){
  const spots = {};
  DAYS.forEach(d => { const k = d.lat + ',' + d.lon; (spots[k] = spots[k] || { lat:d.lat, lon:d.lon, days:[] }).days.push(d); });
  const first = DAYS[0].iso, last = DAYS[DAYS.length-1].iso;
  await Promise.all(Object.values(spots).map(async sp => {
    try {
      const u = `https://api.open-meteo.com/v1/forecast?latitude=${sp.lat}&longitude=${sp.lon}`
        + `&daily=weather_code,temperature_2m_max,temperature_2m_min&current=temperature_2m,weather_code`
        + `&timezone=Asia%2FTokyo&start_date=${first}&end_date=${last}`;
      const d = await (await fetch(u)).json();
      const idx = {}; (d.daily && d.daily.time || []).forEach((t,i) => idx[t] = i);
      sp.days.forEach(day => {
        const i = idx[day.iso];
        if (i == null) return;
        const isToday = todayISO() === day.iso;
        wxCache[day.id] = {
          code: isToday && d.current ? d.current.weather_code : d.daily.weather_code[i],
          hi: d.daily.temperature_2m_max[i], lo: d.daily.temperature_2m_min[i],
          cur: isToday && d.current ? d.current.temperature_2m : null, date: day.date
        };
      });
    } catch(_){}
  }));
  paintDayWeather();

}
fetchAllWeather();
setWeather(DAYS[0]);
setTimeout(jumpToToday, 900);

/* ═══ 8.5 調整行程（複製／刪除） ═══════════════════════════ */
var mgSel = {};
function mgKeys(){ return Object.keys(mgSel).filter(k => mgSel[k]); }
function renderManage(){
  if (!$('#mgList')) return;
  if (!$('#mgTarget').children.length)
    $('#mgTarget').innerHTML = DAYS.map(d => '<option value="' + d.id + '">移動到 ' + d.date + '（' + d.dow + '）</option>').join('');
  $('#mgCount').textContent = '已選 ' + mgKeys().length + ' 筆';
  $('#mgList').innerHTML = DAYS.map(d => {
    const items = itemsOf(d.id);
    const allOn = items.length && items.every(it => mgSel[d.id + '/' + it._id]);
    return '<article class="utility-card"><div class="mghead"><h3>' + esc(dayHeading(d)) + '</h3>'
      + (items.length ? '<button class="mgsel" data-mgall="' + d.id + '">' + (allOn ? '取消全選' : '全選') + '</button>' : '') + '</div>'
      + (items.length ? items.map(it => {
          const k = d.id + '/' + it._id;
          return '<div class="mgrow"><button class="mgbox' + (mgSel[k] ? ' on' : '') + '" data-mgk="' + k + '">'
            + (mgSel[k] ? '✓' : '') + '</button><span class="tx"><span class="t1">'
            + (it.time ? esc(it.time) + '　' : '') + esc(it.title || '(未命名)') + '</span>'
            + '<span class="t2">' + esc(catOf(it.cat)) + (it.hours ? ' ・ ' + esc(it.hours) : '') + '</span></span></div>';
        }).join('') : '<div class="utility-empty">這天還沒有行程</div>') + '</article>';
  }).join('');
}
document.addEventListener('click', e => {
  const b = e.target.closest('[data-mgk]');
  if (b){ const k = b.dataset.mgk; mgSel[k] = !mgSel[k]; renderManage(); return; }
  const a = e.target.closest('[data-mgall]');
  if (a){
    const day = a.dataset.mgall, items = itemsOf(day);
    const allOn = items.every(it => mgSel[day + '/' + it._id]);
    items.forEach(it => { mgSel[day + '/' + it._id] = !allOn; });
    renderManage(); return;
  }
});
function mgSelectedItems(){
  return mgKeys().map(k => {
    const p = k.split('/');
    const it = findItem(p[0], p[1]);
    return it ? { day:p[0], id:p[1], it } : null;
  }).filter(Boolean);
}
function mgInit(){
  if (!$('#mgCopy')) return;
  $('#mgClear').onclick = () => { mgSel = {}; renderManage(); };
  $('#mgCopy').onclick = () => {
    const sel = mgSelectedItems();
    if (!sel.length) { toast('請先勾選行程'); return; }
    const target = $('#mgTarget').value;
    if (!ROOT) { toast('目前無法連線資料庫'); return; }
    const moving = sel.filter(s => s.day !== target);
    if (!moving.length) { toast('已選行程都在該天了'); return; }
    pushUndo('移動行程');
    let order = (itemsOf(target).slice(-1)[0] || {}).order || 0;
    const ups = {};
    moving.forEach(s => {
      order += 10;
      const copy = JSON.parse(JSON.stringify(s.it));
      delete copy._id;
      copy.order = order;
      ups[ROOT.child('days/' + target + '/items').push().key] = copy;
    });
    ROOT.child('days/' + target + '/items').update(ups)
      .then(() => Promise.all(moving.map(s => ROOT.child('days/' + s.day + '/items/' + s.id).remove())))
      .then(() => {
        stamp(); mgSel = {}; renderManage();
        const d = DAYS.find(x => x.id === target);
        toast('已移動 ' + moving.length + ' 筆到 ' + (d ? d.date : target));
      });
  };
  $('#mgDel').onclick = () => {
    const sel = mgSelectedItems();
    if (!sel.length) { toast('請先勾選行程'); return; }
    if (!confirm('確定刪除已選的 ' + sel.length + ' 筆行程？')) return;
    pushUndo('刪除行程');
    Promise.all(sel.map(s => ROOT.child('days/' + s.day + '/items/' + s.id).remove()))
      .then(() => { stamp(); mgSel = {}; renderManage(); toast('已刪除 ' + sel.length + ' 筆'); });
  };
}
mgInit();

/* ═══ 9. 分帳 ═════════════════════════════════════════════ */
var MEMBERS = ['米居','拎拎','家伃','老吳','弟弟'];
var SP_CATS = ['吃飯','伴手禮','交通','門票','住宿','代購','其他'];
var SP_ICON = {吃飯:'🍳', 伴手禮:'🎁', 交通:'🚄', 門票:'🎟️', 住宿:'🏨', 代購:'🛍️', 其他:'🧾'};
var spPayer = MEMBERS[0], spCur = 'JPY', spCat = SP_CATS[0], spWho = MEMBERS.slice(), spFilter = 'all', spCatFilter = 'all';

function spBuildForm(){
  $('#spPayer').innerHTML = MEMBERS.map(m =>
    '<button class="segb' + (m === spPayer ? ' on' : '') + '" data-payer="' + m + '">' + m + '</button>').join('');
  $('#spCat').innerHTML = SP_CATS.map(c =>
    '<button class="catchip' + (c === spCat ? ' on' : '') + '" data-cat="' + c + '">' + c + '</button>').join('');
  $('#spWho').innerHTML = MEMBERS.map(m =>
    '<button class="whochip' + (spWho.indexOf(m) > -1 ? ' on' : '') + '" data-who="' + m + '">' + m + '</button>').join('');
  const ti = todayISO();
  $('#spDate').innerHTML = DAYS.map(d =>
    '<option value="' + d.iso + '"' + (d.iso === ti ? ' selected' : '') + '>'
    + d.date + '（' + d.dow + '）' + (d.iso === ti ? ' ・今天' : '') + '</option>').join('');
}
function spTwd(e){ return e.cur === 'TWD' ? (+e.amt || 0) : (+e.amt || 0) * RATE; }
function spWhoOf(e){ return (e.who && e.who.length) ? e.who : MEMBERS; }
function spPer(e){ return spTwd(e) / spWhoOf(e).length; }
function spPerJpy(e){
  const jpy = e.cur === 'JPY' ? (+e.amt || 0) : (+e.amt || 0) / (RATE || 1);
  return jpy / spWhoOf(e).length;
}
function jp(v){ return '¥ ' + Math.round(v).toLocaleString('zh-TW'); }
function jpOf(twd){ return jp(twd / (RATE || 1)); }
function spDebtors(e){ return spWhoOf(e).filter(m => m !== e.payer); }
function spIsPaid(e, m){ return !!(e.settled && e.settled[m]); }
function spDone(e){ return spDebtors(e).every(m => spIsPaid(e, m)); }
function spAll(){
  const raw = STATE.expenses || {};
  return Object.keys(raw).map(k => Object.assign({}, raw[k], {_id:k}))
    .sort((a,b) => (a.date === b.date ? (a.createdAt || 0) - (b.createdAt || 0) : (a.date < b.date ? -1 : 1)));
}
function spSaveEntry(){
  const amt = +$('#spAmt').value;
  if (!amt || amt <= 0) { toast('請先輸入金額'); return; }
  if (!spWho.length) { toast('請至少選一位參與者'); return; }
  if (!ROOT) { toast('目前無法連線資料庫'); return; }
  ROOT.child('expenses').push({
    payer:spPayer, amt, cur:spCur, date:$('#spDate').value, who:spWho.slice(),
    cat:spCat, note:$('#spNote').value.trim(), desc:$('#spDesc').value.trim(),
    rate:RATE, createdAt:Date.now()
  }).then(() => { stamp(); $('#spAmt').value = ''; $('#spNote').value = ''; $('#spDesc').value = ''; toast('已記下這筆'); });
}
function spSettleText(paid, owe){
  const deb = [], cre = [];
  MEMBERS.forEach(m => { const b = (paid[m] || 0) - (owe[m] || 0);
    if (b < -0.5) deb.push({m:m, v:-b}); else if (b > 0.5) cre.push({m:m, v:b}); });
  const out = []; let i = 0, j = 0;
  while (i < deb.length && j < cre.length){
    const v = Math.min(deb[i].v, cre[j].v);
    out.push(deb[i].m + ' → ' + cre[j].m + '　' + nt(v) + '（' + jpOf(v) + '）');
    deb[i].v -= v; cre[j].v -= v;
    if (deb[i].v < 0.5) i++;
    if (cre[j].v < 0.5) j++;
  }
  return out.length ? out.join('<br>') : '目前已經平帳';
}
function renderSplit(){
  if (!$('#spList')) return;
  if (!$('#spPayer').children.length) spBuildForm();
  const items = spAll();
  const total = items.reduce((s,e) => s + spTwd(e), 0);
  $('#spTotal').textContent = nt(total) + '（' + jpOf(total) + '）';
  const paid = {}, owe = {};
  MEMBERS.forEach(m => { paid[m] = 0; owe[m] = 0; });
  items.forEach(e => {
    const per = spPer(e);
    let recovered = 0;
    spWhoOf(e).forEach(m => {
      if (m === e.payer) { owe[m] = (owe[m] || 0) + per; return; }
      if (spIsPaid(e, m)) { recovered += per; return; }   // 已還錢：兩邊都不再計
      owe[m] = (owe[m] || 0) + per;
    });
    paid[e.payer] = (paid[e.payer] || 0) + spTwd(e) - recovered;
  });
  const spent = {}; MEMBERS.forEach(m => spent[m] = 0);
  items.forEach(e => { spent[e.payer] = (spent[e.payer] || 0) + spTwd(e); });
  $('#spSummary').innerHTML = MEMBERS.filter(m => spent[m] > 0.5).map(m =>
      '<div class="sprow"><b>' + m + '</b><span>支出 ' + nt(spent[m]) + '（' + jpOf(spent[m]) + '）</span>'
      + '<span class="v">' + Math.round(spent[m] / (total || 1) * 100) + '%</span></div>'
    ).join('')
    + (total ? '<div class="spsettle"><b style="font-weight:500">誰要給誰錢</b><br>' + spSettleText(paid, owe) + '</div>'
             : '<div class="utility-empty">還沒有支出紀錄</div>');

  const nDone = items.filter(spDone).length;
  const fl = [['all','全部 ' + items.length], ['wait','待收錢 ' + (items.length - nDone)], ['done','已收完 ' + nDone]];
  $('#spFilter').innerHTML = fl.map(f =>
    '<button class="catchip' + (spFilter === f[0] ? ' on' : '') + '" data-spf="' + f[0] + '">' + f[1] + '</button>').join('');
  const stageItems = items.filter(e => spFilter === 'all' || (spFilter === 'done' ? spDone(e) : !spDone(e)));
  const cf = [['all','全部類型']].concat(SP_CATS.map(c =>
    [c, (SP_ICON[c] || '') + ' ' + c + ' ' + stageItems.filter(e => e.cat === c).length]));
  $('#spCatFilter').innerHTML = cf.map(f =>
    '<button class="catchip' + (spCatFilter === f[0] ? ' on' : '') + '" data-spcf="' + f[0] + '">' + f[1] + '</button>').join('');
  const shown = stageItems.filter(e => spCatFilter === 'all' || e.cat === spCatFilter);
  const byDay = {};
  shown.forEach(e => { (byDay[e.date] = byDay[e.date] || []).push(e); });
  const keys = Object.keys(byDay).sort();
  $('#spList').innerHTML = keys.length ? keys.map(iso => {
    const d = DAYS.find(x => x.iso === iso), rows = byDay[iso];
    const sum = rows.reduce((s,e) => s + spTwd(e), 0);
    return '<div class="spday">' + (d ? d.date + '（' + d.dow + '）' : iso) + ' ・ ' + rows.length + ' 筆 ・ ' + nt(sum) + '</div>'
      + rows.map(e => '<div class="spitem"><span class="ic">' + (SP_ICON[e.cat] || '🧾') + '</span>'
        + '<span class="tx"><span class="t1">' + esc(e.note || e.cat) + '</span>'
        + '<span class="t2"><span class="ln"><b class="payer">' + esc(e.payer) + '</b> 付 ・ ' + esc(e.cat)
        + ' ・ ' + spWhoOf(e).length + ' 人分</span>'
        + '<span class="ln">每人 ' + jp(spPerJpy(e)) + '（' + nt(spPer(e)) + '）</span>'
        + '<span class="ln dim">匯率 ' + (+(e.rate || RATE)).toFixed(4) + '</span></span></span>'
        + '<span class="am">' + (e.cur === 'JPY' ? '¥ ' + (+e.amt).toLocaleString('zh-TW') : nt(e.amt))
        + (e.cur === 'JPY' ? '<small>' + nt(spTwd(e)) + '</small>' : '') + '</span>'
        + '<span class="spacts"><button class="x" data-sp-edit="' + e._id + '" aria-label="編輯">✎</button>'
        + '<button class="x" data-sp-del="' + e._id + '" aria-label="刪除">×</button></span></div>'
        + (e.desc && e.desc.trim() ? '<div class="spdesc">' + linkify(e.desc) + '</div>' : '')
        + (e.images ? '<div class="descimgs">' + Object.keys(e.images).map(k =>
              '<div class="ph"><img src="' + e.images[k] + '" alt=""><button class="rm" data-sp-rmimg="' + e._id + '|' + k + '">×</button></div>').join('') + '</div>' : '')
        + '<div class="sppays">'
        + '<span class="spstat ' + (spDone(e) ? 'done' : 'wait') + '">' + (spDone(e) ? '已收完' : '待收錢') + '</span>'
        + spDebtors(e).map(m => '<button class="paychip' + (spIsPaid(e, m) ? ' on' : '')
            + '" data-sp-paid="' + e._id + '|' + m + '"><i>' + (spIsPaid(e, m) ? '✓' : '○') + '</i>' + m + '</button>').join('')
        + (spDebtors(e).length ? '' : '<span class="wholbl">只有 ' + esc(e.payer) + ' 分，無需收錢</span>')
        + '</div>').join('');
  }).join('') : '<div class="utility-empty">還沒有支出紀錄</div>';
}
document.addEventListener('click', e => {
  const p = e.target.closest('[data-payer]');
  if (p){ spPayer = p.dataset.payer; $$('#spPayer [data-payer]').forEach(x => x.classList.toggle('on', x === p)); return; }
  const c = e.target.closest('[data-cat]');
  if (c){ spCat = c.dataset.cat; $$('#spCat [data-cat]').forEach(x => x.classList.toggle('on', x === c)); return; }
  const cu = e.target.closest('[data-cur]');
  if (cu){ spCur = cu.dataset.cur; $$('#spCur [data-cur]').forEach(x => x.classList.toggle('on', x === cu)); return; }
  const w = e.target.closest('[data-who]');
  if (w){
    const m = w.dataset.who, i = spWho.indexOf(m);
    if (i > -1) spWho.splice(i,1); else spWho.push(m);
    w.classList.toggle('on', spWho.indexOf(m) > -1);
    return;
  }
  const f = e.target.closest('[data-spf]');
  if (f){ spFilter = f.dataset.spf; renderSplit(); return; }
  const cf2 = e.target.closest('[data-spcf]');
  if (cf2){ spCatFilter = cf2.dataset.spcf; renderSplit(); return; }
  const pay = e.target.closest('[data-sp-paid]');
  if (pay && ROOT){
    const parts = pay.dataset.spPaid.split('|');
    const cur = pay.classList.contains('on');
    ROOT.child('expenses/' + parts[0] + '/settled/' + parts[1]).set(cur ? null : true).then(stamp);
    return;
  }
  const rmi = e.target.closest('[data-sp-rmimg]');
  if (rmi && ROOT){
    const p = rmi.dataset.spRmimg.split('|');
    ROOT.child('expenses/' + p[0] + '/images/' + p[1]).remove().then(stamp);
    return;
  }
  const ed = e.target.closest('[data-sp-edit]');
  if (ed){ spEditSheet(ed.dataset.spEdit); return; }
  const del = e.target.closest('[data-sp-del]');
  if (del && ROOT){ ROOT.child('expenses/' + del.dataset.spDel).remove().then(() => { stamp(); toast('已刪除'); }); }
});
function spUploadImage(id, f){
  if (!f || !ROOT) return;
  const fr = new FileReader(), img = new Image();
  fr.onload = () => { img.src = fr.result; };
  img.onload = () => {
    const max = 900, sc = Math.min(1, max / Math.max(img.width, img.height));
    const c = document.createElement('canvas');
    c.width = Math.round(img.width * sc); c.height = Math.round(img.height * sc);
    c.getContext('2d').drawImage(img, 0, 0, c.width, c.height);
    const data = c.toDataURL('image/jpeg', .62);
    if (data.length > 900000) { toast('圖片太大，請選小一點的'); return; }
    ROOT.child('expenses/' + id + '/images').push(data).then(() => { stamp(); toast('圖片已加入'); });
  };
  fr.readAsDataURL(f);
}
function spEditSheet(id){
  const e = (STATE.expenses || {})[id]; if (!e) return;
  const who = (e.who && e.who.length) ? e.who : MEMBERS;
  openSheet('<h3>編輯這筆支出</h3>'
    + '<div class="f"><label>付款人</label><select id="x-payer">'
    + MEMBERS.map(m => '<option' + (m === e.payer ? ' selected' : '') + '>' + m + '</option>').join('') + '</select></div>'
    + '<div class="f2"><div class="f"><label>金額</label><input id="x-amt" type="number" inputmode="decimal" value="' + (+e.amt || 0) + '"></div>'
    + '<div class="f"><label>幣別</label><select id="x-cur"><option value="JPY"' + (e.cur === 'JPY' ? ' selected' : '') + '>日円 ¥</option>'
    + '<option value="TWD"' + (e.cur === 'TWD' ? ' selected' : '') + '>台幣 NT$</option></select></div></div>'
    + '<div class="f"><label>日期</label><select id="x-date">'
    + DAYS.map(d => '<option value="' + d.iso + '"' + (d.iso === e.date ? ' selected' : '') + '>' + d.date + '（' + d.dow + '）</option>').join('')
    + '</select></div>'
    + '<div class="f"><label>類型</label><select id="x-cat">'
    + SP_CATS.map(c => '<option' + (c === e.cat ? ' selected' : '') + '>' + c + '</option>').join('') + '</select></div>'
    + '<div class="f"><label>支出名稱</label><input id="x-note" value="' + esc(e.note || '') + '" placeholder="例：牛舌午餐"></div>'
    + '<div class="f"><label>說明</label><textarea id="x-desc" style="min-height:80px">' + esc(e.desc || '') + '</textarea>'
    + '<div class="pastebox" id="x-paste" tabindex="0">在上面欄位或這裡按 <b>貼上</b>（Ctrl/⌘+V）可直接貼圖片</div></div>'
    + '<div class="f"><label>參與者</label><div class="chips" id="x-who">'
    + MEMBERS.map(m => '<button class="whochip' + (who.indexOf(m) > -1 ? ' on' : '') + '" data-xwho="' + m + '">' + m + '</button>').join('')
    + '</div></div>'
    + '<div class="row"><button class="btn ghost" data-close>取消</button><button class="btn edit" id="x-save">儲存</button></div>');
  const onPasteSp = ev => {
    const f = [...((ev.clipboardData || {}).items || [])]
      .map(i => i.type.indexOf('image') === 0 ? i.getAsFile() : null).find(Boolean);
    if (f){ ev.preventDefault(); spUploadImage(id, f); }
  };
  $('#x-desc').addEventListener('paste', onPasteSp);
  $('#x-paste').addEventListener('paste', onPasteSp);
  $('#x-who').addEventListener('click', ev => {
    const b = ev.target.closest('[data-xwho]'); if (b) b.classList.toggle('on');
  });
  $('#x-save').onclick = () => {
    const w = Array.from($('#x-who').querySelectorAll('.whochip.on')).map(b => b.dataset.xwho);
    if (!w.length) { toast('請至少選一位參與者'); return; }
    const amt = +$('#x-amt').value;
    if (!amt || amt <= 0) { toast('請輸入金額'); return; }
    ROOT.child('expenses/' + id).update({
      payer:$('#x-payer').value, amt, cur:$('#x-cur').value, date:$('#x-date').value,
      cat:$('#x-cat').value, note:$('#x-note').value.trim(), desc:$('#x-desc').value.trim(), who:w
    }).then(() => { stamp(); closeSheet(); toast('已更新'); });
  };
}
$('#spSave').onclick = spSaveEntry;
spBuildForm(); renderSplit();

  addEventListener('load', () => navigator.serviceWorker.register('sw.js').catch(() => {}));
