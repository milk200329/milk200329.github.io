<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>線上共同編輯器</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            max-width: 800px;
            margin: 20px auto;
            padding: 0 20px;
        }
        #editor {
            width: 100%;
            height: 300px;
            font-size: 16px;
            padding: 10px;
            box-sizing: border-box;
        }
        .status {
            color: #666;
            font-size: 14px;
            margin-top: 5px;
        }
    </style>
</head>
<body>

    <h2>多人即時共同編輯筆記</h2>
    <textarea id="editor" placeholder="在此輸入內容，其他人將會即時看到..."></textarea>
    <div class="status" id="status">正在連線...</div>

    <!-- 載入 Firebase SDK (v10+ Modular) -->
    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
        import { getDatabase, ref, onValue, set } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-database.js";

        // 1. 替換成你的 Firebase 專案設定
const firebaseConfig = {
  apiKey: "AIzaSyDxMwkCU23PB6Q60r3TWEu3elG00r4ywM0",
  authDomain: "sendai-6666.firebaseapp.com",
  databaseURL: "https://sendai-6666-default-rtdb.asia-southeast1.firebasedatabase.app",
  projectId: "sendai-6666",
  storageBucket: "sendai-6666.firebasestorage.app",
  messagingSenderId: "317293713360",
  appId: "1:317293713360:web:e3d5175a54ae43c801cbd5",
  measurementId: "G-Y1EH4G7745"
};

        // 2. 初始化 Firebase
        const app = initializeApp(firebaseConfig);
        const database = getDatabase(app);

        // 指向資料庫中的 "shared_note" 節點
        const noteRef = ref(database, 'shared_note');

        const editor = document.getElementById('editor');
        const status = document.getElementById('status');

        let isTyping = false;

        // 3. 監聽資料庫變更 (當其他人修改時，即時更新本地畫面)
        onValue(noteRef, (snapshot) => {
            const data = snapshot.val();
            // 只有當使用者沒有在打字時才更新，避免輸入輸入到一半游標跳掉
            if (!isTyping && data !== null) {
                editor.value = data;
            }
            status.textContent = "已同步最新的資料";
        });

        // 4. 當使用者輸入時，將資料寫入 Firebase
        editor.addEventListener('input', (e) => {
            isTyping = true;
            status.textContent = "儲存中...";
            
            // 更新資料庫內容
            set(noteRef, e.target.value)
                .then(() => {
                    status.textContent = "已儲存";
                })
                .catch((error) => {
                    status.textContent = "儲存失敗: " + error.message;
                });
        });

        // 標記打字結束狀態
        editor.addEventListener('blur', () => {
            isTyping = false;
        });
    </script>
</body>
</html>
