<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Sendai Trip 2026 仙台家族之旅</title>
    
    <!-- PWA Meta Tags -->
    <meta name="theme-color" content="#fbf9f5">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="default">
    <meta name="apple-mobile-web-app-title" content="仙台旅遊">
    
    <!-- Google Fonts: Noto Sans TC & Outfit -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@300;400;500;700&family=Outfit:wght@300;400;500;600&display=swap" rel="stylesheet">
    
    <!-- Leaflet CSS -->
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    
    <!-- FontAwesome Icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">

    <!-- Firebase SDK (v9 Compatibility Mode for Single File simplicity) -->
    <script src="https://www.gstatic.com/firebasejs/9.22.1/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.22.1/firebase-database-compat.js"></script>

    <style>
        :root {
            --bg-color: #fbf9f5;
            --card-bg: #ffffff;
            --text-primary: #4a443f;
            --text-secondary: #8c827a;
            --accent-warm: #d4a373;
            --accent-soft: #e7d8c9;
            --accent-light: #f3ece0;
            --border-color: #eee9e0;
            --highlight: #b5838d;
            --radius-lg: 16px;
            --radius-md: 12px;
            --radius-sm: 8px;
            --shadow: 0 4px 20px rgba(0, 0, 0, 0.03);
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Outfit', 'Noto Sans TC', sans-serif;
            -webkit-tap-highlight-color: transparent;
        }

        body {
            background-color: var(--bg-color);
            color: var(--text-primary);
            padding-bottom: 90px;
            max-width: 600px;
            margin: 0 auto;
            min-height: 100vh;
            position: relative;
        }

        /* Header Bar */
        header {
            background: rgba(251, 249, 245, 0.85);
            backdrop-filter: blur(10px);
            padding: 16px 20px;
            position: sticky;
            top: 0;
            z-index: 1000;
            border-bottom: 1px solid var(--border-color);
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        header h1 {
            font-size: 1.2rem;
            font-weight: 600;
            letter-spacing: 1px;
            color: var(--text-primary);
        }

        .sync-status {
            font-size: 0.75rem;
            padding: 4px 8px;
            border-radius: 20px;
            background: #e8f5e9;
            color: #2e7d32;
            display: flex;
            align-items: center;
            gap: 4px;
        }

        /* Hero Summary Card */
        .hero-card {
            background: var(--card-bg);
            margin: 16px;
            padding: 20px;
            border-radius: var(--radius-lg);
            border: 1px solid var(--border-color);
            box-shadow: var(--shadow);
        }

        .hero-title {
            font-size: 1.4rem;
            font-weight: 600;
            margin-bottom: 12px;
            color: var(--text-primary);
        }

        .meta-grid {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 10px;
            font-size: 0.85rem;
            color: var(--text-secondary);
        }

        .meta-item {
            display: flex;
            align-items: center;
            gap: 8px;
            background: var(--bg-color);
            padding: 8px 12px;
            border-radius: var(--radius-sm);
        }

        .meta-item i {
            color: var(--accent-warm);
        }

        /* Navigation Tabs (Days) */
        .day-nav-container {
            position: sticky;
            top: 57px;
            background: var(--bg-color);
            z-index: 999;
            padding: 8px 16px;
            border-bottom: 1px solid var(--border-color);
            overflow-x: auto;
            white-space: nowrap;
            scrollbar-width: none;
        }

        .day-nav-container::-webkit-scrollbar { display: none; }

        .day-nav {
            display: inline-flex;
            gap: 8px;
        }

        .day-btn {
            padding: 8px 14px;
            border-radius: 20px;
            border: 1px solid var(--border-color);
            background: var(--card-bg);
            color: var(--text-secondary);
            font-size: 0.85rem;
            font-weight: 500;
            cursor: pointer;
            transition: all 0.2s ease;
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        .day-btn.active {
            background: var(--accent-warm);
            color: #fff;
            border-color: var(--accent-warm);
        }

        .day-btn.is-today {
            border: 2px solid var(--highlight);
        }

        /* Widgets Section: Weather & Rates */
        .widget-row {
            display: flex;
            gap: 12px;
            margin: 0 16px 16px 16px;
        }

        .widget-card {
            flex: 1;
            background: var(--card-bg);
            padding: 14px;
            border-radius: var(--radius-md);
            border: 1px solid var(--border-color);
            font-size: 0.85rem;
        }

        .widget-title {
            color: var(--text-secondary);
            font-size: 0.75rem;
            margin-bottom: 6px;
            display: flex;
            align-items: center;
            gap: 6px;
        }

        .calc-input-group {
            display: flex;
            align-items: center;
            gap: 4px;
            margin-top: 4px;
        }

        .calc-input-group input {
            width: 100%;
            border: 1px solid var(--border-color);
            border-radius: 4px;
            padding: 4px 6px;
            font-size: 0.9rem;
            outline: none;
        }

        /* Itinerary Section */
        .day-section {
            margin: 20px 16px;
            scroll-margin-top: 120px;
        }

        .day-header {
            display: flex;
            justify-content: space-between;
            align-items: baseline;
            margin-bottom: 12px;
            padding-bottom: 6px;
            border-bottom: 2px solid var(--accent-soft);
        }

        .day-header h2 {
            font-size: 1.15rem;
            color: var(--text-primary);
        }

        .day-header .date-tag {
            font-size: 0.85rem;
            color: var(--text-secondary);
        }

        .hotel-banner {
            background: var(--accent-light);
            color: var(--text-primary);
            padding: 10px 14px;
            border-radius: var(--radius-md);
            font-size: 0.85rem;
            margin-bottom: 12px;
            display: flex;
            align-items: center;
            gap: 8px;
            border-left: 4px solid var(--accent-warm);
        }

        /* Timeline Items */
        .timeline {
            position: relative;
            padding-left: 20px;
        }

        .timeline::before {
            content: '';
            position: absolute;
            left: 6px;
            top: 10px;
            bottom: 10px;
            width: 2px;
            background: var(--border-color);
        }

        .timeline-item {
            position: relative;
            background: var(--card-bg);
            border-radius: var(--radius-md);
            padding: 12px 14px;
            margin-bottom: 12px;
            border: 1px solid var(--border-color);
            cursor: grab;
            transition: transform 0.15s, box-shadow 0.15s;
        }

        .timeline-item:active {
            cursor: grabbing;
        }

        .timeline-item.dragging {
            opacity: 0.5;
            transform: scale(0.98);
        }

        .timeline-item::before {
            content: '';
            position: absolute;
            left: -18px;
            top: 18px;
            width: 10px;
            height: 10px;
            border-radius: 50%;
            background: var(--accent-warm);
            border: 2px solid var(--bg-color);
        }

        .item-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 4px;
        }

        .item-time {
            font-size: 0.8rem;
            font-weight: 600;
            color: var(--accent-warm);
        }

        .item-title {
            font-size: 0.95rem;
            font-weight: 500;
            color: var(--text-primary);
            margin-bottom: 4px;
        }

        .item-desc {
            font-size: 0.8rem;
            color: var(--text-secondary);
            line-height: 1.4;
            white-space: pre-line;
        }

        .item-actions {
            display: flex;
            gap: 10px;
            margin-top: 8px;
            font-size: 0.8rem;
        }

        .action-btn {
            color: var(--text-secondary);
            background: none;
            border: none;
            cursor: pointer;
            display: flex;
            align-items: center;
            gap: 4px;
        }

        .action-btn:hover {
            color: var(--accent-warm);
        }

        /* Map Section */
        #map-container {
            margin: 16px;
            border-radius: var(--radius-lg);
            overflow: hidden;
            border: 1px solid var(--border-color);
            box-shadow: var(--shadow);
            background: var(--card-bg);
        }

        #map {
            height: 320px;
            width: 100%;
        }

        .map-controls {
            padding: 10px;
            display: flex;
            gap: 8px;
            background: var(--card-bg);
            border-top: 1px solid var(--border-color);
            justify-content: center;
        }

        .filter-chip {
            padding: 6px 12px;
            border-radius: 16px;
            font-size: 0.75rem;
            border: 1px solid var(--border-color);
            background: var(--bg-color);
            cursor: pointer;
        }

        .filter-chip.active {
            background: var(--text-primary);
            color: #fff;
            border-color: var(--text-primary);
        }

        /* Checklists Section */
        .tab-section {
            background: var(--card-bg);
            margin: 16px;
            padding: 16px;
            border-radius: var(--radius-lg);
            border: 1px solid var(--border-color);
        }

        .tab-title {
            font-size: 1rem;
            font-weight: 600;
            margin-bottom: 12px;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .list-item {
            display: flex;
            align-items: center;
            gap: 10px;
            padding: 8px 0;
            border-bottom: 1px dashed var(--border-color);
            font-size: 0.9rem;
        }

        .list-item input[type="checkbox"] {
            accent-color: var(--accent-warm);
            width: 16px;
            height: 16px;
        }

        .list-item.completed span {
            text-decoration: line-through;
            color: var(--text-secondary);
        }

        .add-input-group {
            display: flex;
            gap: 8px;
            margin-top: 12px;
        }

        .add-input-group input {
            flex: 1;
            padding: 8px 12px;
            border: 1px solid var(--border-color);
            border-radius: var(--radius-sm);
            outline: none;
            font-size: 0.85rem;
        }

        .add-input-group button {
            padding: 8px 14px;
            background: var(--accent-warm);
            color: white;
            border: none;
            border-radius: var(--radius-sm);
            cursor: pointer;
        }

        /* Bottom Navigation Bar */
        .bottom-nav {
            position: fixed;
            bottom: 0;
            left: 50%;
            transform: translateX(-50%);
            width: 100%;
            max-width: 600px;
            background: rgba(255, 255, 255, 0.92);
            backdrop-filter: blur(12px);
            border-top: 1px solid var(--border-color);
            display: flex;
            justify-content: space-around;
            padding: 10px 0;
            z-index: 1000;
        }

        .nav-item {
            display: flex;
            flex-direction: column;
            align-items: center;
            font-size: 0.7rem;
            color: var(--text-secondary);
            text-decoration: none;
            gap: 4px;
            cursor: pointer;
        }

        .nav-item.active {
            color: var(--accent-warm);
            font-weight: 600;
        }

        .nav-item i {
            font-size: 1.2rem;
        }

        /* Modal */
        .modal {
            display: none;
            position: fixed;
            top: 0; left: 0; right: 0; bottom: 0;
            background: rgba(0,0,0,0.4);
            z-index: 2000;
            align-items: center;
            justify-content: center;
            padding: 20px;
        }

        .modal-content {
            background: var(--card-bg);
            width: 100%;
            max-width: 450px;
            border-radius: var(--radius-lg);
            padding: 20px;
        }

        .modal-header {
            font-size: 1.1rem;
            font-weight: 600;
            margin-bottom: 16px;
        }

        .form-group {
            margin-bottom: 12px;
        }

        .form-group label {
            display: block;
            font-size: 0.8rem;
            color: var(--text-secondary);
            margin-bottom: 4px;
        }

        .form-group input, .form-group textarea, .form-group select {
            width: 100%;
            padding: 8px 12px;
            border: 1px solid var(--border-color);
            border-radius: var(--radius-sm);
            font-size: 0.9rem;
            outline: none;
        }

        .modal-footer {
            display: flex;
            justify-content: flex-end;
            gap: 8px;
            margin-top: 16px;
        }

        .btn-secondary {
            background: var(--bg-color);
            border: 1px solid var(--border-color);
            padding: 8px 16px;
            border-radius: var(--radius-sm);
            cursor: pointer;
        }

        .btn-primary {
            background: var(--accent-warm);
            color: white;
            border: none;
            padding: 8px 16px;
            border-radius: var(--radius-sm);
            cursor: pointer;
        }

        .add-btn-float {
            position: fixed;
            bottom: 75px;
            right: 20px;
            width: 48px;
            height: 48px;
            border-radius: 50%;
            background: var(--accent-warm);
            color: white;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 1.2rem;
            box-shadow: 0 4px 12px rgba(212, 163, 115, 0.4);
            border: none;
            cursor: pointer;
            z-index: 999;
        }
    </style>
</head>
<body>

    <!-- Header Bar -->
    <header>
        <h1>SENDAI 2026</h1>
        <div class="sync-status" id="syncStatus">
            <i class="fa-solid fa-cloud"></i> 線上同步中

            <div class="meta-item"><i class="fa-solid fa-plane"></i> 仙台機場 (SDJ)</div>
        </div>
    </div>

    <!-- Sticky Day Navigation Slider -->
    <div class="day-nav-container">
        <div class="day-nav" id="dayNav"></div>
    </div>

    <!-- Live Weather & Currency Converter -->
    <div class="widget-row">
        <div class="widget-card">
            <div class="widget-title"><i class="fa-solid fa-cloud-sun"></i> 仙台天氣 (Open-Meteo)</div>
            <div id="weatherInfo" style="font-weight: 500;">載入中...</div>
        </div>
        <div class="widget-card">
            <div class="widget-title"><i class="fa-solid fa-calculator"></i> 匯率試算 (JPY ➔ TWD)</div>
            <div id="rateInfo" style="font-size:0.75rem; color:var(--text-secondary);">匯率: 1 JPY ≈ <span id="rateValue">0.21</span> TWD</div>
            <div class="calc-input-group">
                <input type="number" id="jpyInput" placeholder="日幣 JPY" value="1000" oninput="convertCurrency()">
                <span>=</span>
                <span id="twdResult" style="font-weight:600; min-width:50px;">-</span> NT
            </div>
        </div>
    </div>

    <!-- Main Content Area: Itinerary View -->
    <div id="itineraryView">
        <div id="scheduleContainer"></div>
    </div>

    <!-- Map View -->
    <div id="mapSection" class="tab-section" style="display:none;">
        <div class="tab-title"><i class="fa-solid fa-map-location-dot"></i> 景點地圖 (Leaflet + OSM)</div>
        <div id="map-container">
            <div id="map"></div>
            <div class="map-controls">
                <button class="filter-chip active" onclick="toggleMapFilter('all')">全部</button>
                <button class="filter-chip" onclick="toggleMapFilter('hotel')">🏨 飯店</button>
                <button class="filter-chip" onclick="toggleMapFilter('spot')">📍 景點</button>
                <button class="filter-chip" onclick="toggleMapFilter('food')">🍴 美食</button>
            </div>
        </div>
    </div>

    <!-- Luggage & Wishlist View -->
    <div id="listSection" style="display:none;">
        <div class="tab-section">
            <div class="tab-title">
                <span><i class="fa-solid fa-suitcase"></i> 行李準備清單</span>
                <span style="font-size:0.8rem; font-weight:normal;" id="luggageCount">0/0</span>
            </div>
            <div id="luggageList"></div>
            <div class="add-input-group">
                <input type="text" id="newLuggageItem" placeholder="新增行李項目...">
                <button onclick="addChecklistItem('luggage')">新增</button>
            </div>
        </div>

        <div class="tab-section">
            <div class="tab-title">
                <span><i class="fa-solid fa-bag-shopping"></i> 願望 / 必買清單</span>
            </div>
            <div id="wishlist"></div>
            <div class="add-input-group">
                <input type="text" id="newWishItem" placeholder="新增必買或願望景點...">
                <button onclick="addChecklistItem('wishlist')">新增</button>
            </div>
        </div>
    </div>

    <!-- Floating Add Event Button -->
    <button class="add-btn-float" onclick="openAddModal()"><i class="fa-solid fa-plus"></i></button>

    <!-- Bottom Navigation Bar -->
    <div class="bottom-nav">
        <div class="nav-item active" onclick="switchMainTab('itinerary', this)">
            <i class="fa-solid fa-calendar-days"></i>
            <span>行程</span>
        </div>
        <div class="nav-item" onclick="switchMainTab('map', this)">
            <i class="fa-solid fa-map"></i>
            <span>地圖</span>
        </div>
        <div class="nav-item" onclick="switchMainTab('lists', this)">
            <i class="fa-solid fa-list-check"></i>
            <span>清單</span>
        </div>
    </div>

    <!-- Add/Edit Event Modal -->
    <div class="modal" id="eventModal">
        <div class="modal-content">
            <div class="modal-header" id="modalTitle">新增行程項目</div>
            <div class="form-group">
                <label>選擇天數</label>
                <select id="modalDaySelect"></select>
            </div>
            <div class="form-group">
                <label>時間</label>
                <input type="text" id="modalTime" placeholder="例如: 09:30 或 12:00">
            </div>
            <div class="form-group">
                <label>行程名稱</label>
                <input type="text" id="modalTitleInput" placeholder="例如: 瑞鳳殿">
            </div>
            <div class="form-group">
                <label>詳細備註 / 交通說明</label>
                <textarea id="modalDesc" rows="3" placeholder="例如: 門票購買、公車班次等..."></textarea>
            </div>
            <div class="modal-footer">
                <button class="btn-secondary" onclick="closeAddModal()">取消</button>
                <button class="btn-primary" onclick="saveEvent()">儲存</button>
            </div>
        </div>
    </div>

        // -------------------------------------------------------------

        // -------------------------------------------------------------
        // 4. FIREBASE / LOCALSTORAGE DATA BINDING
        // -------------------------------------------------------------
        function initDataSync() {
            if (db) {
                const tripRef = db.ref('sendai_trip_2026');
                tripRef.on('value', (snapshot) => {
                    const val = snapshot.val();
                    if (val) {
                        currentData = val;
                    } else {
                        tripRef.set(defaultTripData);
                    }
                    renderAll();
                    document.getElementById('syncStatus').innerHTML = `<i class="fa-solid fa-cloud"></i> 已即時同步`;
                }, (error) => {
                    console.error("Firebase read error:", error);
                    fallbackToLocalStorage();
                });
            } else {
                fallbackToLocalStorage();
            }
        }

        function fallbackToLocalStorage() {
            document.getElementById('syncStatus').innerHTML = `<i class="fa-solid fa-hard-drive"></i> 本地單機模式`;
            const local = localStorage.getItem('sendai_trip_data');
            if (local) {
                currentData = JSON.parse(local);
            }
            renderAll();
        }

        function saveData() {
            if (db) {
                db.ref('sendai_trip_2026').set(currentData);
            }
            localStorage.setItem('sendai_trip_data', JSON.stringify(currentData));
            renderAll();
        }

        // -------------------------------------------------------------
        // 5. RENDER FUNCTIONS
        // -------------------------------------------------------------
        function renderAll() {
            renderDayNav();
            renderSchedule();
            renderChecklists();
        }

        function isToday(dateStr) {
            const today = new Date();
            const year = today.getFullYear();
            const month = today.getMonth() + 1;
            const day = today.getDate();
            if (year === 2026 && month === 9) {
                const dayNum = parseInt(dateStr.split('/')[1]);
                return day === dayNum;
            }
            return false;
        }

        function renderDayNav() {
            const container = document.getElementById('dayNav');
            container.innerHTML = '';
            currentData.days.forEach((d) => {
                const btn = document.createElement('div');
                const todayClass = isToday(d.date) ? 'is-today' : '';
                btn.className = `day-btn ${todayClass}`;
                btn.onclick = () => scrollToDay(d.dayNum);
                btn.innerHTML = `<span>D${d.dayNum}</span><span style="font-size:0.7rem;">${d.date.split('(')[0]}</span>`;
                container.appendChild(btn);
            });
        }

        function renderSchedule() {
            const container = document.getElementById('scheduleContainer');
            container.innerHTML = '';

            currentData.days.forEach((day, dIdx) => {
                const sec = document.createElement('div');
                sec.className = 'day-section';
                sec.id = `day-${day.dayNum}`;

                let itemsHTML = '';
                day.items.forEach((item, iIdx) => {
                    itemsHTML += `
                        <div class="timeline-item" draggable="true" 
                             ondragstart="handleDragStart(event, ${dIdx}, ${iIdx})"
                             ondragover="handleDragOver(event)"
                             ondrop="handleDrop(event, ${dIdx}, ${iIdx})">
                            <div class="item-header">
                                <span class="item-time"><i class="fa-regular fa-clock"></i> ${item.time}</span>
                                <div style="display:flex; gap:6px;">
                                    <button class="action-btn" onclick="openGoogleNav('${encodeURIComponent(item.title)}')">
                                        <i class="fa-solid fa-location-arrow" style="color:var(--accent-warm);"></i> 導航
                                    </button>
                                    <button class="action-btn" onclick="deleteItem(${dIdx}, ${iIdx})"><i class="fa-solid fa-trash"></i></button>
                                </div>
                            </div>
                            <div class="item-title">${item.title}</div>
                            ${item.desc ? `<div class="item-desc">${item.desc}</div>` : ''}
                        </div>
                    `;
                });

                sec.innerHTML = `
                    <div class="day-header">
                        <h2>DAY ${day.dayNum} <span>${day.title}</span></h2>
                        <span class="date-tag">${day.date}</span>
                    </div>
                    <div class="hotel-banner">
                        <i class="fa-solid fa-hotel"></i>
                        <span>住宿：${day.hotel}</span>
                    </div>
                    <div class="timeline">${itemsHTML}</div>
                `;
                container.appendChild(sec);
            });
        }

        function renderChecklists() {
            const luggageBox = document.getElementById('luggageList');
            luggageBox.innerHTML = '';
            let lugChecked = 0;
            currentData.luggage.forEach((item, idx) => {
                if (item.checked) lugChecked++;
                luggageBox.innerHTML += `
                    <div class="list-item ${item.checked ? 'completed' : ''}">
                        <input type="checkbox" ${item.checked ? 'checked' : ''} onchange="toggleCheck('luggage', ${idx})">
                        <span style="flex:1;">${item.text}</span>
                        <i class="fa-solid fa-xmark" style="color:#ccc; cursor:pointer;" onclick="deleteCheckItem('luggage', ${idx})"></i>
                    </div>
                `;
            });
            document.getElementById('luggageCount').innerText = `${lugChecked}/${currentData.luggage.length}`;

            const wishBox = document.getElementById('wishlist');
            wishBox.innerHTML = '';
            currentData.wishlist.forEach((item, idx) => {
                wishBox.innerHTML += `
                    <div class="list-item ${item.checked ? 'completed' : ''}">
                        <input type="checkbox" ${item.checked ? 'checked' : ''} onchange="toggleCheck('wishlist', ${idx})">
                        <span style="flex:1;">${item.text}</span>
                        <i class="fa-solid fa-xmark" style="color:#ccc; cursor:pointer;" onclick="deleteCheckItem('wishlist', ${idx})"></i>
                    </div>
                `;
            });
        }

        // -------------------------------------------------------------
        // 6. DRAG & DROP REORDERING
        // -------------------------------------------------------------
        let dragSource = null;

        function handleDragStart(e, dayIdx, itemIdx) {
            dragSource = { dayIdx, itemIdx };
            e.target.classList.add('dragging');
            e.dataTransfer.effectAllowed = 'move';
        }

        function handleDragOver(e) {
            e.preventDefault();
            e.dataTransfer.dropEffect = 'move';
        }

        function handleDrop(e, targetDayIdx, targetItemIdx) {
            e.preventDefault();
            if (!dragSource) return;

            const movedItem = currentData.days[dragSource.dayIdx].items.splice(dragSource.itemIdx, 1)[0];
            currentData.days[targetDayIdx].items.splice(targetItemIdx, 0, movedItem);
            
            dragSource = null;
            saveData();
        }

        // -------------------------------------------------------------
        // 7. CHECKLIST & EVENT ACTIONS
        // -------------------------------------------------------------
        function toggleCheck(type, idx) {
            currentData[type][idx].checked = !currentData[type][idx].checked;
            saveData();
        }

        function addChecklistItem(type) {
            const inputId = type === 'luggage' ? 'newLuggageItem' : 'newWishItem';
            const val = document.getElementById(inputId).value.trim();
            if (!val) return;

            currentData[type].push({ id: Date.now().toString(), text: val, checked: false });
            document.getElementById(inputId).value = '';
            saveData();
        }

        function deleteCheckItem(type, idx) {
            currentData[type].splice(idx, 1);
            saveData();
        }

        function deleteItem(dayIdx, itemIdx) {
            if (confirm('確定要刪除此行程嗎？')) {
                currentData.days[dayIdx].items.splice(itemIdx, 1);
                saveData();
            }
        }

        function openAddModal() {
            const select = document.getElementById('modalDaySelect');
            select.innerHTML = '';
            currentData.days.forEach(d => {
                select.innerHTML += `<option value="${d.dayNum}">Day ${d.dayNum} (${d.date})</option>`;
            });
            document.getElementById('eventModal').style.display = 'flex';
        }

        function closeAddModal() {
            document.getElementById('eventModal').style.display = 'none';
        }

        function saveEvent() {
            const dayNum = parseInt(document.getElementById('modalDaySelect').value);
            const time = document.getElementById('modalTime').value || '全天';
            const title = document.getElementById('modalTitleInput').value.trim();
            const desc = document.getElementById('modalDesc').value.trim();

            if (!title) {
                alert('請輸入行程名稱');
                return;
            }

            const targetDay = currentData.days.find(d => d.dayNum === dayNum);
            if (targetDay) {
                targetDay.items.push({
                    id: Date.now().toString(),
                    time, title, desc
                });
                saveData();
            }

            closeAddModal();
            document.getElementById('modalTime').value = '';
            document.getElementById('modalTitleInput').value = '';
            document.getElementById('modalDesc').value = '';
        }

        // -------------------------------------------------------------
        // 8. NAVIGATION & UTILS
        // -------------------------------------------------------------
        function scrollToDay(dayNum) {
            const el = document.getElementById(`day-${dayNum}`);
            if (el) {
                el.scrollIntoView({ behavior: 'smooth' });
            }
        }

        function switchMainTab(tab, element) {
            document.querySelectorAll('.bottom-nav .nav-item').forEach(el => el.classList.remove('active'));
            element.classList.add('active');

            document.getElementById('itineraryView').style.display = tab === 'itinerary' ? 'block' : 'none';
            document.getElementById('mapSection').style.display = tab === 'map' ? 'block' : 'none';
            document.getElementById('listSection').style.display = tab === 'lists' ? 'block' : 'none';

            if (tab === 'map') {
                setTimeout(() => { initMap(); }, 200);
            }
        }

        function openGoogleNav(query) {
            const url = `https://www.google.com/maps/search/?api=1&query=${query}+仙台`;
            window.open(url, '_blank');
        }

        // -------------------------------------------------------------
        // 9. LEAFLET MAP INTEGRATION
        // -------------------------------------------------------------
        let map = null;
        let markers = [];

        function initMap() {
            if (map) return;

            map = L.map('map').setView([38.2682, 140.8694], 11);

            L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
                attribution: '&copy; OpenStreetMap'
            }).addTo(map);

            renderMapMarkers('all');
        }

        function renderMapMarkers(filter) {
            markers.forEach(m => map.removeLayer(m));
            markers = [];

            mapLocations.forEach(loc => {
                if (filter !== 'all' && loc.category !== filter) return;

                const marker = L.marker([loc.lat, loc.lng]).addTo(map);
                marker.bindPopup(`
                    <strong style="font-size:0.9rem;">${loc.name}</strong><br>
                    <a href="https://www.google.com/maps/search/?api=1&query=${encodeURIComponent(loc.name)}" 
                       target="_blank" style="color:var(--accent-warm); text-decoration:none; font-size:0.8rem; display:inline-block; margin-top:4px;">
                       <i class="fa-solid fa-diamond-turn-right"></i> 開啟 Google Maps 導航
                    </a>
                `);
                markers.push(marker);
            });
        }

        function toggleMapFilter(type) {
            document.querySelectorAll('.filter-chip').forEach(c => c.classList.remove('active'));
            event.target.classList.add('active');
            renderMapMarkers(type);
        }

        // -------------------------------------------------------------
        // 10. REAL-TIME API: WEATHER & CURRENCY
        // -------------------------------------------------------------
        async function fetchWeather() {
            try {
                const res = await fetch('https://api.open-meteo.com/v1/forecast?latitude=38.2682&longitude=140.8694&current_weather=true');
                const data = await res.json();
                const temp = data.current_weather.temperature;
                document.getElementById('weatherInfo').innerText = `仙台目前 ${temp}°C`;
            } catch(e) {
                document.getElementById('weatherInfo').innerText = `仙台約 18°C ~ 22°C`;
            }
        }

        let exchangeRate = 0.21;
        async function fetchExchangeRate() {
            try {
                const res = await fetch('https://api.exchangerate-api.com/v4/latest/JPY');
                const data = await res.json();
                if (data && data.rates && data.rates.TWD) {
                    exchangeRate = data.rates.TWD;
                    document.getElementById('rateValue').innerText = exchangeRate.toFixed(3);
                    convertCurrency();
                }
            } catch(e) {
                console.log("Rate API offline, using default 0.21");
            }
        }

        function convertCurrency() {
            const jpy = parseFloat(document.getElementById('jpyInput').value) || 0;
            const twd = Math.round(jpy * exchangeRate);
            document.getElementById('twdResult').innerText = twd;
        }

        // Initialize App
        window.onload = () => {
            initDataSync();
            fetchWeather();
            fetchExchangeRate();
            registerPWA();
        };

        // -------------------------------------------------------------
        // 11. PWA & SERVICE WORKER
        // -------------------------------------------------------------
        function registerPWA() {
            if ('serviceWorker' in navigator) {
                const swCode = `
                    const CACHE_NAME = 'sendai-pwa-v1';
                    self.addEventListener('install', (e) => self.skipWaiting());
                    self.addEventListener('activate', (e) => e.waitUntil(clients.claim()));
                    self.addEventListener('fetch', (event) => {
                        event.respondWith(
                            fetch(event.request).catch(() => caches.match(event.request))
                        );
                    });
                `;
                const blob = new Blob([swCode], { type: 'text/javascript' });
                const swUrl = URL.createObjectURL(blob);
                navigator.serviceWorker.register(swUrl).catch(err => console.log('SW error:', err));
            }
        }
    </script>
