<div class="item">
  <!-- 檢視模式 -->
  <span id="text-display">10:00 抵達沖繩美麗海水族館</span>
  
  <!-- 編輯模式（預設隱藏） -->
  <input type="text" id="text-input" value="10:00 抵達沖繩美麗海水族館" style="display: none;" />

  <!-- 按鈕區 -->
  <button id="edit-btn" onclick="toggleEdit()">編輯</button>
  <button id="save-btn" onclick="saveEdit()" style="display: none;">儲存</button>
</div>

<script>
function toggleEdit() {
  document.getElementById('text-display').style.display = 'none';
  document.getElementById('text-input').style.display = 'inline-block';
  document.getElementById('edit-btn').style.display = 'none';
  document.getElementById('save-btn').style.display = 'inline-block';
}

function saveEdit() {
  const newText = document.getElementById('text-input').value;
  document.getElementById('text-display').innerText = newText;
  
  document.getElementById('text-display').style.display = 'inline-block';
  document.getElementById('text-input').style.display = 'none';
  document.getElementById('edit-btn').style.display = 'inline-block';
  document.getElementById('save-btn').style.display = 'none';
}
</script>
