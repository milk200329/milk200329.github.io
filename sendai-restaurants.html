  <style>
    :root {
      --bg-color: #f8f6f0;
      --card-bg: #ffffff;
      --primary: #8c7a6b;
      --primary-light: #e6e0d8;
      --text-main: #4a453e;
      --text-sub: #8c857b;
      --accent-hotel: #e8d5c4;
      --accent-spot: #dbe3d5;
      --accent-food: #f3dfd1;
      --shadow: 0 4px 15px rgba(140, 122, 107, 0.08);
      --radius: 16px;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Noto Sans TC', sans-serif; -webkit-tap-highlight-color: transparent; }
    body { background-color: var(--bg-color); color: var(--text-main); padding-bottom: 90px; }

    /* Header */
    header {
      background: var(--card-bg);
      padding: 24px 20px 16px;
      border-bottom-left-radius: 24px;
      border-bottom-right-radius: 24px;
      box-shadow: var(--shadow);
      position: sticky;
      top: 0;
      z-index: 100;
    }
    .header-title { font-size: 20px; font-weight: 700; color: var(--primary); letter-spacing: 1px; }
    .header-meta { font-size: 13px; color: var(--text-sub); margin-top: 6px; display: flex; gap: 12px; flex-wrap: wrap; }
    .today-badge { background: var(--primary); color: #fff; padding: 2px 8px; border-radius: 12px; font-size: 11px; display: none; }

    /* Tabs Container */
    .tab-content { display: none; padding: 16px; animation: fadeIn 0.3s ease; }
    .tab-content.active { display: block; }
    @keyframes fadeIn { from { opacity: 0; transform: translateY(6px); } to { opacity: 1; transform: translateY(0); } }

    /* Days Bar Navigation */
    .days-nav {
      display: flex;
      gap: 10px;
      overflow-x: auto;
      padding: 12px 16px;
      background: var(--bg-color);
      scrollbar-width: none;
    }
    .days-nav::-webkit-scrollbar { display: none; }
    .day-btn {
      flex: 0 0 auto;
      padding: 8px 16px;
      background: var(--card-bg);
      border: 1px solid var(--primary-light);
      border-radius: 20px;
      font-size: 13px;
      color: var(--text-sub);
      cursor: pointer;
      transition: all 0.2s;
    }
    .day-btn.active {
      background: var(--primary);
      color: #fff;
      border-color: var(--primary);
      font-weight: 500;
      box-shadow: 0 4px 10px rgba(140, 122, 107, 0.2);
    }
    .day-btn.is-today { border: 2px solid var(--primary); }

    /* Itinerary Timeline */
    .timeline { position: relative; padding-left: 20px; margin-top: 10px; }
    .timeline::before {
      content: '';
      position: absolute;
      left: 7px;
      top: 15px;
      bottom: 15px;
      width: 2px;
      background: var(--primary-light);
    }
    .hotel-banner {
      background: var(--accent-hotel);
      color: var(--text-main);
      padding: 10px 16px;
      border-radius: var(--radius);
      margin-bottom: 16px;
      font-size: 13px;
      font-weight: 500;
      display: flex;
      align-items: center;
      gap: 8px;
    }
    .item-card {
      background: var(--card-bg);
      border-radius: var(--radius);
      padding: 14px 16px;
      margin-bottom: 14px;
      box-shadow: var(--shadow);
      position: relative;
      cursor: grab;
      transition: transform 0.2s;
    }
    .item-card::before {
      content: '';
      position: absolute;
      left: -18px;
      top: 20px;
      width: 10px;
      height: 10px;
      border-radius: 50%;
      background: var(--primary);
      border: 2px solid var(--bg-color);
    }
    .item-card.type-hotel { border-left: 4px solid #c8b6a6; }
    .item-card.type-food { border-left: 4px solid #e2b091; }
    .item-card.type-spot { border-left: 4px solid #99a799; }
    
    .item-header { display: flex; justify-content: space-between; align-items: flex-start; }
    .item-time { font-size: 12px; font-weight: 700; color: var(--primary); margin-bottom: 4px; }
    .item-title { font-size: 15px; font-weight: 700; color: var(--text-main); }
    .item-desc { font-size: 13px; color: var(--text-sub); margin-top: 6px; white-space: pre-line; line-height: 1.5; }
    .item-actions { display: flex; gap: 8px; margin-top: 10px; }
    .btn-sm {
      background: var(--bg-color);
      border: none;
      padding: 6px 12px;
      border-radius: 12px;
      font-size: 12px;
      color: var(--text-main);
      cursor: pointer;
    }

    /* Map Section */
    #map { width: 100%; height: 350px; border-radius: var(--radius); margin-bottom: 16px; }
    .map-filter { display: flex; gap: 8px; margin-bottom: 12px; }
    .filter-btn { flex: 1; padding: 8px; background: var(--card-bg); border: 1px solid var(--primary-light); border-radius: 12px; font-size: 12px; text-align: center; cursor: pointer; }
    .filter-btn.active { background: var(--primary-light); font-weight: 500; }

    /* Lists (Luggage & Wishlist) */
    .list-item {
      background: var(--card-bg);
      padding: 12px 16px;
      border-radius: var(--radius);
      margin-bottom: 8px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      box-shadow: var(--shadow);
    }
    .list-item.done span { text-decoration: line-through; color: var(--text-sub); }
    .add-input-group { display: flex; gap: 8px; margin-bottom: 16px; }
    .input-style { flex: 1; padding: 10px 14px; border: 1px solid var(--primary-light); border-radius: 12px; outline: none; background: var(--card-bg); }
    .btn-main { background: var(--primary); color: #fff; border: none; padding: 10px 16px; border-radius: 12px; cursor: pointer; }

    /* Tools (Currency & Weather) */
    .tool-card { background: var(--card-bg); padding: 16px; border-radius: var(--radius); box-shadow: var(--shadow); margin-bottom: 16px; }
    .weather-grid { display: grid; grid-template-columns: repeat(2, 1fr); gap: 10px; margin-top: 10px; }
    .weather-box { background: var(--bg-color); padding: 12px; border-radius: 12px; text-align: center; }

    /* Bottom Navigation */
    .bottom-nav {
      position: fixed;
      bottom: 0;
      left: 0;
      right: 0;
      background: var(--card-bg);
      display: flex;
      justify-content: space-around;
      padding: 10px 0 20px;
      box-shadow: 0 -4px 15px rgba(0,0,0,0.05);
      border-top-left-radius: 20px;
      border-top-right-radius: 20px;
      z-index: 1000;
    }
    .nav-item { border: none; background: none; color: var(--text-sub); font-size: 11px; display: flex; flex-direction: column; align-items: center; gap: 4px; cursor: pointer; }
    .nav-item.active { color: var(--primary); font-weight: 700; }
    .nav-icon { font-size: 18px; }

    /* Modal for Editing */
    .modal { display: none; position: fixed; inset: 0; background: rgba(0,0,0,0.4); z-index: 2000; justify-content: center; align-items: center; padding: 20px; }
    .modal.active { display: flex; }
    .modal-body { background: var(--card-bg); padding: 20px; border-radius: var(--radius); width: 100%; max-width: 400px; }
    .modal-body textarea, .modal-body input { width: 100%; margin-bottom: 10px; padding: 10px; border: 1px solid var(--primary-light); border-radius: 8px; }
  </style>

          { id: "36", time: "白天", title: "最後巡禮與採買", desc: "", type: "spot" },
          { id: "37", time: "16:30", title: "前往仙台機場", desc: "辦理登機與託運", type: "spot" },
          { id: "38", time: "19:00", title: "飛機起飛返家", desc: "仙台 ➔ 溫暖的家", type: "spot", lat: 38.1399, lng: 140.9169 }
        ]
      }
    };

    let currentDay = "9/19";
    let itineraryData = JSON.parse(localStorage.getItem('sendai_itinerary')) || defaultItinerary;
    let editingItemId = null;
    let mapInstance = null;
    let mapMarkers = [];

    // -------------------------------------------------------------
    // 3. CORE & ITINERARY RENDER
    // -------------------------------------------------------------
    function initApp() {
      checkToday();
      renderDayTabs();
      renderTimeline();
      initRealtimeSync();
      initLuggage();
      initWishlist();
      fetchCurrency();
      fetchWeather();
    }

    function checkToday() {
      const today = new Date();
      const month = today.getMonth() + 1;
      const date = today.getDate();
      const todayStr = `${month}/${date}`;
      if (itineraryData[todayStr]) {
        currentDay = todayStr;
        document.getElementById('todayBadge').style.display = 'inline-block';
      }
    }

    function renderDayTabs() {
      const nav = document.getElementById('daysNav');
      nav.innerHTML = '';
      Object.keys(itineraryData).forEach(dayKey => {
        const btn = document.createElement('button');
        btn.className = `day-btn ${dayKey === currentDay ? 'active' : ''}`;
        btn.innerText = dayKey;
        btn.onclick = () => {
          currentDay = dayKey;
          renderDayTabs();
          renderTimeline();
          if (mapInstance) updateMapMarkers();
        };
        nav.appendChild(btn);
      });
    }

    function renderTimeline() {
      const dayData = itineraryData[currentDay];
      document.getElementById('hotelBanner').innerHTML = `🏨 住宿：${dayData.hotel}`;
      const list = document.getElementById('timelineList');
      list.innerHTML = '';

      dayData.items.forEach((item, index) => {
        const card = document.createElement('div');
        card.className = `item-card type-${item.type || 'spot'}`;
        card.dataset.id = item.id;
        card.innerHTML = `
          <div class="item-header">
            <div>
              <div class="item-time">${item.time}</div>
              <div class="item-title">${item.title}</div>
            </div>
          </div>
          ${item.desc ? `<div class="item-desc">${item.desc}</div>` : ''}
          <div class="item-actions">
            <button class="btn-sm" onclick="openEditModal('${item.id}')">✏️ 編輯</button>
            ${item.lat ? `<button class="btn-sm" onclick="openGoogleNav(${item.lat}, ${item.lng}, '${item.title}')">🗺️ 導航</button>` : ''}
          </div>
        `;
        list.appendChild(card);
      });

      // Drag & Drop
      new Sortable(list, {
        animation: 150,
        onEnd: function () {
          const newItemsOrder = [];
          list.querySelectorAll('.item-card').forEach(el => {
            const id = el.dataset.id;
            const found = dayData.items.find(i => i.id === id);
            if (found) newItemsOrder.push(found);
          });
          itineraryData[currentDay].items = newItemsOrder;
          saveData();
        }
      });
    }

    // -------------------------------------------------------------
    // 4. EDIT & REALTIME SYNC
    // -------------------------------------------------------------
    function openEditModal(itemId) {
      editingItemId = itemId;
      const item = itineraryData[currentDay].items.find(i => i.id === itemId);
      if (!item) return;
      document.getElementById('editTime').value = item.time || '';
      document.getElementById('editTitle').value = item.title || '';
      document.getElementById('editDesc').value = item.desc || '';
      document.getElementById('editModal').classList.add('active');
    }

    function closeModal() {
      document.getElementById('editModal').classList.remove('active');
    }

    function saveItemEdit() {
      const item = itineraryData[currentDay].items.find(i => i.id === editingItemId);
      if (item) {
        item.time = document.getElementById('editTime').value;
        item.title = document.getElementById('editTitle').value;
        item.desc = document.getElementById('editDesc').value;
        saveData();
        renderTimeline();
      }
      closeModal();
    }

    function saveData() {
      localStorage.setItem('sendai_itinerary', JSON.stringify(itineraryData));
      if (db) {
        db.ref('itinerary').set(itineraryData);
      }
    }

    function initRealtimeSync() {
      if (!db) return;
      db.ref('itinerary').on('value', snapshot => {
        const val = snapshot.val();
        if (val) {
          itineraryData = val;
          renderTimeline();
        }
      });
    }

    // -------------------------------------------------------------
    // 5. MAP & LEAFLET
    // -------------------------------------------------------------
    function initMap() {
      if (mapInstance) return;
      mapInstance = L.map('map').setView([38.2601, 140.8824], 11);
      L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
        attribution: '© OpenStreetMap'
      }).addTo(mapInstance);
      updateMapMarkers();
    }

    function updateMapMarkers(filterCategory = 'all') {
      mapMarkers.forEach(m => mapInstance.removeLayer(m));
      mapMarkers = [];

      const dayData = itineraryData[currentDay];
      const latlngs = [];

      dayData.items.forEach(item => {
        if (item.lat && item.lng) {
          if (filterCategory !== 'all' && item.type !== filterCategory) return;

          const marker = L.marker([item.lat, item.lng]).addTo(mapInstance);
          marker.bindPopup(`
            <b>${item.title}</b><br/>${item.time}<br/>
            <a href="https://www.google.com/maps/search/?api=1&query=${item.lat},${item.lng}" target="_blank">Google 導航</a>
          `);
          mapMarkers.push(marker);
          latlngs.push([item.lat, item.lng]);
        }
      });

      if (latlngs.length > 0) {
        if (latlngs.length > 1) {
          const polyline = L.polyline(latlngs, { color: '#8c7a6b', weight: 3, dashArray: '5, 10' }).addTo(mapInstance);
          mapMarkers.push(polyline);
        }
        mapInstance.fitBounds(L.latLngBounds(latlngs).pad(0.2));
      }
    }

    function filterMap(cat) {
      document.querySelectorAll('.filter-btn').forEach(b => b.classList.remove('active'));
      event.target.classList.add('active');
      updateMapMarkers(cat);
    }

    function openGoogleNav(lat, lng, title) {
      window.open(`https://www.google.com/maps/search/?api=1&query=${lat},${lng}`, '_blank');
    }

    // -------------------------------------------------------------
    // 6. LUGGAGE & WISHLIST
    // -------------------------------------------------------------
    let luggageData = JSON.parse(localStorage.getItem('sendai_luggage')) || [
      { text: "護照 / 身分證", done: false },
      { text: "日幣現金 / 西瓜卡 (Suica)", done: false },
      { text: "網卡 / Wi-Fi 分享器", done: false },
      { text: "駕照正本 + 日文譯本 (自駕必備)", done: false },
      { text: "個人常用藥物 / 暈車藥", done: false },
      { text: "充電器 / 行動電源", done: false }
    ];

    function initLuggage() {
      renderLuggage();
    }

    function renderLuggage() {
      const container = document.getElementById('luggageList');
      container.innerHTML = '';
      luggageData.forEach((item, index) => {
        const div = document.createElement('div');
        div.className = `list-item ${item.done ? 'done' : ''}`;
        div.innerHTML = `
          <span onclick="toggleLuggage(${index})">${item.done ? '✅' : '⬜'} ${item.text}</span>
          <button class="btn-sm" onclick="deleteLuggage(${index})">🗑️</button>
        `;
        container.appendChild(div);
      });
      localStorage.setItem('sendai_luggage', JSON.stringify(luggageData));
    }

    function addLuggageItem() {
      const input = document.getElementById('luggageInput');
      if (input.value.trim()) {
        luggageData.push({ text: input.value.trim(), done: false });
        input.value = '';
        renderLuggage();
      }
    }

    function toggleLuggage(index) {
      luggageData[index].done = !luggageData[index].done;
      renderLuggage();
    }

    function deleteLuggage(index) {
      luggageData.splice(index, 1);
      renderLuggage();
    }

    // Wishlist logic
    let wishData = JSON.parse(localStorage.getItem('sendai_wish')) || [
      { text: "毛豆麻糬 (ずんだ餅)", done: false },
      { text: "牛舌零食 / 煎餅", done: false },
      { text: "SAKUSAKU 可頌", done: false }
    ];

    function initWishlist() { renderWish(); }

    function renderWish() {
      const container = document.getElementById('wishList');
      container.innerHTML = '';
      wishData.forEach((item, index) => {
        const div = document.createElement('div');
        div.className = `list-item ${item.done ? 'done' : ''}`;
        div.innerHTML = `
          <span onclick="toggleWish(${index})">${item.done ? '✨' : '⚪'} ${item.text}</span>
          <button class="btn-sm" onclick="deleteWish(${index})">🗑️</button>
        `;
        container.appendChild(div);
      });
      localStorage.setItem('sendai_wish', JSON.stringify(wishData));
    }

    function addWishItem() {
      const input = document.getElementById('wishInput');
      if (input.value.trim()) {
        wishData.push({ text: input.value.trim(), done: false });
        input.value = '';
        renderWish();
      }
    }
    function toggleWish(i) { wishData[i].done = !wishData[i].done; renderWish(); }
    function deleteWish(i) { wishData.splice(i, 1); renderWish(); }

    // -------------------------------------------------------------
    // 7. TOOLS (CURRENCY & WEATHER)
    // -------------------------------------------------------------
    let currentRate = 0.215; // default fallback

    async function fetchCurrency() {
      try {
        const res = await fetch('https://api.exchangerate-api.com/v4/latest/JPY');
        const data = await res.json();
        if (data && data.rates && data.rates.TWD) {
          currentRate = data.rates.TWD;
          document.getElementById('rateInfo').innerText = `即時匯率：1 JPY ≈ ${currentRate.toFixed(4)} TWD`;
        }
      } catch (e) {
        document.getElementById('rateInfo').innerText = `使用預設預估匯率：1 JPY ≈ ${currentRate} TWD`;
      }
    }

    function convertCurrency() {
      const jpy = parseFloat(document.getElementById('jpyAmount').value);
      if (!isNaN(jpy)) {
        document.getElementById('twdAmount').value = `NT$ ${Math.round(jpy * currentRate)}`;
      } else {
        document.getElementById('twdAmount').value = '';
      }
    }

    async function fetchWeather() {
      try {
        // Sendai lat/lng: 38.2682, 140.8694
        const res = await fetch('https://api.open-meteo.com/v1/forecast?latitude=38.2682&longitude=140.8694&current_weather=true&daily=temperature_2m_max,temperature_2m_min&timezone=Asia%2FTokyo');
        const data = await res.json();
        const cur = data.current_weather;
        document.getElementById('weatherBox').innerHTML = `
          <div class="weather-box">
            <div style="font-size: 12px; color: var(--text-sub);">目前氣溫</div>
            <div style="font-size: 20px; font-weight: 700;">${cur.temperature}°C</div>
          </div>
          <div class="weather-box">
            <div style="font-size: 12px; color: var(--text-sub);">風速 / 狀況</div>
            <div style="font-size: 14px; font-weight: 500; margin-top: 4px;">🌬️ ${cur.windspeed} km/h</div>
          </div>
        `;
      } catch (e) {
        document.getElementById('weatherBox').innerHTML = `<div class="weather-box">無法取得天氣資料</div>`;
      }
    }

    // Tab Switching
    function switchTab(tabKey, btnEl) {
      document.querySelectorAll('.tab-content').forEach(el => el.classList.remove('active'));
      document.querySelectorAll('.nav-item').forEach(el => el.classList.remove('active'));
      
      document.getElementById(`tab-${tabKey}`).classList.add('active');
      btnEl.classList.add('active');

      if (tabKey === 'map') {
        setTimeout(() => {
          initMap();
          mapInstance.invalidateSize();
        }, 100);
      }
    }

    // Initialize App
    window.onload = initApp;
  </script>
</body>
</html>
